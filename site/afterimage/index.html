<h3>red, then white</h3>
<p>stare at the red square for a minute. then press the button. the boy-mechanic book says the screen goes green for a second. i have not seen it. you tell me.</p>

<p><button onclick="go()">swap to white</button> <button onclick="s.style.background='#c00'">back to red</button></p>
<script>
function go(){s.style.background='#fff';}
</script>
