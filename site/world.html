function wallTexture(kind){
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  if (kind === 'brick'){
    g.fillStyle = '#7a4536'; g.fillRect(0,0,256,256);
    for (let row=0; row<16; row++){
      const off = (row%2) ? 16 : 0;
      for (let col=-1; col<9; col++){
        const x = col*32 + off, y = row*16;
        g.fillStyle = `hsl(${12+Math.random()*12} ${34+Math.random()*16}% ${28+Math.random()*13}%)`;
        g.fillRect(x+1.2, y+1.2, 29.6, 13.6);
      }
    }
  } else if (kind === 'stone' || kind === 'stone_tall'){
    g.fillStyle = '#6d675c'; g.fillRect(0,0,256,256);
    for (let i=0;i<110;i++){
      const w = 22+Math.random()*40, hh = 14+Math.random()*20;
      g.fillStyle = `hsl(${38+Math.random()*16} ${6+Math.random()*10}% ${38+Math.random()*20}%)`;
      g.fillRect(Math.random()*256, Math.random()*256, w, hh);
    }
  } else if (kind === 'timber'){
    g.fillStyle = '#d6c7a8'; g.fillRect(0,0,256,256);
    g.fillStyle = '#4a3526';
    g.fillRect(0,0,256,18); g.fillRect(0,238,256,18);
    g.fillRect(0,0,18,256); g.fillRect(238,0,18,256);
    g.fillRect(119,0,18,256);
    g.save(); g.translate(128,128); g.rotate(Math.PI/4);
    g.fillRect(-9,-150,18,300); g.restore();
  } else if (kind === 'boards' || kind === 'flags'){
    const stone = kind === 'flags';
    g.fillStyle = stone ? '#55504a' : '#6a4d2f'; g.fillRect(0,0,256,256);
    const W = stone ? 64 : 42;                     // plank or flagstone width
    for (let i = 0; i < 256/W + 1; i++){
      const y = i*W;
      const hue = stone ? 34 + Math.random()*8 : 26 + Math.random()*10;
      const sat = stone ? 7 + Math.random()*6 : 26 + Math.random()*14;
      const lit = stone ? 34 + Math.random()*10 : 28 + Math.random()*12;
      g.fillStyle = `hsl(${hue} ${sat}% ${lit}%)`;
      g.fillRect(0, y+1.5, 256, W-3);
      for (let k = 0; k < (stone ? 3 : 10); k++){   // grain, or wear
        g.strokeStyle = `hsla(${hue} ${sat}% ${lit + (Math.random()<.5?-8:7)}% / .35)`;
        g.lineWidth = stone ? 2 : 1;
        g.beginPath();
        const yy = y + 3 + Math.random()*(W-6);
        g.moveTo(0, yy);
        g.bezierCurveTo(85, yy + (Math.random()-.5)*4, 170, yy + (Math.random()-.5)*4, 256, yy);
        g.stroke();
      }
      if (stone){                                   // vertical joints between flags
        for (let x = (i%2?32:0); x < 256; x += 64){
          g.fillStyle = '#2e2a26'; g.fillRect(x-1.5, y+1.5, 3, W-3);
        }
      }
    }
  } else if (kind === 'klinker'){            // dutch red brick, laid herringbone
    g.fillStyle = '#4a2a22'; g.fillRect(0,0,256,256);        // the dark joint behind
    const W = 16, L = W*2;                                   // brick: 32 long, 16 wide
    const lay = (x, y, w2, h2) => {
      const hue = 6 + Math.random()*10;
      const sat = 38 + Math.random()*20;
      const lit = 19 + Math.random()*12;
      g.fillStyle = `hsl(${hue} ${sat}% ${lit}%)`;
      g.fillRect(x+1, y+1, w2-2, h2-2);
      g.fillStyle = `hsla(${hue} ${sat}% ${lit+8}% / .5)`;    // worn top edge
      g.fillRect(x+1, y+1, w2-2, 1.5);
      if (Math.random() < .18){                              // the odd pale one
        g.fillStyle = `hsla(30 20% 38% / .55)`;
        g.fillRect(x+1, y+1, w2-2, h2-2);
      }
    };
    // the unit cell is L x L and holds one brick lying down and one standing,
    // offset so the next cell interlocks with it. that is the zigzag.
    for (let r = -1; r <= 256/L; r++){
      for (let c = -1; c <= 256/L; c++){
        const x = c*L + (r % 2 ? W : 0), y = r*L;
        lay(x,     y,     L, W);
        lay(x,     y + W, W, L);
        lay(x + W, y + W, W, L);
      }
    }
    for (let i=0;i<420;i++){                                 // moss and grit in the joints
      g.fillStyle = Math.random() < .4
        ? `hsla(${72+Math.random()*28} 38% ${22+Math.random()*14}% / .75)`
        : `hsla(16 14% ${9+Math.random()*9}% / .5)`;
      g.fillRect(Math.random()*256, Math.random()*256, 1+Math.random()*3, 1+Math.random()*2.5);
    }
  } else {                                     // shopfront: painted boards
    g.fillStyle = '#3f5a55'; g.fillRect(0,0,256,256);
    for (let i=0;i<256;i+=22){
      g.fillStyle = `hsl(172 ${16+Math.random()*8}% ${20+Math.random()*9}%)`;
      g.fillRect(i,0,20,256);
    }
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
const TEX = {};
// one canvas per kind, but a fresh Texture each time: repeat is per-surface, and
// handing out the same object let the last building built retile all the others.
function tex(kind){
  const base = TEX[kind] || (TEX[kind] = wallTexture(kind));
  const t = base.clone(); t.needsUpdate = true; return t;
}

// Floors get their own texture sized to the room and used once, with no repeat
// at all. Tiling a 256px pattern across a floor you look along at a low angle
// puts the seam and the stone grid out of step, and that beat is what showed up
// as pale stripes running away from you in every building.
function floorTexture(stone, w, d){
  const PPM = 90, MAX = 512;
  const c = document.createElement('canvas');
  c.width  = Math.max(256, Math.min(MAX, Math.round(w*PPM)));
  c.height = Math.max(256, Math.min(MAX, Math.round(d*PPM)));
  const g = c.getContext('2d');
  const px = c.width/w, pz = c.height/d;
  g.fillStyle = stone ? '#55504a' : '#6a4d2f'; g.fillRect(0,0,c.width,c.height);
  const RW = (stone ? 0.74 : 0.22) * pz;          // flagstone course, or plank width
  const J  = stone ? 2.2 : 1.6;                   // joint
  for (let i = 0, rows = Math.ceil(c.height/RW); i < rows; i++){
    const y = i*RW;
    const hue = stone ? 34+Math.random()*8 : 26+Math.random()*10;
    const sat = stone ?  7+Math.random()*5 : 26+Math.random()*12;
    const lit = stone ? 36+Math.random()*6 : 29+Math.random()*9;
    g.fillStyle = `hsl(${hue} ${sat}% ${lit}%)`;
    g.fillRect(0, y+J/2, c.width, RW-J);
    for (let k = 0; k < (stone ? 2 : 4); k++){    // grain, kept faint
      g.strokeStyle = `hsla(${hue} ${sat}% ${lit + (Math.random()<.5?-5:5)}% / .16)`;
      g.lineWidth = stone ? 1.5 : 1;
      const yy = y + 3 + Math.random()*Math.max(1, RW-6);
      g.beginPath(); g.moveTo(0, yy);
      g.bezierCurveTo(c.width*.33, yy+(Math.random()-.5)*3,
                      c.width*.66, yy+(Math.random()-.5)*3, c.width, yy);
      g.stroke();
    }
    if (stone){                                   // joints between flags, staggered
      const CW = 0.86*px, off = (i%2 ? CW/2 : 0);
      g.fillStyle = '#423b34';
      for (let x = off; x < c.width + CW; x += CW) g.fillRect(x-J/2, y+J/2, J, RW-J);
    }
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.ClampToEdgeWrapping;  // used once, so nothing to wrap
  t.anisotropy = 8;
  return t;
}

/* ---------- trees ---------- */
/* One tree used to be thirty-three separate meshes, each with a material and a
   geometry of its own: a trunk, six leaf blobs and twenty-six fronds. With
   willows down both sides of every stretch of water that came to two and a half
   thousand objects in the village and about as many materials, which is what
   made walking stutter.

   Now the parts that share a colour are merged into one piece of geometry per
   tree, and the materials are made once and shared. A willow is three meshes. */
const TREEMAT = {
  trunk:  new THREE.MeshStandardMaterial({color:0x5b4430, roughness:1}),
  frond:  new THREE.MeshStandardMaterial({color:0x7d9a52, roughness:1}),
  pear:   new THREE.MeshStandardMaterial({color:0xd8c251, roughness:.7, emissive:0x2a2408}),
  fallen: new THREE.MeshStandardMaterial({color:0xb8a046, roughness:.9}),
  leaf:   {},         // one per kind, filled below
};
for (const [k, c] of [['pear',0x5f7d3a], ['willow',0x6f8a4a], ['tree',0x4e6b33]])
  TREEMAT.leaf[k] = new THREE.MeshStandardMaterial({color:c, roughness:1});

// shapes made once and reused, positioned by baking the transform into a copy
const TREEGEO = {
  blob:  new THREE.SphereGeometry(1, 9, 7),
  frond: new THREE.CylinderGeometry(.025, .008, 1, 4),
  fruit: new THREE.SphereGeometry(.13, 7, 6),
};

/* ---------- the trees ----------
   Five Dutch species: grove den, ruwe berk, zwarte els, winterlinde, beuk.
   Every one is a trunk plus merged blobs, with no branching structure
   anywhere, because a tree built from real branches is thousands of pieces
   and these have to stand by the dozen. Each comes out as three or four
   meshes on shared materials.

   A tree is grown from its own position, so the same tree stands in the same
   spot every time the world is rebuilt instead of a new one each refresh.
   Alder goes where the ground is wet, pear stays in the orchard, and the rest
   are scattered. TREE_SCALE comes from the world file, so their height is one
   number to turn. */
const SPECIES_TREE = ['den', 'berk', 'els', 'linde', 'beuk'];
const BARKC = {den:0x4a3a2e, berk:0xd8d0c0, els:0x3d342c, linde:0x55493b,
               beuk:0x7d7468, pear:0x5b4430};
const LEAFC = {den:0x3f5230, berk:0x6f8a3c, els:0x47612f, linde:0x5d7a35,
               beuk:0x55702f, pear:0x5f7d3a};
const SMAT = {};
const smat = c => SMAT[c] ||
  (SMAT[c] = new THREE.MeshStandardMaterial({color:c, roughness:1}));
let TREE_SCALE = 1.0;

function makeTree(x, z, kind){
  const y = landHeight(x, z);
  const g = new THREE.Group();
  let id = kind === 'pear' ? 'pear' : kind === 'willow' ? 'els' : null;

  // its own position is its seed, so it does not change under you
  let s = ((Math.round(x * 73.7) * 73856093) ^ (Math.round(z * 73.7) * 19349663)) >>> 0;
  s = s || 1;
  const R = () => { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; s >>>= 0;
                    return s / 4294967296; };
  if (!id) id = SPECIES_TREE[(R() * SPECIES_TREE.length) | 0];

  const bark = [], leaf = [], upper = [], marks = [], fruit = [], fallen = [];
  const push = (list, geo, px, py, pz, sx, sy, sz, rz) => {
    const q = geo.clone();
    if (sx !== undefined) q.scale(sx, sy, sz);
    if (rz) q.rotateZ(rz);
    q.translate(px, py, pz);
    list.push(q);
  };
  const stem = (r0, r1, h, px, py, pz, lean) =>
    push(bark, new THREE.CylinderGeometry(r0, r1, h, 8), px, py + h / 2, pz,
         undefined, undefined, undefined, lean);
  const crown = (px, py, pz, r, flat) =>
    push(leaf, TREEGEO.blob, px, py, pz, r, r * (flat || 1), r);
  const lean = (R() - .5) * .07;

  if (id === 'den'){                       // long bare trunk, orange top, flat crown
    const h = 9.5 + R() * 2.5;
    stem(.22, .55, h * .62, 0, 0, 0, lean);
    push(upper, new THREE.CylinderGeometry(.16, .24, h * .42, 8),
         0, h * .62 + h * .21, 0);
    for (let i = 0; i < 2; i++){
      const a = R() * 6.3, ln = 1.2 + R() * .8;
      push(bark, new THREE.CylinderGeometry(.05, .09, ln, 5),
           Math.cos(a) * ln * .4, h * .5 + i * 1.2, Math.sin(a) * ln * .4,
           undefined, undefined, undefined, Math.PI / 2.4);
    }
    const top = h * .92, n = 4 + (R() * 3 | 0);
    for (let i = 0; i < n; i++){
      const a = R() * 6.3, rr = R() * 1.9;
      crown(Math.cos(a) * rr, top + (R() - .5) * 1.0, Math.sin(a) * rr,
            1.5 + R() * .9, .42);
    }
  }

  if (id === 'berk'){                      // slender, pale, with the dark marks
    const h = 8.5 + R() * 2.0;
    stem(.13, .30, h, 0, 0, 0, lean);
    for (let i = 0; i < 14; i++){
      const a = R() * 6.3;
      push(marks, new THREE.BoxGeometry(.19, .05, .06),
           Math.cos(a) * .22, R() * h * .8, Math.sin(a) * .22);
    }
    const n = 9 + (R() * 3 | 0);
    for (let i = 0; i < n; i++){
      const a = R() * 6.3, rr = R() * 1.5;
      crown(Math.cos(a) * rr, h * .68 + R() * h * .36, Math.sin(a) * rr,
            .75 + R() * .6, .9);
    }
    for (let i = 0; i < 5; i++){
      const a = R() * 6.3, rr = 1.1 + R() * .9;
      push(leaf, new THREE.ConeGeometry(.3, 1.3 + R(), 5),
           Math.cos(a) * rr, h * .78 + R() * 1.4, Math.sin(a) * rr,
           undefined, undefined, undefined, Math.PI);
    }
  }

  if (id === 'els'){                       // two or three stems, narrow crown
    const h = 7.5 + R() * 1.6, stems = 2 + (R() * 2 | 0);
    for (let k = 0; k < stems; k++){
      const a = k / stems * 6.3 + R(), off = k === 0 ? 0 : .35 + R() * .3;
      stem(.11, .26, h * (k === 0 ? 1 : .82 + R() * .14),
           Math.cos(a) * off, 0, Math.sin(a) * off, (R() - .5) * .14);
    }
    const n = 10 + (R() * 4 | 0);
    for (let i = 0; i < n; i++){
      const u = i / n, a = R() * 6.3, rr = (1 - u * .55) * (R() * 1.5);
      crown(Math.cos(a) * rr, h * .42 + u * h * .62, Math.sin(a) * rr,
            .7 + R() * .55, .95);
    }
  }

  if (id === 'linde'){                     // a tall even dome on a clean trunk
    const h = 10 + R() * 2.2;
    stem(.26, .62, h * .52, 0, 0, 0, lean);
    const c = h * .80;
    crown(0, c, 0, 2.9 + R() * .5, .92);
    for (let i = 0; i < 5; i++){
      const a = i / 5 * 6.3 + R() * .6, rr = 1.7 + R() * .8;
      crown(Math.cos(a) * rr, c - .6 + R() * 1.8, Math.sin(a) * rr,
            1.5 + R() * .7, .88);
    }
  }

  if (id === 'beuk'){                      // heavy, forks low, crown wider than tall
    const h = 9 + R() * 2;
    stem(.55, .95, h * .42, 0, 0, 0, lean);
    for (let i = 0; i < 3; i++){
      const a = i / 3 * 6.3 + R() * .5;
      push(bark, new THREE.CylinderGeometry(.16, .36, h * .40, 7),
           Math.cos(a) * .85, h * .42 + h * .20, Math.sin(a) * .85,
           undefined, undefined, undefined, -Math.cos(a) * .3);
    }
    const c = h * .76, n = 5 + (R() * 2 | 0);
    for (let i = 0; i < n; i++){
      const a = i / n * 6.3 + R() * .5, rr = R() * 2.6;
      crown(Math.cos(a) * rr, c + (R() - .5) * 2.2, Math.sin(a) * rr,
            2.1 + R() * .8, .78);
    }
  }

  if (id === 'pear'){                      // the orchard, unchanged
    const h = 2.2 + R() * 1.3;
    stem(.16, .3, h, 0, 0, 0, lean);
    for (let i = 0; i < 5; i++){
      const r = .9 + R() * .75;
      crown((R() - .5) * 1.5, h + .4 + R() * 1.3, (R() - .5) * 1.5, r);
    }
    for (let i = 0; i < 13; i++)
      push(fruit, TREEGEO.fruit, (R() - .5) * 2.1, h + .2 + R() * 1.5,
           (R() - .5) * 2.1, 1, 1.35, 1);
    for (let i = 0; i < 5; i++){
      const a = R() * 6.3, rr = .6 + R() * 1.4;
      push(fallen, TREEGEO.fruit, Math.cos(a) * rr, .1, Math.sin(a) * rr);
    }
  }

  const emit = (parts, mat, shadow) => {
    if (!parts.length) return;
    const m = new THREE.Mesh(mergeGeometries(parts, false), mat);
    m.castShadow = shadow; m.receiveShadow = true; g.add(m);
    for (const q of parts) q.dispose();
  };
  emit(bark,  smat(BARKC[id]), true);
  emit(upper, smat(0xa85c2a), true);       // scots pine goes orange up top
  emit(leaf,  smat(LEAFC[id]), true);
  emit(marks, smat(0x2e2a26), false);
  emit(fruit, TREEMAT.pear, false);
  emit(fallen, TREEMAT.fallen, false);

  g.position.set(x, y, z);
  if (id !== 'pear') g.scale.setScalar(TREE_SCALE);
  return g;
}

function sprite(text, pos, size=.6, colour='#8e8779'){
  const c=document.createElement('canvas'), x=c.getContext('2d');
  c.width=512; c.height=96;
  x.font='600 42px ui-monospace, Menlo, monospace'; x.fillStyle=colour;
  x.textAlign='center'; x.textBaseline='middle'; x.fillText(text,256,48);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),
    transparent:true, depthTest:true, depthWrite:false}));
  s.position.copy(pos); s.scale.set(size*6,size*1.12,1); s.renderOrder=6; return s;
}

/* ---------- places ---------- */
function tint(base, colour){
  if (!colour) return base;
  try { return new THREE.Color(colour).getHex(); } catch(e){ return base; }
}
/* ---------- buildings designed by hand ----------
   Most places are generated from their kind and style. A place can instead set
   build:"name" and get a builder from here, so a building that was designed
   rather than generated keeps its design. The design work happens in a mockup
   outside his world; this is where an approved one lands.

   These are solid: the viewer can walk round them and look in through the
   glass, but not walk in. He goes inside; you watch from the lane. */
const BUILDERS = {};

BUILDERS.cafe = function(id, p){
  const [x,,z] = p.pos, [w,h,d] = p.size;
  const gy = landHeight(x, z);
  const tag = {name:p.name, note:p.description, id};
  const T = .3;

  // which wall the frontage is on. "west" means it faces -x, onto the back lane.
  const face = p.face || 'south';
  const ax = (face === 'west' || face === 'east') ? 'x' : 'z';
  const sgn = (face === 'west' || face === 'north') ? -1 : 1;
  const along = ax === 'x' ? d : w;          // the frontage runs this way
  const deep  = ax === 'x' ? w : d;

  // local to world: a is along the frontage, b is into the building
  const at = (a, b) => ax === 'x'
    ? [x + sgn*(deep/2) - sgn*b, z + a]
    : [x + a, z + sgn*(deep/2) - sgn*b];

  const add = (mesh, collide) => {
    mesh.castShadow = mesh.receiveShadow = true;
    mesh.userData = tag; worldGroup.add(mesh); pickable.push(mesh);
    if (collide){
      mesh.updateMatrixWorld(true);
      const bb = new THREE.Box3().setFromObject(mesh);
      BLOCKS.push({x:(bb.min.x+bb.max.x)/2, z:(bb.min.z+bb.max.z)/2,
                   hx:(bb.max.x-bb.min.x)/2, hz:(bb.max.z-bb.min.z)/2});
    }
    return mesh;
  };
  // sa runs along the frontage, sb into the building
  const slab = (sa, sy, sb, a, b, cy, mat, collide) => {
    const [px, pz] = at(a, b);
    const m = new THREE.Mesh(
      new THREE.BoxGeometry(ax === 'x' ? sb : sa, sy, ax === 'x' ? sa : sb), mat);
    m.position.set(px, cy, pz);
    return add(m, collide);
  };

  const brick = new THREE.MeshStandardMaterial({color:tint(0x8d7a67, p.colour), roughness:.98});
  const brickD= new THREE.MeshStandardMaterial({color:0x6d5c4c, roughness:.98});
  const slate = new THREE.MeshStandardMaterial({color:0x474440, roughness:.9});
  const oak   = new THREE.MeshStandardMaterial({color:0x6b4a2d, roughness:.9});
  const oakD  = new THREE.MeshStandardMaterial({color:0x4a3220, roughness:.9});
  const beige = new THREE.MeshStandardMaterial({color:0xc9bfa6, roughness:.8});
  const beigeD= new THREE.MeshStandardMaterial({color:0xa89e86, roughness:.85});
  const darkM = new THREE.MeshStandardMaterial({color:0x2a2622, roughness:.9});
  const glass = new THREE.MeshPhysicalMaterial({color:0x9fb6bd, roughness:.12,
    transparent:true, opacity:.2, transmission:.55, side:THREE.DoubleSide});

  // three solid walls and a floor
  for (const s2 of [-1, 1])
    slab(T, h, deep, s2*(along/2 - T/2), deep/2, gy + h/2, brick, true);
  slab(along, h, T, 0, deep - T/2, gy + h/2, brickD, true);
  slab(along - T*2, .12, deep - T*2, 0, deep/2, gy + .06, new THREE.MeshStandardMaterial(
    {color:0x6a5f52, roughness:1}), false);
  slab(along, .24, deep, 0, deep/2, gy + h + .12, new THREE.MeshStandardMaterial(
    {color:0x3e3833, roughness:1}), false);

  /* The frontage: a shop window from a low stall riser up to a deep fascia,
     a door at one end, brick piers each side. All of it solid to the viewer. */
  const PIER = .6, RISER = .8, HEAD = Math.min(3.2, h - .9);
  const inner = along/2 - PIER;
  for (const s2 of [-1, 1])
    slab(PIER, h, T, s2*(along/2 - PIER/2), T/2, gy + h/2, brick, true);
  slab(inner*2, RISER, T, 0, T/2, gy + RISER/2, brickD, true);
  slab(inner*2, h - HEAD, T, 0, T/2, gy + HEAD + (h-HEAD)/2, brick, true);
  // the glazing itself closes the gap, so you cannot step through it
  slab(inner*2, HEAD - RISER, .07, 0, T/2, gy + RISER + (HEAD-RISER)/2, glass, true);

  const DOORW = 1.3, doorA = inner - DOORW/2 - .15;
  const winA = -inner, winB = doorA - DOORW/2;
  for (let i = 1; i <= 2; i++)
    slab(.08, HEAD - RISER, .1, winA + (winB-winA)*i/3, T/2 + .04,
         gy + RISER + (HEAD-RISER)/2, oakD, false);
  slab(winB - winA + .1, .12, .14, (winA+winB)/2, T/2 + .04, gy + RISER, oakD, false);
  slab(winB - winA + .1, .14, .14, (winA+winB)/2, T/2 + .04, gy + HEAD, oakD, false);

  // the door, shut, with a glazed upper half
  slab(DOORW, .9, .09, doorA, T/2 + .03, gy + .45, oak, false);
  slab(DOORW, HEAD - 1.0, .06, doorA, T/2 + .03, gy + .9 + (HEAD-1.0)/2, glass, false);
  for (const s2 of [-1, 1])
    slab(.1, HEAD, .1, doorA + s2*(DOORW/2), T/2 + .04, gy + HEAD/2, oak, false);
  slab(DOORW + .2, .12, .1, doorA, T/2 + .04, gy + HEAD, oak, false);
  slab(.06, .32, .06, doorA + DOORW/2 - .2, T/2 + .1, gy + 1.45,
       new THREE.MeshStandardMaterial({color:0x8f8c86, roughness:.45, metalness:.5}), false);

  /* The fascia, and the sign that is the whole point of the building. In this
     palette a saturated letter keeps its own colour while the brick goes to the
     ramp, so it stays legible at any hour. */
  const FY = gy + h + .55, FH = 1.0;
  slab(along + .3, FH, .44, 0, -.08, FY, darkM, false);
  slab(along + .42, .18, .58, 0, -.04, FY + FH/2 + .07, slate, false);
  slab(along + .42, .32, .48, 0, -.08, gy + h + 1.3, brickD, false);

  const sc = document.createElement('canvas'); sc.width = 1024; sc.height = 160;
  {
    const c = sc.getContext('2d');
    c.fillStyle = '#17120e'; c.fillRect(0,0,1024,160);
    c.font = '700 92px ui-monospace, Menlo, monospace';
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.shadowColor = '#ff5f22'; c.shadowBlur = 34; c.fillStyle = '#ff5f22';
    c.fillText('INTERNET CAFE', 512, 84);
    c.shadowBlur = 12; c.fillStyle = '#ffd7b0';
    c.fillText('INTERNET CAFE', 512, 84);
  }
  const sTex = new THREE.CanvasTexture(sc); sTex.colorSpace = THREE.SRGBColorSpace;
  const signFace = new THREE.Mesh(new THREE.PlaneGeometry(along + .08, FH - .2),
    new THREE.MeshBasicMaterial({map:sTex, toneMapped:false}));
  const [sx2, sz2] = at(0, -.3);
  signFace.position.set(sx2, FY, sz2);
  signFace.rotation.y = ax === 'x' ? sgn * Math.PI/2 : (sgn > 0 ? 0 : Math.PI);
  signFace.userData = tag; worldGroup.add(signFace);
  const signGlow = new THREE.PointLight(0xff7a33, 6, 7, 2);
  const [gx2, gz2] = at(0, -1.2);
  signGlow.position.set(gx2, FY - .3, gz2); worldGroup.add(signGlow);
  lamps.push({win:signFace, glow:signGlow});

  /* A desk and a machine. Three of them along the back wall, facing the glass,
     so what you see from the lane is their lit faces. */
  const kc = document.createElement('canvas'); kc.width = 512; kc.height = 176;
  {
    const c = kc.getContext('2d');
    c.fillStyle = '#c4baa2'; c.fillRect(0,0,512,176);
    c.fillStyle = '#a79d86';
    for (let r = 0; r < 5; r++) for (let k = 0; k < 15; k++){
      if (r === 4 && k > 6 && k < 12) continue;
      c.fillRect(14 + k*32 + r*5, 14 + r*31, (r === 4 && k === 6) ? 92 : 26, 22);
    }
  }
  const kTex = new THREE.CanvasTexture(kc); kTex.colorSpace = THREE.SRGBColorSpace;
  const keyMat = new THREE.MeshStandardMaterial({map:kTex, roughness:.85});

  function machine(a, on){
    const b = deep - 1.5;                 // back of the room, facing the window
    slab(1.55, .07, .72, a, b, gy + .72, oak, false);          // the desk
    for (const sa of [-.68, .68]) for (const sb of [-.28, .28])
      slab(.07, .72, .07, a + sa, b + sb, gy + .36, oakD, false);
    slab(.88, .13, .58, a - .04, b + .04, gy + .83, beige, false);   // the case
    slab(.7, .58, .62, a - .04, b + .06, gy + 1.20, beige, false);   // the monitor
    slab(.78, .07, .66, a - .04, b + .06, gy + .90, beigeD, false);
    slab(.58, .46, .04, a - .04, b - .3, gy + 1.22, darkM, false);   // the bezel

    const scr = new THREE.Mesh(new THREE.PlaneGeometry(.5,.38),
      new THREE.MeshBasicMaterial({color: on ? 0x8fd0ee : 0x20262a, toneMapped:false}));
    const [mx, mz] = at(a - .04, b - .33);
    scr.position.set(mx, gy + 1.22, mz);
    scr.rotation.y = ax === 'x' ? sgn * Math.PI/2 : (sgn > 0 ? 0 : Math.PI);
    scr.userData = tag; worldGroup.add(scr);

    const kb = slab(.74, .045, .24, a - .02, b - .4, gy + .78, keyMat, false);
    kb.material = keyMat;
    slab(.1, .055, .14, a + .56, b - .4, gy + .78, beige, false);     // the mouse

    if (on){
      const l = new THREE.PointLight(0xbcd9ec, 1.7, 2.0, 2);
      const [lx, lz] = at(a - .04, b - .8);
      l.position.set(lx, gy + 1.3, lz); worldGroup.add(l);
      lamps.push({win:scr, glow:l, cold:true});
    }
  }
  machine(-along/2 + 1.3, true);
  machine(0, true);
  machine( along/2 - 1.3, false);

  // a counter with a bowl of coins on it, and nobody behind it
  slab(1.4, .9, .58, along/2 - 1.1, deep - .7, gy + .45, oak, false);
  slab(1.5, .07, .68, along/2 - 1.1, deep - .7, gy + .93, oakD, false);

  // warm lamps overhead, so the room is not lit by screens alone
  for (const la of [-along/4, along/4]){
    slab(.32, .1, .32, la, deep/2, gy + h - .3, darkM, false);
    // kept short on purpose: the room is 7 across, so a lamp that reaches
    // further than the wall lights the street side of it too
    const l = new THREE.PointLight(0xffc98a, 3.6, 3.1, 2);
    const [lx, lz] = at(la, deep/2);
    l.position.set(lx, gy + h - .5, lz); worldGroup.add(l);
    lamps.push({win:{material:{color:{setHex(){}}}}, glow:l, indoor:true});
  }
};

BUILDERS.station = function(id, p){
  const [x,,z] = p.pos, [w,h,d] = p.size;
  const gy = landHeight(x, z);
  const tag = {name:p.name, note:p.description, id};
  const M = (c, r = .95) => new THREE.MeshStandardMaterial({color:c, roughness:r});
  const add = (mesh, collide) => {
    mesh.castShadow = mesh.receiveShadow = true;
    mesh.userData = tag; worldGroup.add(mesh); pickable.push(mesh);
    if (collide){
      mesh.updateMatrixWorld(true);
      const bb = new THREE.Box3().setFromObject(mesh);
      BLOCKS.push({x:(bb.min.x+bb.max.x)/2, z:(bb.min.z+bb.max.z)/2,
                   hx:(bb.max.x-bb.min.x)/2, hz:(bb.max.z-bb.min.z)/2});
    }
    return mesh;
  };
  /* Which side of the line the platform stands on. Everything below is laid
     out with the track at -z, and F mirrors the lot, roof pitches included. */
  const F = -1;
  const bx = (bw, bh, bd, c, ax, ay, az, collide, rx) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(bw, bh, bd), c.isMaterial ? c : M(c));
    m.position.set(x + ax, gy + ay, z + F * az);
    if (rx) m.rotation.x = F * rx;
    return add(m, collide);
  };
  const cy = (rt, rb, hh, c, ax, ay, az, seg, collide) => {
    const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, hh, seg || 10),
                             c.isMaterial ? c : M(c));
    m.position.set(x + ax, gy + ay, z + F * az);
    return add(m, collide);
  };

  /* Sleepers, grass and valance teeth come in their hundreds and were each a
     mesh of their own, which made this one place cost more draw calls than the
     rest of the village together. They are baked into one mesh apiece now. */
  const lump = (parts, col, shadow) => {
    if (!parts.length) return;
    const m = new THREE.Mesh(mergeGeometries(parts, false), M(col));
    m.castShadow = !!shadow; m.receiveShadow = true;
    m.userData = tag; worldGroup.add(m); pickable.push(m);
    for (const q of parts) q.dispose();
  };
  const piece = (geo, ax, ay, az, rot) => {
    if (rot) geo.rotateZ(rot);
    geo.translate(x + ax, gy + ay, z + F * az);
    return geo;
  };

  const TRACK = -4.0, GAUGE = 1.3;        // rails sit at TRACK +/- GAUGE

  /* the trackbed, and the line running away both ways */
  bx(60, .22, 5.2, 0x4f4639, 0, .11, TRACK);
  const sleepers = [];
  for (let i = -21; i <= 21; i++)
    sleepers.push(piece(new THREE.BoxGeometry(.32, .12, 3.1), i * 1.4, .26, TRACK));
  lump(sleepers, 0x4e4034, false);
  for (const sgn of [-1, 1])
    bx(60, .16, .15, 0x6b4a33, 0, .38, TRACK + sgn * GAUGE);
  const tufts = [];                        // grass up through it. nothing runs.
  for (let i = 0; i < 60; i++)
    tufts.push(piece(new THREE.ConeGeometry(.08, .3 + Math.random() * .35, 4),
                     (Math.random() - .5) * 52, .4,
                     TRACK + (Math.random() - .5) * 2.4));
  lump(tufts, 0x5e7034, false);

  /* the platform. kept low on purpose: he is a hedgehog and a proper one
     would be a cliff, so this is a step he can get up. */
  bx(21, .3, 4.6, 0x8d8577, 0, .15, .9);
  bx(21, .34, .36, 0x7a7266, 0, .17, TRACK + GAUGE + 1.05);
  bx(21, .06, .4, 0xcfc6b2, 0, .32, TRACK + GAUGE + 1.5);

  /* the canopy, on cast posts, with a scalloped valance along the edge */
  for (const ax of [-8, -4, 0, 4, 8]){
    cy(.13, .16, 2.9, 0x2b2724, ax, 1.75, -.9, 8);
    cy(.28, .28, .14, 0x2b2724, ax, .37, -.9, 8);
  }
  bx(19, .16, 4.2, 0x4e4038, 0, 3.3, .3, false, -.08);
  const teeth = [];
  for (let i = -15; i <= 15; i++){
    teeth.push(piece(new THREE.BoxGeometry(.42, .36, .1), i * .6, 2.95, -1.75));
    teeth.push(piece(new THREE.BoxGeometry(.14, .54, .1), i * .6 + .3, 2.86, -1.75));
  }
  lump(teeth, 0x45382f, false);

  /* the station building itself */
  const B = {x:-4.5, z:4.4};
  bx(10, 3.2, 3.6, 0xa08794, B.x, 1.6, B.z, true);
  bx(6.2, .2, 4.4, 0x4e4038, B.x, 3.55, B.z - 1.0, false, .42);
  bx(6.2, .2, 4.4, 0x4e4038, B.x, 3.55, B.z + 1.0, false, -.42);
  bx(10.3, .26, 3.8, 0x4e4038, B.x, 3.3, B.z);
  bx(.8, 1.4, .8, 0x6b5a4c, B.x + 3.4, 4.3, B.z + .5);
  bx(1.3, 2.2, .14, 0x3a2a20, B.x - 2.2, 1.1, B.z - 1.82);
  for (const ax of [.4, 2.6, -4.2]){
    bx(1.1, 1.3, .1, 0x2e4450, B.x + ax, 1.9, B.z - 1.81);
    bx(1.25, 1.45, .07, 0xd8cdb8, B.x + ax, 1.9, B.z - 1.86);
  }
  bx(3.6, .54, .12, 0x1f3a4a, B.x - .4, 2.72, B.z - 1.86);
};


/* ---------- one last pass over the finished world ----------
   The village is drawn from thousands of small pieces: every window has four
   lead bars, every timber frame its own posts, every earth place its chips and
   tufts. Each was a mesh of its own, so the world cost about 2,600 draw calls
   even though the whole thing is only 140,000 vertices. Chromium copes with
   that. Safari does not, and gives up on the graphics context entirely, which
   looks exactly like a black screen.

   So: anything with no name on it is decoration nobody can point at, and
   decoration that shares a colour can share a mesh. Transforms are baked in,
   so nothing moves. Named things, textured things, glass and water are all
   left alone, because they are either pointed at, animated or see-through. */
function mergeScenery(){
  const groups = new Map();
  const doomed = [];
  worldGroup.traverse(o => {
    if (!o.isMesh || o.isSkinnedMesh) return;
    if (o.userData && o.userData.name) return;        // it has a name: leave it
    const m = o.material;
    if (!m || Array.isArray(m)) return;
    if (!(m.isMeshStandardMaterial || m.isMeshLambertMaterial)) return;
    if (m.map || m.transparent || m.emissiveIntensity > 0.01) return;
    if (!o.geometry || !o.geometry.getAttribute('position')) return;
    if (!o.geometry.getAttribute('normal') || !o.geometry.getAttribute('uv')) return;
    const key = [m.type, m.color.getHex(), (m.roughness ?? 1).toFixed(2),
                 o.castShadow ? 1 : 0, o.receiveShadow ? 1 : 0].join('|');
    if (!groups.has(key)) groups.set(key, {mat:m, cast:o.castShadow,
                                          recv:o.receiveShadow, parts:[], src:[]});
    const G = groups.get(key);
    o.updateWorldMatrix(true, false);
    const q = o.geometry.clone().applyMatrix4(o.matrixWorld);
    q.deleteAttribute('tangent');
    G.parts.push(q); G.src.push(o); doomed.push(o);
  });

  let made = 0, saved = 0;
  for (const G of groups.values()){
    if (G.parts.length < 4){                          // not worth a merge
      for (const q of G.parts) q.dispose();
      for (const o of G.src) doomed.splice(doomed.indexOf(o), 1);
      continue;
    }
    let merged = null;
    try { merged = mergeGeometries(G.parts, false); } catch (e) { merged = null; }
    if (!merged){                                     // mismatched attributes
      for (const q of G.parts) q.dispose();
      for (const o of G.src) doomed.splice(doomed.indexOf(o), 1);
      continue;
    }
    const m = new THREE.Mesh(merged, G.mat);
    m.castShadow = G.cast; m.receiveShadow = G.recv;
    m.matrixAutoUpdate = false;
    worldGroup.add(m);
    made++; saved += G.parts.length;
    for (const q of G.parts) q.dispose();
  }

  const gone = new Set(doomed);
  for (const o of doomed){
    if (o.parent) o.parent.remove(o);
    o.geometry.dispose();
  }
  for (let i = pickable.length - 1; i >= 0; i--)
    if (gone.has(pickable[i])) pickable.splice(i, 1);

  if (made) console.log(`[world] ${saved} loose pieces of scenery merged into ${made}`);
}

function buildPlace(id, p){
  if (p.build && BUILDERS[p.build]){ BUILDERS[p.build](id, p); return; }

  const [x,,z] = p.pos||[0,0,0]; const [w,h,d] = p.size||[6,4,6];
  const tag = {name:p.name, note:p.description, id};

  if (p.kind==='water'){
    const roundish = Math.abs(w-d) < Math.max(w,d)*0.4;
    const geo = roundish
      ? new THREE.CircleGeometry(Math.max(w,d)*0.52, 44)
      : new THREE.PlaneGeometry(w, d, 26, 26);
    if (roundish){                      // give the disc some inner rings to ripple
      geo.rotateZ(Math.PI/8);
    }
    const mat = new THREE.MeshPhysicalMaterial({
      color:PAL.water, roughness:.06, metalness:.0,
      transmission:.55, thickness:2.2, ior:1.33,
      transparent:true, opacity:.82, side:THREE.DoubleSide});
    const m = new THREE.Mesh(geo,mat); m.rotation.x=-Math.PI/2;
    m.position.set(x,-0.12,z); m.receiveShadow = true; m.userData=tag;
    m.userData.base = geo.attributes.position.array.slice();
    m.userData.flow = (d > w*1.6) ? 1 : (w > d*1.6) ? 2 : 0;   // 1 = along z, 2 = along x, 0 = still
    worldGroup.add(m); pickable.push(m); waters.push(m);
    WATERS_FOR_TREES.push({x, z, w, d, flowing: d > w*1.6 || w > d*1.6});
    for (let i=0;i<26;i++){                       // reeds round the edge
      const ang=Math.random()*Math.PI*2;
      const rx=x+Math.cos(ang)*(w/2+.5), rz=z+Math.sin(ang)*(d/2+.5);
      const r=new THREE.Mesh(new THREE.CylinderGeometry(.035,.05,1.4+Math.random()*.9,4),
        new THREE.MeshStandardMaterial({color:0x6f8a3e, roughness:1}));
      r.position.set(rx, landHeight(rx,rz)+.75, rz); r.rotation.z=(Math.random()-.5)*.4; r.castShadow=true;
      worldGroup.add(r);
    }
    if (m.userData.flow){
      const axis = m.userData.flow === 1 ? 'z' : 'x';
      const span = m.userData.flow === 1 ? d : w, wide = m.userData.flow === 1 ? w : d;
      for (let i=0;i<26;i++){
        const st = new THREE.Mesh(new THREE.PlaneGeometry(.1, .55 + Math.random()*.7),
          new THREE.MeshBasicMaterial({color:0xdce9f0, transparent:true, opacity:.16,
                                       depthWrite:false}));
        st.rotation.x = -Math.PI/2;
        if (axis === 'x') st.rotation.z = Math.PI/2;
        const off = (Math.random()-.5)*(wide*.78);
        st.position.set(axis==='z' ? x+off : x - span/2 + Math.random()*span, -0.09,
                        axis==='z' ? z - span/2 + Math.random()*span : z+off);
        st.userData = {axis, speed: 3.1 + Math.random()*1.9,
                       start: (axis==='z'? z : x) - span/2,
                       end:   (axis==='z'? z : x) + span/2, seed: Math.random()*6};
        worldGroup.add(st); foam.push(st);
      }
    }
    worldGroup.add(sprite(p.name.replace(/^the /,''), new THREE.Vector3(x,2.2,z), .56, '#7fa8c0'));
    return;
  }
  if (p.kind==='hedge'){
    const mass = new THREE.Mesh(new THREE.BoxGeometry(w,2.6,d),
      new THREE.MeshStandardMaterial({color:PAL.hedge, roughness:1}));
    mass.position.set(x, landHeight(x,z)+1.3, z); mass.castShadow=mass.receiveShadow=true; mass.userData=tag;
    worldGroup.add(mass); pickable.push(mass);
    for (let i=0;i<120;i++){
      const b=new THREE.Mesh(new THREE.SphereGeometry(.3+Math.random()*.45,5,4),
        new THREE.MeshStandardMaterial({color:new THREE.Color(PAL.hedge).offsetHSL(0,0,(Math.random()-.5)*.09), roughness:1}));
      b.position.set(x+(Math.random()-.5)*w, landHeight(x,z)+.5+Math.random()*2.6, z+(Math.random()-.5)*d);
      b.castShadow=true; worldGroup.add(b);
    }
    // the tunnel under it
    const tunnel = new THREE.Mesh(new THREE.BoxGeometry(w*.42,.7,d*.96),
      new THREE.MeshStandardMaterial({color:0x2a3320, roughness:1}));
    tunnel.position.set(x, landHeight(x,z)+.35, z); worldGroup.add(tunnel);
    worldGroup.add(sprite('under the hedge', new THREE.Vector3(x,3.6,z), .54, '#7f9c6a'));
    return;
  }
  if (p.kind==='earth' || p.kind==='street'){
    const isStreet = p.kind==='street';
    let padMat;
    const flag = p.paving === 'flag';
    if (flag){
      padMat = new THREE.MeshStandardMaterial({color:0x6f6759, roughness:1});
    } else if (isStreet){
      const kt = tex('klinker');
      kt.repeat.set(Math.max(1, w/2.2), Math.max(1, d/2.2));
      kt.anisotropy = 8;
      padMat = new THREE.MeshStandardMaterial({map:kt, roughness:.88,
        color: p.colour ? tint(0xffffff, p.colour) : 0xffffff});
    } else {
      padMat = new THREE.MeshStandardMaterial({color:tint(PAL.earth, p.colour), roughness:.97});
    }
    const pad = new THREE.Mesh(new THREE.BoxGeometry(w,.2,d), padMat);
    pad.position.set(x, landHeight(x,z)+.1, z); pad.receiveShadow=true; pad.userData=tag;
    worldGroup.add(pad); pickable.push(pad);
    if (flag){
      /* Real slabs laid end to end in two tones, merged into two meshes so the
         whole walk costs two draw calls rather than sixty. */
      const slab = new THREE.BoxGeometry(1.46, .16, 1.42);
      const cols = Math.max(1, Math.floor((w - 1.4) / 1.62));
      const rows = Math.max(1, Math.floor(d / 1.55));
      const A = [], B = [];
      for (let r = 0; r < rows; r++)
        for (let c = 0; c < cols; c++){
          const sx = x - ((cols - 1) * 1.62) / 2 + c * 1.62;
          const sz = z - d / 2 + .8 + r * 1.55;
          const q = slab.clone();
          q.translate(sx, landHeight(sx, sz) + .22, sz);
          ((r + c) % 2 ? B : A).push(q);
        }
      for (const [parts, col] of [[A, 0x8d8577], [B, 0x7c7467]]){
        if (!parts.length) continue;
        const m = new THREE.Mesh(mergeGeometries(parts, false),
          new THREE.MeshStandardMaterial({color:col, roughness:.95}));
        m.receiveShadow = true; worldGroup.add(m);
        for (const q of parts) q.dispose();
      }
      slab.dispose();
    }
    if (isStreet){                                  // kerbs down both sides
      for (const sgn of [-1,1]){
        const k=new THREE.Mesh(new THREE.BoxGeometry(.5,.26,d),
          new THREE.MeshStandardMaterial({color:0x8a7a6b, roughness:1}));
        k.position.set(x+sgn*(w/2+.2), landHeight(x,z)+.15, z); k.castShadow=k.receiveShadow=true;
        worldGroup.add(k);
      }
    }
    const n = isStreet?0:26;
    for (let i=0;i<n;i++){
      const s=.3+Math.random()*.5;
      const bit=new THREE.Mesh(
        isStreet ? new THREE.BoxGeometry(s,.08,s) : new THREE.SphereGeometry(s*.4,5,4),
        new THREE.MeshStandardMaterial({color:isStreet?PAL.cobbleChip:0x8d7452, roughness:1}));
      bit.position.set(x+(Math.random()-.5)*(w-.7), landHeight(x,z)+.22, z+(Math.random()-.5)*(d-.7));
      bit.rotation.y=Math.random()*3; worldGroup.add(bit);
    }
    if (!isStreet){  // tufts of grass
      for (let i=0;i<30;i++){
        const g=new THREE.Mesh(new THREE.ConeGeometry(.08,.5+Math.random()*.4,4),
          new THREE.MeshStandardMaterial({color:0x6d8a44, roughness:1}));
        const gx=x+(Math.random()-.5)*w, gz=z+(Math.random()-.5)*d;
        g.position.set(gx, landHeight(gx,gz)+.3, gz);
        g.rotation.z=(Math.random()-.5)*.5; worldGroup.add(g);
      }
      worldGroup.add(sprite(p.name.replace(/^the /,''), new THREE.Vector3(x, landHeight(x,z)+2.1, z), .5, '#8a8064'));
    }
    return;
  }
  // buildings, by style: four walls with a doorway, so you can walk in
  const style = p.style || (p.built_by === 'otto' ? 'timber' : 'brick');
  const gy = landHeight(x,z);
  const wallTex = tex(style);
  wallTex.repeat.set(Math.max(1,w/3.2), Math.max(1,h/2.6));
  const wallMat = new THREE.MeshStandardMaterial({map:wallTex, roughness:.93,
    side:THREE.DoubleSide, color: p.colour ? tint(0xffffff, p.colour) : 0xffffff});
  const PLASTER = {brick:0xdccdb0, timber:0xe1d4b8, stone:0xd0ccc1,
                   stone_tall:0xcbc9bf, shopfront:0xd7cfb9};
  const inMat = new THREE.MeshStandardMaterial({
    color: tint(PLASTER[style] || 0xc8bca8, p.colour), roughness:.97, side:THREE.DoubleSide});
  // BoxGeometry face order: +x, -x, +y, -y, +z, -z
  const faces = (ax, sgn) => {
    const m = [inMat,inMat,inMat,inMat,inMat,inMat];
    m[ax === 'x' ? (sgn > 0 ? 0 : 1) : (sgn > 0 ? 4 : 5)] = wallMat;
    return m;
  };
  const T = 0.35;                                  // wall thickness
  const DOORW = 2.6, DOORH = 3.2;

  // A doorway goes in the wall that faces the place it leads to, so rooms built
  // against each other actually join up. Before this every building put its door
  // on the lane side, which is right for a shop and useless for a back bedroom.
  const doorway = {};                              // 'x+' | 'x-' | 'z+' | 'z-'
  for (const e of (p.exits || [])){
    const q = (WORLD && WORLD.places && WORLD.places[e]) || null;
    if (!q || !q.pos) continue;
    const dx = q.pos[0] - x, dz = q.pos[2] - z;
    doorway[Math.abs(dx) >= Math.abs(dz) ? (dx >= 0 ? 'x+' : 'x-')
                                         : (dz >= 0 ? 'z+' : 'z-')] = true;
  }
  if (!Object.keys(doorway).length) doorway[x < 0 ? 'x+' : 'x-'] = true;
  const side = doorway['x+'] ? 1 : doorway['x-'] ? -1 : (x < 0 ? 1 : -1);

  function wall(cx, cy, cz, sx, sy, sz, collide=true, mats=wallMat){
    const m = new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz), mats);
    m.position.set(cx, cy, cz); m.castShadow = m.receiveShadow = true;
    m.userData = tag; worldGroup.add(m); pickable.push(m);
    if (collide) BLOCKS.push({x:cx, z:cz, hx:sx/2, hz:sz/2});
    return m;
  }
  const sills = [];
  // Rooms in the same building share their walls. Without this, two adjoining
  // rooms stand two full walls back to back and the place reads as a row of
  // sheds rather than one house.
  const shared = {};
  if (p.building){
    for (const [qid, q] of Object.entries((WORLD && WORLD.places) || {})){
      if (qid === id || q.building !== p.building || !q.pos || !q.size) continue;
      const [qw,, qd] = q.size, qx = q.pos[0], qz = q.pos[2];
      const touch = (a, b) => Math.abs(a - b) < 0.12;
      // my +x wall against their -x wall, and so on, with the walls overlapping
      if (touch(x + w/2, qx - qw/2) && Math.min(z+d/2, qz+qd/2) - Math.max(z-d/2, qz-qd/2) > 1)
        shared['x+'] = qid;
      if (touch(x - w/2, qx + qw/2) && Math.min(z+d/2, qz+qd/2) - Math.max(z-d/2, qz-qd/2) > 1)
        shared['x-'] = qid;
      if (touch(z + d/2, qz - qd/2) && Math.min(x+w/2, qx+qw/2) - Math.max(x-w/2, qx-qw/2) > 1)
        shared['z+'] = qid;
      if (touch(z - d/2, qz + qd/2) && Math.min(x+w/2, qx+qw/2) - Math.max(x-w/2, qx-qw/2) > 1)
        shared['z-'] = qid;
    }
  }
  // only one of the two rooms builds the wall between them
  const mine = k => !shared[k] || id < shared[k];

  // one side of the box: solid, or split round a doorway
  function face(axis, sgn, span, mats){
    const key = axis + (sgn > 0 ? '+' : '-');
    const open = doorway[key];
    const inner2 = !!shared[key];
    if (inner2 && !mine(key)) return;              // the other room builds this one
    const TT = inner2 ? T*0.62 : T;                // a partition, not an outside wall
    if (inner2) mats = [inMat,inMat,inMat,inMat,inMat,inMat];
    const cx = axis === 'x' ? x + sgn*(w/2 - (inner2 ? 0 : TT/2)) : x;
    const cz = axis === 'z' ? z + sgn*(d/2 - (inner2 ? 0 : TT/2)) : z;
    const put = (off, len, cy, hgt, collide) => axis === 'x'
      ? wall(cx, cy, z + off, TT, hgt, len, collide, mats)
      : wall(x + off, cy, cz, len, hgt, TT, collide, mats);
    const holes = [];
    if (open && span > DOORW + 0.6) holes.push({off:0, w:DOORW, b:0, t:DOORH, door:true});
    const wb = h*.55 - WINH/2, wt = h*.55 + WINH/2;
    for (const off of (winHoles[key] || []))
      if (Math.abs(off) + WINW/2 < span/2 - 0.3 && wt < h - 0.25)
        holes.push({off, w:WINW, b:wb, t:wt});
    if (!holes.length){ put(0, span, gy+h/2, h, true); return; }

    holes.sort((a,b2) => a.off - b2.off);
    let cur = -span/2;
    for (const ho of holes){
      const l = ho.off - ho.w/2, r = ho.off + ho.w/2;
      if (l - cur > 0.02) put((cur + l)/2, l - cur, gy + h/2, h, true);  // pier beside it
      if (ho.b > 0.02)     put(ho.off, ho.w, gy + ho.b/2, ho.b, true);   // under the sill
      if (h - ho.t > 0.02) put(ho.off, ho.w, gy + ho.t + (h - ho.t)/2, h - ho.t, !ho.door);
      cur = Math.max(cur, r);
    }
    if (span/2 - cur > 0.02) put((cur + span/2)/2, span/2 - cur, gy + h/2, h, true);
    if (!inner2 && open) sills.push([cx, cz, axis]);
  }
  // Windows go on a wall with no doorway in it. This has to be settled before
  // the walls go up, because the wall is now cut around the opening rather than
  // having a window painted onto it (fault #1: a frame around solid wall).
  const WINW = 1.52, WINH = 1.18;
  const winPlan = [];
  {
    const WALLS = [['z',1],['z',-1],['x',1],['x',-1]];
    let wAxis = null, wSgn = 0;
    for (const [ax, sg] of WALLS) if (!doorway[ax + (sg > 0 ? '+' : '-')]){ wAxis = ax; wSgn = sg; break; }
    const bumped = wAxis === null;                 // every wall has a door: shift along one
    if (bumped){ wAxis = 'x'; wSgn = -side; }
    const key = wAxis + (wSgn > 0 ? '+' : '-');
    if (!shared[key]){                             // never an internal partition
      const along = wAxis === 'x' ? d : w;
      const clear = DOORW/2 + 1.15;
      const nWin = along > 7.4 ? 2 : 1;
      for (let i=0;i<nWin;i++){
        let off = nWin === 1 ? (bumped ? clear : 0) : (i - .5) * (along*.45);
        if (Math.abs(off) > along/2 - 1.15) off = Math.sign(off) * (along/2 - 1.15);
        if (bumped && Math.abs(off) < DOORW/2 + WINW/2 + .2) continue;   // clear of the door
        winPlan.push({wAxis, wSgn, key, off});
      }
    }
  }
  const winHoles = {};
  for (const wp of winPlan) (winHoles[wp.key] = winHoles[wp.key] || []).push(wp.off);

  const innerW = w - T*2;        // butt against the side walls, do not pass through them
  face('x', -1, d, faces('x', -1));
  face('x',  1, d, faces('x',  1));
  face('z', -1, innerW, faces('z', -1));
  face('z',  1, innerW, faces('z',  1));

  for (const sx of [-1,1]) for (const sz of [-1,1]){
    if (shared['x' + (sx>0?'+':'-')] || shared['z' + (sz>0?'+':'-')]) continue;
    const post = new THREE.Mesh(new THREE.BoxGeometry(T*1.25, h, T*1.25),
      new THREE.MeshStandardMaterial({
        color: style==='timber' ? 0x4a3526 : tint(0x8d8275, p.colour), roughness:.95}));
    post.position.set(x + sx*(w/2 - T/2), gy + h/2, z + sz*(d/2 - T/2));
    post.castShadow = post.receiveShadow = true; worldGroup.add(post);
  }

  // floor and ceiling
  const stoney = style === 'stone' || style === 'stone_tall' || style === 'shopfront';
  const ft = floorTexture(stoney, w-T*2, d-T*2);
  const floor = new THREE.Mesh(new THREE.BoxGeometry(w-T*2, .26, d-T*2),
    [new THREE.MeshStandardMaterial({color:0x3f3a33, roughness:1}),
     new THREE.MeshStandardMaterial({color:0x3f3a33, roughness:1}),
     new THREE.MeshStandardMaterial({map:ft, roughness:.9}),     // the top face only
     new THREE.MeshStandardMaterial({color:0x2e2a26, roughness:1}),
     new THREE.MeshStandardMaterial({color:0x3f3a33, roughness:1}),
     new THREE.MeshStandardMaterial({color:0x3f3a33, roughness:1})]);
  floor.position.set(x, gy+.09, z); floor.receiveShadow = true; worldGroup.add(floor);
  // a threshold under every doorway, so no floor meets the ground in mid-air
  for (const [sx_, sz_, axis] of sills){
    const sill = new THREE.Mesh(
      axis === 'x' ? new THREE.BoxGeometry(T*2.2, .3, DOORW)
                   : new THREE.BoxGeometry(DOORW, .3, T*2.2),
      new THREE.MeshStandardMaterial({color:0x6b6158, roughness:1}));
    sill.position.set(sx_, gy+.1, sz_);
    sill.receiveShadow = true; worldGroup.add(sill);
  }
  const ceil = new THREE.Mesh(new THREE.BoxGeometry(w-T*2, .16, d-T*2),
    new THREE.MeshStandardMaterial({color:0x4a4036, roughness:1}));
  ceil.position.set(x, gy+h-.35, z); worldGroup.add(ceil);

  // roof above. a place with a gable builds its own below, because a nave
  // needs a ridge running its length and every style here gives a pyramid.
  if (p.gable){
    /* handled in the landmark block */
  } else if (p.building){
    // One house, so one roof line. Each room gets a pitched section at the same
    // eaves and the same ridge height, with the ridge running the long way, and
    // no gable where it meets another room. Where the wings cross, the slopes
    // cross, which is what an L-shaped cottage actually does.
    const RISE = 1.55, OVER = 0.30;
    const ridgeZ = d >= w;                        // ridge runs along z, or along x
    const span = (ridgeZ ? w : d) / 2 + OVER;     // half the slope's horizontal run
    const run  = (ridgeZ ? d : w) + OVER*2;
    const slope = Math.hypot(span, RISE);
    const pitch = Math.atan2(RISE, span);
    const roofMat = new THREE.MeshStandardMaterial({color:0x53372f, roughness:.96});
    for (const sg of [-1, 1]){
      const leaf = new THREE.Mesh(
        ridgeZ ? new THREE.BoxGeometry(slope, .18, run) : new THREE.BoxGeometry(run, .18, slope),
        roofMat);
      if (ridgeZ){
        leaf.position.set(x + sg*span/2, gy + h + RISE/2, z);
        leaf.rotation.z = -sg*pitch;
      } else {
        leaf.position.set(x, gy + h + RISE/2, z + sg*span/2);
        leaf.rotation.x = sg*pitch;
      }
      leaf.castShadow = leaf.receiveShadow = true; worldGroup.add(leaf);
    }
    // gable ends, but only where the wall is on the outside of the house
    const endKeys = ridgeZ ? ['z-','z+'] : ['x-','x+'];
    const gw = (ridgeZ ? w : d);
    endKeys.forEach((k, gi) => {
      if (shared[k]) return;
      const sg = gi ? 1 : -1;
      const sh = new THREE.Shape();
      sh.moveTo(-gw/2, 0); sh.lineTo(gw/2, 0); sh.lineTo(0, RISE); sh.lineTo(-gw/2, 0);
      const g2 = new THREE.Mesh(new THREE.ExtrudeGeometry(sh, {depth:T, bevelEnabled:false}), wallMat);
      if (ridgeZ){ g2.position.set(x, gy + h, z + sg*(d/2) - (sg>0?0:T)); }
      else { g2.rotation.y = Math.PI/2; g2.position.set(x + sg*(w/2) + (sg>0?T:0), gy + h, z); }
      g2.castShadow = true; worldGroup.add(g2);
    });
    if (id === 'house_main'){                      // one chimney for the house
      const ch2 = new THREE.Mesh(new THREE.BoxGeometry(.8, 2.3, .8), wallMat);
      ch2.position.set(x - w*.28, gy + h + 1.35, z - d*.30);
      ch2.castShadow = true; worldGroup.add(ch2);
      const cap = new THREE.Mesh(new THREE.BoxGeometry(.95,.14,.95),
        new THREE.MeshStandardMaterial({color:0x4a423a, roughness:1}));
      cap.position.set(x - w*.28, gy + h + 2.55, z - d*.30); worldGroup.add(cap);
    }
  } else if (style === 'stone_tall'){
    const r = new THREE.Mesh(new THREE.ConeGeometry(Math.max(w,d)*.72, h*.85, 4),
      new THREE.MeshStandardMaterial({color:0x3a4a52, roughness:.85}));
    r.position.set(x, gy + h + h*.43 + .25, z); r.rotation.y = Math.PI/4;
    r.castShadow = true; worldGroup.add(r);
  } else if (style === 'shopfront'){
    const par = new THREE.Mesh(new THREE.BoxGeometry(w+.5,.7,d+.5),
      new THREE.MeshStandardMaterial({color:0x4a4038, roughness:1}));
    par.position.set(x, gy+h+.42, z); par.castShadow = true; worldGroup.add(par);
    const awn = new THREE.Mesh(new THREE.BoxGeometry(2.4,.14,d*.7),
      new THREE.MeshStandardMaterial({color:0x8c3b33, roughness:.9}));
    awn.position.set(x + side*(w/2+1.1), gy+h*.72, z);
    awn.rotation.z = -side*0.15; awn.castShadow = true; worldGroup.add(awn);
  } else {
    const r = new THREE.Mesh(new THREE.ConeGeometry(Math.max(w,d)*.79, h*.55, 4),
      new THREE.MeshStandardMaterial({color: style==='timber'?0x4e3f2e:0x5d4038, roughness:.95}));
    r.position.set(x, gy+h+h*.28 + .25, z); r.rotation.y = Math.PI/4;
    r.castShadow = true; worldGroup.add(r);
  }
  if (p.roof === 'turf' && !p.building){            // grown over, like the cottage on the water
    const g = new THREE.Mesh(new THREE.ConeGeometry(Math.max(w,d)*.83, h*.46, 4),
      new THREE.MeshStandardMaterial({color:0x5f7c40, roughness:1}));
    g.position.set(x, gy+h+h*.30 + .30, z); g.rotation.y = Math.PI/4;
    g.castShadow = true; worldGroup.add(g);
    for (let i=0;i<34;i++){         // tufts along the ridge and the slopes
      const a = Math.random()*Math.PI*2, rr = Math.random()*Math.max(w,d)*.36;
      const tx = x + Math.cos(a)*rr, tz = z + Math.sin(a)*rr;
      const t2 = new THREE.Mesh(new THREE.ConeGeometry(.07,.34,4),
        new THREE.MeshStandardMaterial({color:0x6d8a44, roughness:1}));
      t2.position.set(tx, gy + h + h*.30 + .30 + (h*.23) * (1 - rr/(Math.max(w,d)*.42)), tz);
      t2.rotation.z = (Math.random()-.5)*.6; worldGroup.add(t2);
    }
  }
  if (!p.building && (style === 'brick' || style === 'timber')){
    const ch = new THREE.Mesh(new THREE.BoxGeometry(.75,1.7,.75), wallMat);
    ch.position.set(x + w*.26, gy+h+h*.42, z - d*.2); ch.castShadow = true;
    worldGroup.add(ch);
  }

  /* ---------- landmarks ----------
     Optional fields any place may set, so the next one (a mill, a water tower,
     a dovecote) costs a line rather than another special case in here.

     The church turns all of them on. The arrangement is an English parish
     church: a low narrow chancel at the east end, a taller wider nave, a porch
     on the south side, stepped buttresses, and a west tower. On top of the
     tower is a broach spire: an octagonal spire rising straight off a square
     tower with no parapet, with four triangular broaches clasping the corners
     where the square becomes an eight-sided one. That square-to-octagon step
     is the whole silhouette, and it is what carries at sixty units. */
  if (p.tower || p.porch || p.chancel || p.buttresses || p.lychgate){
    const stone = new THREE.MeshStandardMaterial({color: tint(0x9a9384, p.colour), roughness:.96});
    const slate = new THREE.MeshStandardMaterial({color: 0x454a4d, roughness:.88});
    const oak   = new THREE.MeshStandardMaterial({color: 0x4b3a28, roughness:.95});
    const longZ = d >= w;                          // which way the building runs
    const L = longZ ? d : w, W = longZ ? w : d;
    // along runs the length of the building, across runs its width
    const xy = (along, across) => longZ ? [x + across, z + along] : [x + along, z + across];
    const add = (mesh, collide) => {
      mesh.castShadow = mesh.receiveShadow = true;
      worldGroup.add(mesh);
      if (collide){
        mesh.updateMatrixWorld(true);
        const bb = new THREE.Box3().setFromObject(mesh);
        BLOCKS.push({x:(bb.min.x+bb.max.x)/2, z:(bb.min.z+bb.max.z)/2,
                     hx:(bb.max.x-bb.min.x)/2, hz:(bb.max.z-bb.min.z)/2});
      }
      return mesh;
    };
    const box = (sx, sy, sz, along, across, cy, mat, collide) => {
      const [bx, bz] = xy(along, across);
      const m = new THREE.Mesh(new THREE.BoxGeometry(longZ?sx:sz, sy, longZ?sz:sx), mat || stone);
      m.position.set(bx, cy, bz);
      return add(m, collide);
    };

    // a roof with a ridge down its length, which is what a nave has
    const gable = (gw, gl, glAlong, gTop, gy0, high) => {
      const [gx, gz] = xy(glAlong, 0);
      const sh = new THREE.Shape();
      sh.moveTo(-gw/2 - .3, 0); sh.lineTo(gw/2 + .3, 0); sh.lineTo(0, high); sh.closePath();
      const g = new THREE.Mesh(
        new THREE.ExtrudeGeometry(sh, {depth: gl, bevelEnabled: false}), slate);
      g.rotation.y = longZ ? 0 : Math.PI/2;
      g.position.set(gx + (longZ ? 0 : -gl/2), gy0, gz + (longZ ? -gl/2 : 0));
      if (longZ) g.position.z = gz - gl/2; else g.position.x = gx - gl/2;
      return add(g, false);
    };
    if (p.gable) gable(W, L, 0, 0, gy + h, W*0.46);

    // the tower, at the far end from the chancel
    if (p.tower){
      const ts = Math.min(W, L) * 0.64;
      const th = p.tower.h || h * 2.5;
      const [tx, tz] = xy(-L/2 + ts*0.34, 0);
      const tower = new THREE.Mesh(new THREE.BoxGeometry(ts, th, ts), stone);
      tower.position.set(tx, gy + th/2, tz);
      add(tower, true);
      // a string course part way up, which is what stops it reading as a chimney
      const band = new THREE.Mesh(new THREE.BoxGeometry(ts+.3, .25, ts+.3), stone);
      band.position.set(tx, gy + th*0.62, tz); add(band, false);
      // the belfry opening, so the top has a reason to be there
      for (const [ox, oz] of [[ts/2+.02,0],[-ts/2-.02,0],[0,ts/2+.02],[0,-ts/2-.02]]){
        const o = new THREE.Mesh(new THREE.BoxGeometry(ox?0.12:ts*0.3, th*0.14, oz?0.12:ts*0.3), slate);
        o.position.set(tx+ox, gy + th*0.84, tz+oz); add(o, false);
      }
      if (p.tower.spire !== false){
        // the broaches: a truncated square pyramid, corners on the tower corners
        const br = new THREE.Mesh(new THREE.CylinderGeometry(ts*0.42, ts*0.72, ts*0.70, 4), slate);
        br.rotation.y = Math.PI/4;
        br.position.set(tx, gy + th + ts*0.35, tz); add(br, false);
        const sh = p.tower.spire || ts*2.7;
        const sp = new THREE.Mesh(new THREE.ConeGeometry(ts*0.45, sh, 8), slate);
        sp.position.set(tx, gy + th + ts*0.70 + sh/2, tz); add(sp, false);
      } else {
        // the other English answer: a flat top with battlements and pinnacles
        const par = new THREE.Mesh(new THREE.BoxGeometry(ts+.5, .5, ts+.5), stone);
        par.position.set(tx, gy + th + .25, tz); add(par, false);
        for (let i=0;i<4;i++){
          const a = i*Math.PI/2 + Math.PI/4, r2 = (ts+.5)*0.62;
          const pin = new THREE.Mesh(new THREE.ConeGeometry(.3, 1.9, 4), stone);
          pin.position.set(tx + Math.cos(a)*r2, gy + th + 1.45, tz + Math.sin(a)*r2);
          pin.rotation.y = Math.PI/4; add(pin, false);
        }
      }
    }

    // the chancel: lower and narrower, at the opposite end
    if (p.chancel){
      const cw = W*0.66, cl = p.chancel.len || L*0.34, ch2 = h*0.66;
      const along = L/2 + cl/2 - .4;
      box(cw, ch2, cl, along, 0, gy + ch2/2, stone, true);
      const [rx, rz] = xy(along, 0);
      const r = new THREE.Mesh(new THREE.ConeGeometry(cw*0.76, ch2*0.5, 4), slate);
      r.position.set(rx, gy + ch2 + ch2*0.24, rz);
      r.rotation.y = Math.PI/4; add(r, false);
    }

    // the porch, on the south side
    if (p.porch){
      const pw = 2.8, pl = 2.2, ph = h*0.52;
      const across = (W/2 + pl/2 - .3) * (p.porch.side || 1);
      box(pw, ph, pl, L*0.12, across, gy + ph/2, stone, true);
      const [px2, pz2] = xy(L*0.12, across);
      const r = new THREE.Mesh(new THREE.ConeGeometry(pw*0.72, ph*0.55, 4), slate);
      r.position.set(px2, gy + ph + ph*0.26, pz2); r.rotation.y = Math.PI/4; add(r, false);
    }

    // stepped buttresses down the long walls
    if (p.buttresses){
      const n2 = p.buttresses.count || 3;
      for (let i=0;i<n2;i++){
        const along = -L*0.26 + (i/(n2-1 || 1)) * L*0.52;
        for (const sgn of [-1, 1]){
          const across = sgn * (W/2 + .35);
          // wide against the wall and shallow off it, then stepped back. thin
          // and tall reads as a detached fin, which is not what these are.
          box(1.0, h*0.50, 1.4, along, across + sgn*0.25, gy + h*0.25, stone, false);
          box(0.7, h*0.26, 1.1, along, across - sgn*0.05, gy + h*0.50 + h*0.13, stone, false);
        }
      }
    }

    // the lych gate: a roof on posts at the edge of the churchyard, where the
    // path reaches it. somewhere to arrive, rather than a door in a field.
    if (p.lychgate){
      const gAlong = -L/2 - (p.lychgate.away || 9);
      for (const sgn of [-1, 1]){
        box(.26, 2.1, .26, gAlong, sgn*1.3, gy + 1.05, oak, true);
        box(.26, 2.1, .26, gAlong + 1.4, sgn*1.3, gy + 1.05, oak, true);
      }
      const [gx, gz] = xy(gAlong + .7, 0);
      const roof = new THREE.Mesh(new THREE.ConeGeometry(2.3, 1.15, 4), slate);
      roof.position.set(gx, gy + 2.62, gz); roof.rotation.y = Math.PI/4; add(roof, false);
    }
  }

  // Windows go on a wall that has no doorway in it. Before the rooms started
  // joining up there was only ever one door, so "the far wall" was always free;
  // now the front room has three doors and only the south wall is left.
  const LAMP = p.lamp ? new THREE.Color(p.lamp).getHex() : PAL.lamp;
  for (const wp of winPlan){
    const {wAxis, wSgn, off} = wp;
    const half = wAxis === 'x' ? w/2 : d/2;
    const px = wAxis === 'x' ? x + wSgn*half : x + off;
    const pz = wAxis === 'x' ? z + off       : z + wSgn*half;
    const nx = wAxis === 'x' ? wSgn : 0, nz = wAxis === 'z' ? wSgn : 0;   // outward normal
    const ry = wAxis === 'x' ? wSgn*Math.PI/2 : (wSgn > 0 ? 0 : Math.PI);
    const at = (dOut, dUp, dAlong) => new THREE.Vector3(
      px + nx*dOut + (wAxis === 'x' ? 0 : dAlong),
      gy + h*.55 + dUp,
      pz + nz*dOut + (wAxis === 'x' ? dAlong : 0));
    const put = (mesh, dOut, dUp, dAlong=0) => {
      mesh.position.copy(at(dOut, dUp, dAlong)); mesh.rotation.y = ry;
      worldGroup.add(mesh); return mesh;
    };
    put(new THREE.Mesh(new THREE.PlaneGeometry(1.7,1.35),
      new THREE.MeshStandardMaterial({color:0x2b2420, roughness:1, side:THREE.DoubleSide})), .02, 0);
    const win = put(new THREE.Mesh(new THREE.PlaneGeometry(1.5,1.15),
      new THREE.MeshBasicMaterial({color:LAMP, side:THREE.DoubleSide})), .05, 0);
    const lead = new THREE.MeshStandardMaterial({color:0x2b2420, roughness:1, side:THREE.DoubleSide});
    for (let b=0;b<3;b++)
      put(new THREE.Mesh(new THREE.PlaneGeometry(.055,1.15), lead), .07, 0, -.5+b*.5);
    for (let b=0;b<2;b++)
      put(new THREE.Mesh(new THREE.PlaneGeometry(1.5,.055), lead), .07, -.3+b*.6);
    // and from inside: a deep sill, reveals and a head, because the walls are thick
    const sillIn = put(new THREE.Mesh(new THREE.BoxGeometry(wAxis==='x'?T*2.1:1.85, .12, wAxis==='x'?1.85:T*2.1),
      new THREE.MeshStandardMaterial({color:0xcfc4ad, roughness:.95})), -T*.9, -.66);
    sillIn.rotation.y = 0; sillIn.receiveShadow = true;
    const rev = new THREE.MeshStandardMaterial({color:0x7a6243, roughness:.92});
    for (const s2 of [-1,1]){
      const r2 = put(new THREE.Mesh(new THREE.BoxGeometry(wAxis==='x'?T*1.7:.1, 1.5, wAxis==='x'?.1:T*1.7), rev),
                     -T*.8, 0, s2*.92);
      r2.rotation.y = 0;
    }
    const head = put(new THREE.Mesh(new THREE.BoxGeometry(wAxis==='x'?T*1.7:1.9, .1, wAxis==='x'?1.9:T*1.7), rev),
                     -T*.8, .72);
    head.rotation.y = 0;
    const out = new THREE.PointLight(LAMP, 6, 9, 2);
    out.position.copy(at(1.35, 0, 0)); worldGroup.add(out);
    lamps.push({win, glow:out});
  }
  // a cold lamp reads far brighter than a warm one at the same intensity,
  // and the dither has only five steps to spend before it goes flat white
  const inside = new THREE.PointLight(p.lamp ? LAMP : 0xffc27e,
                                      p.lamp ? 5.5 : 15, Math.max(w,d)*0.95, 2);
  inside.position.set(x, gy + h - 1.11, z); worldGroup.add(inside);
  lamps.push({win:{material:{color:{setHex(){}}}}, glow:inside, indoor:true});

  decorate(id, p, x, z, w, h, d, gy, T);
  if (!p.building)
    worldGroup.add(sprite(p.name.replace(/^the /,''), new THREE.Vector3(x, gy+h+h*.8+1.1, z), .58));
  else if (id === 'house_main')
    worldGroup.add(sprite("otto's house", new THREE.Vector3(x, gy+h+3.4, z), .62));
}

const WOOD = () => new THREE.MeshStandardMaterial({color:0x6b4f33, roughness:.95});
const DARKWOOD = () => new THREE.MeshStandardMaterial({color:0x4a3524, roughness:.95});
// Painted joinery, one colour per room, taken off the reference boards.
const SAGE = {kitchen:0x74836a, house_main:0x7e8776, house_back:0x79847c, washroom:0x6e7f80};

function beams(x, z, inner, h, gy){                   // every ceiling in the reference has them
  const n = Math.max(2, Math.round(inner.d / 1.35));
  for (let i=0;i<n;i++){
    const bz = z - inner.d/2 + (i + .5) * (inner.d/n);
    const b = new THREE.Mesh(new THREE.BoxGeometry(inner.w, .24, .2), DARKWOOD());
    b.position.set(x, gy + h - .47, bz);
    b.castShadow = b.receiveShadow = true; worldGroup.add(b);
  }
}

function dado(x, z, inner, gy, colour){               // painted board to waist height
  const mat = new THREE.MeshStandardMaterial({color:colour, roughness:.88});
  const H = 1.05, t = .07;
  for (const [sx, sz, lw, ld] of [[0,-1,inner.w,t],[0,1,inner.w,t],[-1,0,t,inner.d],[1,0,t,inner.d]]){
    const m = new THREE.Mesh(new THREE.BoxGeometry(lw, H, ld), mat);
    m.position.set(x + sx*(inner.w/2 - t/2), gy + .2 + H/2, z + sz*(inner.d/2 - t/2));
    m.receiveShadow = true; worldGroup.add(m);
  }
  const cap = new THREE.MeshStandardMaterial({color:0x4f4636, roughness:.9});
  for (const [sx, sz, lw, ld] of [[0,-1,inner.w,.14],[0,1,inner.w,.14],[-1,0,.14,inner.d],[1,0,.14,inner.d]]){
    const m = new THREE.Mesh(new THREE.BoxGeometry(lw, .07, ld), cap);
    m.position.set(x + sx*(inner.w/2 - .07), gy + .2 + H + .03, z + sz*(inner.d/2 - .07));
    worldGroup.add(m);
  }
}

function braidedRug(x, z, r, gy){                     // concentric rings, like a rag rug
  const cols = [0x4f332c, 0x6b5a45, 0x3f453a, 0x5d4e3c, 0x47322b];
  for (let i=0;i<4;i++){
    const rr = r * (1 - i*0.23);
    const ring = new THREE.Mesh(new THREE.TorusGeometry(rr, r*0.105, 6, 36),
      new THREE.MeshStandardMaterial({color:cols[i%cols.length], roughness:1}));
    ring.position.set(x, gy + .235, z); ring.rotation.x = -Math.PI/2;
    ring.receiveShadow = true; worldGroup.add(ring);
  }
}

function hangingLamp(x, z, h, gy){                    // the pendant in the reference
  const y = gy + h - .95;
  const flex = new THREE.Mesh(new THREE.CylinderGeometry(.018,.018,.5,6),
    new THREE.MeshStandardMaterial({color:0x2a2420, roughness:.9}));
  flex.position.set(x, y + .34, z); worldGroup.add(flex);
  const shade = new THREE.Mesh(new THREE.ConeGeometry(.3, .3, 18, 1, true),
    new THREE.MeshStandardMaterial({color:0x7a4a3c, roughness:.8, side:THREE.DoubleSide}));
  shade.position.set(x, y, z); shade.rotation.x = Math.PI; worldGroup.add(shade);
  const cap = new THREE.Mesh(new THREE.CircleGeometry(.3, 18),
    new THREE.MeshStandardMaterial({color:0x72503f, roughness:.85}));
  cap.position.set(x, y + .15, z); cap.rotation.x = Math.PI/2; worldGroup.add(cap);
  const bulb = new THREE.Mesh(new THREE.SphereGeometry(.065, 10, 8),
    new THREE.MeshBasicMaterial({color:0xffd9a0}));
  bulb.position.set(x, y - .12, z); worldGroup.add(bulb);
}

function decorate(id, p, x, z, w, h, d, gy, T){
  const add = (geo, mat, px, py, pz, ry=0) => {
    const m = new THREE.Mesh(geo, mat);
    m.position.set(px, py, pz); m.rotation.y = ry;
    m.castShadow = m.receiveShadow = true; worldGroup.add(m); return m;
  };
  const inner = {w: w - T*2 - .25, d: d - T*2 - .25};

  if (id === 'library'){
    for (const sgn of [-1, 1]){                       // bookcases against the end walls
      const bz = z + sgn*(inner.d/2 - .3);
      add(new THREE.BoxGeometry(inner.w-.6, h-1.6, .5), DARKWOOD(), x, gy+(h-1.6)/2+.2, bz);
      for (let s2=0; s2<4; s2++){
        const sy = gy + .9 + s2*((h-2.4)/4);
        for (let i=0; i<Math.floor((inner.w-1)/0.22); i++){
          const bk = new THREE.Mesh(new THREE.BoxGeometry(.17, .34+Math.random()*.2, .34),
            new THREE.MeshStandardMaterial({
              color:new THREE.Color().setHSL(.07+Math.random()*.1, .3, .22+Math.random()*.22),
              roughness:1}));
          bk.position.set(x - inner.w/2 + .6 + i*.22, sy+.2, bz - sgn*.1);
          worldGroup.add(bk);
        }
      }
    }
    add(new THREE.BoxGeometry(1.6,.12,1.0), WOOD(), x, gy+.95, z - inner.d/2 + 1.4);   // reading table
    for (const o of [[-.5,-.5],[.5,.5]])
      add(new THREE.CylinderGeometry(.07,.07,.85,6), DARKWOOD(), x+o[0]*1.4, gy+.5, z-inner.d/2+1.4+o[1]*.6);
    return;
  }
  if (id === 'restaurant'){
    add(new THREE.BoxGeometry(inner.w-1.4, .9, .7), DARKWOOD(), x, gy+.55, z - inner.d/2 + .9);
    for (let i=0;i<3;i++){                            // three tables, as described
      const tz = z - inner.d/2 + 2.4 + i*1.5;
      add(new THREE.CylinderGeometry(.6,.6,.1,12), WOOD(), x, gy+.78, tz);
      add(new THREE.CylinderGeometry(.09,.12,.78,8), DARKWOOD(), x, gy+.4, tz);
      for (const sgn of [-1,1])
        add(new THREE.BoxGeometry(.4,.1,.4), WOOD(), x+sgn*1.0, gy+.5, tz);
    }
    return;
  }
  if (p.kind === 'shop'){
    add(new THREE.BoxGeometry(inner.w-1.2, .95, .6), DARKWOOD(), x, gy+.58, z - inner.d/2 + .6);
    for (const sgn of [-1,1]){                        // stock shelving on the end walls
      const bz = z + sgn*(inner.d/2 - .25);
      for (let s2=0;s2<3;s2++)
        add(new THREE.BoxGeometry(inner.w-1.4,.07,.45), WOOD(), x, gy+.8+s2*.85, bz);
      for (let i=0;i<14;i++){
        const b=new THREE.Mesh(new THREE.BoxGeometry(.22,.3,.22),
          new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL(Math.random(),.2,.45),roughness:1}));
        b.position.set(x-inner.w/2+1.0+(i%5)*.9, gy+1.0+Math.floor(i/5)*.85, bz - sgn*.05);
        worldGroup.add(b);
      }
    }
    return;
  }
  if (p.kind === 'indoor'){                           // his own rooms
    beams(x, z, inner, h, gy);
    dado(x, z, inner, gy, SAGE[id] || 0x6e7a5d);
    if (id !== 'washroom') braidedRug(x, z, Math.min(inner.w,inner.d)*.20, gy);
    if (id === 'kitchen'){
      // a run of painted cupboards with a worktop, and the pan rail over it
      const cw = inner.w - .5;
      add(new THREE.BoxGeometry(cw, .9, .62),
          new THREE.MeshStandardMaterial({color:0x74836a, roughness:.85}),
          x, gy+.66, z - inner.d/2 + .4);
      add(new THREE.BoxGeometry(cw+.12, .09, .72),
          new THREE.MeshStandardMaterial({color:0x58412c, roughness:.85}),
          x, gy+1.15, z - inner.d/2 + .4);
      const styl = new THREE.MeshStandardMaterial({color:0x5e6b53, roughness:.85});
      for (let i=0;i<=4;i++)                           // stiles between the doors
        add(new THREE.BoxGeometry(.07, .84, .04), styl,
            x - cw/2 + i*(cw/4), gy+.66, z - inner.d/2 + .10);
      for (const yy of [.26, 1.06])                    // rails top and bottom
        add(new THREE.BoxGeometry(cw, .07, .04), styl, x, gy+yy, z - inner.d/2 + .10);
      const rail = add(new THREE.CylinderGeometry(.035,.035,cw*.7,8),
          new THREE.MeshStandardMaterial({color:0x2b2621, roughness:.6, metalness:.5}),
          x, gy+h-1.15, z - inner.d/2 + .55);
      rail.rotation.z = Math.PI/2;
      for (let i=0;i<4;i++){                          // copper, straight off the board
        const pan = add(new THREE.CylinderGeometry(.26,.22,.14,16),
          new THREE.MeshStandardMaterial({color:0x8a5730, roughness:.62, metalness:.3}),
          x - cw*.3 + i*(cw*.2), gy+h-1.5, z - inner.d/2 + .55);
        pan.rotation.x = Math.PI/2;
        add(new THREE.BoxGeometry(.05,.3,.05),
          new THREE.MeshStandardMaterial({color:0x2b2621, roughness:.6, metalness:.5}),
          x - cw*.3 + i*(cw*.2), gy+h-1.3, z - inner.d/2 + .55);
      }
    }
    if (id === 'washroom'){
      add(new THREE.BoxGeometry(inner.w-1.0, .06, .5), WOOD(), x, gy+1.0, z + inner.d/2 - .35);
      for (let i=0;i<3;i++)                           // things in a row on the shelf
        add(new THREE.CylinderGeometry(.1,.11,.26,10),
          new THREE.MeshStandardMaterial({color:0xd8d2c4, roughness:.9}),
          x - .7 + i*.7, gy+1.16, z + inner.d/2 - .35);
    }
    hangingLamp(x, z, h, gy);
    return;
  }
  if (p.kind === 'civic'){                            // post office
    add(new THREE.BoxGeometry(inner.w-1.0, 1.0, .55), DARKWOOD(), x, gy+.6, z - inner.d/2 + .55);
    for (let r=0;r<4;r++) for (let c=0;c<8;c++){      // the wall of brass boxes
      const bx2 = new THREE.Mesh(new THREE.BoxGeometry(.3,.3,.08),
        new THREE.MeshStandardMaterial({color:0x9a7b3c, roughness:.4, metalness:.65}));
      bx2.position.set(x - inner.w/2 + .5 + c*.36, gy+1.1+r*.36, z + inner.d/2 - .2);
      worldGroup.add(bx2);
    }
  }
}

/* ---------- real models, when there are any ----------
   Drop a .glb into site/models/ and name it here. It is measured, scaled to the
   size the world wants, stood on the floor and turned to face the room, so a
   model straight off the internet lands correctly without hand fitting. If the
   file is missing or will not load, the hand-built version below is used and
   nothing breaks. */
const MODELS = {
  range:     {file:'models/range.glb',     fit:{w:1.72}, ry:0},
  rushchair: {file:'models/chair.glb',     fit:{h:0.98}, ry:0},
  worktable: {file:'models/worktable.glb', fit:{w:1.55}, ry:0},
  bed:       {file:'models/bed.glb',       fit:{w:1.90}, ry:0},
  nightstand:{file:'models/nightstand.glb',fit:{h:0.62}, ry:0},
  slab:      {file:'models/slab.glb',      fit:{w:1.25}, ry:0},
  sink:      {file:'models/sink.glb',      fit:{w:1.00}, ry:0},
  bath:      {file:'models/bath.glb',      fit:{w:1.55}, ry:0},
  jug:       {file:'models/jug.glb',       fit:{h:0.40}, ry:0},
  bookcase:  {file:'models/bookcase.glb',  fit:{h:2.20}, ry:0},
  counter:   {file:'models/counter.glb',   fit:{w:2.40}, ry:0},
};
const MODELCACHE = {};
function loadModels(){
  const draco = new DRACOLoader();
  draco.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/libs/draco/');
  const gl = new GLTFLoader(); gl.setDRACOLoader(draco);
  for (const [kind, spec] of Object.entries(MODELS)){
    gl.load(spec.file, res => {
      const root = res.scene;
      const box = new THREE.Box3().setFromObject(root);
      const size = box.getSize(new THREE.Vector3());
      const k = spec.fit.w ? spec.fit.w / Math.max(size.x, size.z)
                           : spec.fit.h / Math.max(0.001, size.y);
      root.scale.setScalar(k);
      const b2 = new THREE.Box3().setFromObject(root);
      const c2 = b2.getCenter(new THREE.Vector3());
      root.position.set(-c2.x, -b2.min.y, -c2.z);     // centred, standing on the floor
      const holder = new THREE.Group();
      holder.add(root); holder.rotation.y = spec.ry || 0;
      holder.traverse(o => { if (o.isMesh){ o.castShadow = true; o.receiveShadow = true; } });
      MODELCACHE[kind] = holder;
      console.log('model ready:', kind);
    }, undefined, () => {});                          // no file yet is not an error
  }
}
loadModels();

// a turned leg or spindle: stacked discs and a bead, which is all it takes to read
function turned(len, r, beads=2){
  const g = new THREE.Group();
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(r*.78, r*.62, len, 9), OAK());
  shaft.position.y = len/2; g.add(shaft);
  for (let i=0;i<beads;i++){
    const y = len * (0.22 + i*0.42);
    const b = new THREE.Mesh(new THREE.SphereGeometry(r*1.02, 9, 7), OAK());
    b.scale.y = .62; b.position.y = y; g.add(b);
    const c = new THREE.Mesh(new THREE.CylinderGeometry(r*.95, r*.95, r*.5, 9), OAK());
    c.position.y = y + r*.5; g.add(c);
  }
  g.traverse(o => { if (o.isMesh) o.castShadow = true; });
  return g;
}

// the woven rush seat, four triangles of fine reed meeting in the middle
let RUSHTEX = null;
function rushTexture(){
  if (RUSHTEX) return RUSHTEX;
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#c2b771'; g.fillRect(0,0,256,256);
  const quads = [[0,0,256,0],[256,0,256,256],[256,256,0,256],[0,256,0,0]];
  quads.forEach((q, qi) => {
    g.save(); g.beginPath(); g.moveTo(128,128); g.lineTo(q[0],q[1]); g.lineTo(q[2],q[3]);
    g.closePath(); g.clip();
    g.strokeStyle = 'rgba(62,55,22,.85)'; g.lineWidth = 2.1;
    const horiz = qi % 2 === 0;
    for (let i=-256;i<512;i+=7){
      g.beginPath();
      if (horiz){ g.moveTo(-10, i); g.lineTo(266, i); } else { g.moveTo(i, -10); g.lineTo(i, 266); }
      g.stroke();
    }
    g.fillStyle = qi < 2 ? 'rgba(255,248,200,.16)' : 'rgba(60,54,24,.22)';
    g.fillRect(0,0,256,256);
    g.restore();
  });
  RUSHTEX = new THREE.CanvasTexture(c);
  return RUSHTEX;
}

function rigRushChair(){
  const g = new THREE.Group();
  const S = .46;                                   // seat half-width
  // back legs run all the way up and become the back posts
  for (const sx of [-1, 1]){
    const post = turned(1.52, .052, 3);
    post.position.set(sx*S*.86, 0, -S*.80); g.add(post);
  }
  for (const sx of [-1, 1]){                       // front legs
    const leg = turned(.78, .055, 2);
    leg.position.set(sx*S*.92, 0, S*.82); g.add(leg);
  }
  const rail = (w2, h2, d2, px, py, pz) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w2,h2,d2), OAK());
    m.position.set(px,py,pz); m.castShadow = true; g.add(m); return m;
  };
  rail(S*1.9, .07, .07,  0, .78,  S*.82);          // seat frame
  rail(S*1.9, .07, .07,  0, .78, -S*.80);
  rail(.07, .07, S*1.7, -S*.89, .78, 0);
  rail(.07, .07, S*1.7,  S*.89, .78, 0);
  // the rush seat itself, slightly domed
  const seat = new THREE.Mesh(new THREE.BoxGeometry(S*1.84, .07, S*1.62),
    new THREE.MeshStandardMaterial({map: rushTexture(), roughness:.98}));
  seat.position.set(0, .82, .01); seat.receiveShadow = true; g.add(seat);
  // four turned spindles up the back, and the rail they sit on
  rail(S*1.72, .075, .06, 0, 1.12, -S*.80);
  for (let i=0;i<4;i++){
    const sp = turned(.36, .030, 2);
    sp.position.set(-S*.62 + i*(S*1.24/3), 1.15, -S*.80); g.add(sp);
  }
  // the curved top rail, a shallow arc of pale honey wood
  const top = new THREE.Mesh(new THREE.TorusGeometry(1.08, .075, 8, 22, 0.98),
    new THREE.MeshStandardMaterial({color:0xb98b4d, roughness:.72}));
  top.position.set(0, .62, -S*.80); top.rotation.z = (Math.PI - 0.98)/2;
  top.scale.set(1, .80, .62); top.castShadow = true; g.add(top);
  // stretchers low down
  const st = turned(S*1.84, .036, 2); st.rotation.z = -Math.PI/2;
  st.position.set(-S*.92, .26, S*.82); g.add(st);
  for (const sx of [-1,1]) rail(.05, .05, S*1.66, sx*S*.89, .30, 0);
  return g;
}
