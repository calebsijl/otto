  const collar = new THREE.Mesh(new THREE.CylinderGeometry(.17,.17,.12,14), IRON2());
  collar.position.set(W/2 - .36, H + .18, -D*.12); g.add(collar);
  for (const sx of [-1,1]) for (const sz of [-1,1]){      // feet
    const f = new THREE.Mesh(new THREE.BoxGeometry(.10,.09,.10), IRON());
    f.position.set(sx*(W/2-.1), .045, sz*(D/2-.1)); g.add(f);
  }
  // a copper pot and a pan living on the hot end, as in the photograph
  const pot = new THREE.Mesh(new THREE.CylinderGeometry(.19,.17,.21,16), COPPER());
  pot.position.set(W/2 - .78, H + .18, .06); pot.castShadow = true; g.add(pot);
  const lid = new THREE.Mesh(new THREE.CylinderGeometry(.20,.20,.03,16), COPPER());
  lid.position.set(W/2 - .78, H + .30, .06); g.add(lid);
  const shallow = new THREE.Mesh(new THREE.CylinderGeometry(.22,.19,.09,16), COPPER());
  shallow.position.set(W/2 - .30, H + .12, .02); shallow.castShadow = true; g.add(shallow);
  // the fire itself, which flickers
  const fire = new THREE.PointLight(0xff7e2c, 6, 6.5, 2);
  fire.position.set(0, H*.42, face + .95); g.add(fire);
  FIRES.push({light: fire, glow: glow.material});
  return g;
}

function buildRig(kind){
  if (MODELCACHE[kind]) return MODELCACHE[kind].clone(true);
  if (kind === 'deadtrain'){
    /* An american eight-wheeler with its tender, a carriage, and one more
       carriage that has gone into the ground. It has not moved in years and
       nothing about it is going to move again.

       Every piece is collected by colour and merged, so the whole train is
       about ten meshes rather than the three hundred it is built from. */
    const g = new THREE.Group();
    const R = () => Math.random();
    const BK = new Map();
    const put = (geo, col, px, py, pz, rot, scl) => {
      const q = geo.clone();
      if (scl) q.scale(scl[0], scl[1], scl[2]);
      if (rot) q.applyMatrix4(new THREE.Matrix4().makeRotationFromEuler(
        new THREE.Euler(rot[0] || 0, rot[1] || 0, rot[2] || 0)));
      q.translate(px, py, pz);
      if (!BK.has(col)) BK.set(col, []);
      BK.get(col).push(q);
      geo.dispose();
    };
    const bx = (c, bw, bh, bd, px, py, pz, rot) =>
      put(new THREE.BoxGeometry(bw, bh, bd), c, px, py, pz, rot);
    const cy = (c, rt, rb, hh, px, py, pz, seg, rot) =>
      put(new THREE.CylinderGeometry(rt, rb, hh, seg || 10), c, px, py, pz, rot);
    const sp = (c, r, px, py, pz, scl) =>
      put(new THREE.SphereGeometry(r, 8, 6), c, px, py, pz, null, scl);

    const BLACK = 0x221d1a, LINED = 0x2a2522, IRON = 0x1b1816;
    const RUST = 0x7a4028, RUSTD = 0x5a2f1d, MOSS = 0x4f5a34;
    const DULL = 0x6e5a33, BAND = 0x8a7342, EARTH = 0x6d5a3c;
    const BODY = 0x6d3a2a, CANVAS = 0x8e8470, DARK = 0x0d0f12;

    const wheelAt = (r, px, py, pz, n) => {
      put(new THREE.TorusGeometry(r - .03, .05, 5, 16), IRON, px, py, pz, [0, Math.PI / 2, 0]);
      put(new THREE.TorusGeometry(r - .13, .06, 5, 14), IRON, px, py, pz, [0, Math.PI / 2, 0]);
      cy(IRON, .12, .12, .2, px, py, pz, 8, [0, 0, Math.PI / 2]);
      const len = r - .18;
      for (let i = 0; i < n; i++){
        const a = i / n * Math.PI * 2;
        bx(IRON, .05, len, .05, px, py + Math.cos(a) * len / 2,
           pz + Math.sin(a) * len / 2, [a, 0, 0]);
      }
    };

    /* ---- the engine ---- */
    bx(LINED, 9.6, .26, 1.9, 1.0, 1.62, 0);
    for (const dz of [1.62, -1.62]) bx(LINED, 8.2, .12, .42, 1.2, 1.80, dz);
    cy(BLACK, .72, .72, 5.1, 1.65, 2.60, 0, 16, [0, 0, Math.PI / 2]);
    cy(BLACK, .80, .80, .9, 4.55, 2.60, 0, 16, [0, 0, Math.PI / 2]);
    cy(LINED, .78, .78, .14, 5.02, 2.60, 0, 16, [0, 0, Math.PI / 2]);
    cy(DULL, .24, .24, .07, 5.11, 2.60, 0, 12, [0, 0, Math.PI / 2]);
    for (const ax of [.3, 1.65, 3.0])
      cy(BAND, .75, .75, .09, ax, 2.60, 0, 16, [0, 0, Math.PI / 2]);

    cy(BLACK, .26, .30, .6, 3.9, 3.50, 0, 12);            // stack, split open
    cy(RUSTD, .54, .28, .74, 3.9, 4.08, 0, 14, [.1, 0, -.17]);
    cy(RUSTD, .60, .58, .09, 4.02, 4.44, .07, 14, [.22, 0, -.3]);
    sp(0x6b5a3a, .27, 3.9, 4.2, 0, [1, .45, 1]);           // something nesting

    bx(LINED, .75, .14, .14, 5.3, 3.40, 0);                // headlamp, hanging
    bx(LINED, .6, .7, .6, 5.62, 3.70, 0, [0, 0, .26]);
    cy(LINED, .02, .44, .24, 5.68, 4.16, 0, 4, [0, Math.PI / 4, .26]);
    bx(DARK, .05, .44, .44, 5.93, 3.62, 0, [0, 0, .26]);

    for (const dz of [.2, -.2]) bx(DULL, .09, .42, .09, 2.9, 3.30, dz);
    bx(DULL, .09, .09, .5, 2.9, 3.50, 0);                  // the yoke, bell gone

    for (const [ax, r] of [[2.2, .32], [1.1, .28], [0.0, .30]]){
      cy(BLACK, r, r, .42, ax, 3.45, 0, 10);
      if (ax !== 1.1) sp(DULL, r + .04, ax, 3.66, 0, [1, .6, 1]);
    }
    cy(RUSTD, .32, .32, .07, 1.5, 1.90, 1.5, 10, [.1, 0, .3]);  // the lid, off

    bx(BLACK, 2.2, 1.9, 2.4, -2.05, 2.95, 0);              // cab
    bx(RUSTD, 2.8, .12, 1.1, -2.05, 4.00, -.9);
    bx(RUSTD, 2.7, .12, .9, -2.05, 3.92, .95, [.12, 0, .05]);
    for (const dz of [1.21, -1.21])
      for (const ax of [-1.4, -2.65]){
        bx(DARK, .52, .64, .08, ax, 3.02, dz);
        cy(DARK, .26, .26, .08, ax, 3.34, dz, 10, [Math.PI / 2, 0, 0]);
      }

    for (const dz of [1.3, -1.3]){
      cy(LINED, .32, .32, 1.1, 3.5, 1.45, dz, 10, [0, 0, Math.PI / 2]);
      bx(LINED, .3, .28, .28, 2.85, 1.45, dz);
    }
    bx(IRON, 3.3, .1, .07, 1.5, .88, 1.46);
    bx(RUSTD, 3.1, .1, .07, 1.3, .34, -1.5, [0, 0, -.16]);
    for (const dz of [1.52, -1.52]) bx(IRON, 2.3, .11, .06, -1.5, .88, dz);

    bx(LINED, 2.0, .2, 2.4, 3.3, .95, 0);                  // the leading truck
    for (const ax of [2.8, 3.8]) for (const dz of [1.3, -1.3])
      wheelAt(.40, ax, .50, dz, 8);
    for (const ax of [-0.4, -2.6]) for (const dz of [1.3, -1.3]){
      if (ax === -0.4 && dz < 0) continue;                 // this one is off
      wheelAt(.78, ax, .88, dz, 12);
    }
    put(new THREE.TorusGeometry(.75, .05, 5, 16), IRON, .9, .16, -2.6, [Math.PI / 2, 0, .14]);
    cy(IRON, .12, .12, .2, .9, .16, -2.6, 8);

    bx(0x5e2a20, .3, .9, 2.7, 5.35, 1.50, 0);              // the pilot, askew
    for (let i = 0; i < 9; i++){
      if (i === 2 || i === 5 || i === 7) continue;         // slats gone
      const dz = -1.0 + i * .25;
      bx(LINED, 1.6, .1, .12, 6.15, .88, dz, [0, -dz * .22, -.52]);
    }
    for (const dz of [1.14, -1.14])
      bx(LINED, 1.6, .13, .13, 6.15, .84, dz, [0, -dz * .22, -.52]);
    cy(LINED, .05, .05, .9, 5.4, .9, .3, 6, [.25, 0, .3]);

    /* ---- the tender ---- */
    bx(LINED, 4.6, .26, 2.2, -6.0, 1.45, 0);
    bx(BLACK, 4.4, 1.7, 2.3, -6.0, 2.40, 0);
    for (const dz of [1.18, -1.18]){
      bx(DULL, 3.7, .08, .06, -6.0, 3.05, dz);
      bx(DULL, 3.7, .08, .06, -6.0, 1.80, dz);
      for (const ax of [-1.85, 1.85]) bx(DULL, .08, 1.25, .06, -6.0 + ax, 2.42, dz);
    }
    for (let i = 0; i < 14; i++)                           // weeds where the coal was
      cy(MOSS, 0, .07, .45 + R() * .5, -7.9 + R() * 3.8, 3.4, (R() - .5) * 1.8, 4);
    for (const bxp of [-4.5, -7.5]){
      bx(LINED, 1.6, .18, 2.4, bxp, 1.05, 0);
      for (const dx of [-.5, .5]) for (const dz of [1.3, -1.3])
        wheelAt(.40, bxp + dx, .50, dz, 8);
    }

    /* ---- rust, and weeds through all of it ---- */
    for (const [ax, ay, dz, bw, bh] of [[.9,2.9,1,1.1,.5],[2.6,2.3,1,.9,.6],
                                        [-2.3,3.2,-1,.8,.5],[4.5,2.2,-1,.7,.5]])
      bx(RUST, bw, bh, .06, ax, ay, dz > 0 ? .68 : -.68);
    for (const [ax, dz] of [[-5.2,1.19],[-6.6,1.19],[-5.8,-1.19],[-7.0,-1.19]])
      bx(RUST, .55, .6, .05, ax, 2.5, dz);
    for (const [ax, dz] of [[-5.4,1.2],[-6.4,1.2],[-6.0,-1.2]])
      bx(RUSTD, .1, .9, .04, ax, 1.95, dz);
    bx(RUST, .08, 2.0, 1.4, -3.35, 1.3, 1.15, [0, 0, .22]);
    for (let i = 0; i < 30; i++)
      cy(MOSS, 0, .06, .4 + R() * .55, -8.0 + R() * 14.0, .24, (R() - .5) * 3.0, 4);

    /* ---- a carriage, and one that has gone into the ground ---- */
    const carriage = (cx, sunk) => {
      const rz = sunk ? .10 : 0, dy = sunk ? -1.35 : 0;
      const ca = Math.cos(rz), sa = Math.sin(rz);
      // the sunk one is pitched about its own centre, so every piece is turned
      // and moved by the same amount rather than sheared into place
      const AX = (px, py) => cx + (px * ca - py * sa);
      const AY = (px, py) => dy + (px * sa + py * ca);
      const rot = extra => [0, extra || 0, rz];

      bx(LINED, 7.0, .32, 2.6, AX(0, .95), AY(0, .95), 0, rot());
      bx(BODY, 6.8, 2.1, 2.5, AX(0, 2.2), AY(0, 2.2), 0, rot());
      for (const [rx, len] of [[-2.4, 1.9], [0.5, 1.5], [2.8, 1.2]])
        cy(CANVAS, 1.3, 1.3, len, AX(rx, 3.1), AY(rx, 3.1), 0, 12,
           [0, 0, Math.PI / 2 + rz]);
      bx(RUSTD, 1.1, .07, 2.3, AX(1.85, 2.98), AY(1.85, 2.98), 0, rot());
      for (const dz of [1.27, -1.27])
        for (let i = 0; i < 5; i++){
          const gx = -2.6 + i * 1.3;
          bx(DARK, .82, .8, .08, AX(gx, 2.5), AY(gx, 2.5), dz, rot());
          bx(0xd3c6ad, .92, .9, .06, AX(gx, 2.5), AY(gx, 2.5),
             dz + (dz > 0 ? .06 : -.06), rot());
        }
      if (!sunk)
        for (const b of [-2.3, 2.3])
          for (const dx of [-.6, .6]) for (const dz of [1.25, -1.25])
            wheelAt(.5, cx + b + dx, .6, dz, 8);
      bx(BODY, .1, 1.7, 1.0, AX(3.25, 1.95), AY(3.25, 1.95), 1.65, rot(.95));
      for (let i = 0; i < 16; i++)                          // ivy up the far end
        sp(MOSS, .17, cx - 3.45 + R() * .55, dy + 1.1 + R() * 2.1,
           -1.35 + R() * 2.7);
      if (sunk){
        bx(0x2b2a22, 2.3, .45, 2.32, AX(-2.4, 2.95), AY(-2.4, 2.95), 0, rot());
        // the earth heaped along it, which sits on the ground, not on the car
        bx(EARTH, 9.2, .55, 3.2, cx + .2, .12, 0);
        for (const dz of [2.05, -2.05])
          bx(EARTH, 9.6, 1.15, 1.6, cx + .2, .3, dz, [0, 0, .05]);
        bx(EARTH, 3.8, 1.5, 5.4, cx - 4.5, .35, 0, [0, 0, .13]);
        for (let i = 0; i < 40; i++)
          cy(MOSS, 0, .07, .4 + R() * .6, cx - 4.8 + R() * 10.4, .6,
             (R() - .5) * 4.8, 4);
      }
    };
    carriage(-12.2, false);
    carriage(-19.8, true);

    for (const [col, parts] of BK){
      const m = new THREE.Mesh(mergeGeometries(parts, false),
        new THREE.MeshStandardMaterial({color:col, roughness:.92}));
      m.castShadow = m.receiveShadow = true; g.add(m);
      for (const q of parts) q.dispose();
    }
    return g;
  }

  if (kind === 'stationclock'){
    const g = new THREE.Group();
    const iron = new THREE.MeshStandardMaterial({color:0x2b2724, roughness:.85});
    const put = (geo, m, px, py, pz, rz) => {
      const e = new THREE.Mesh(geo, m); e.position.set(px, py, pz);
      if (rz) e.rotation.z = rz; e.castShadow = true; g.add(e); return e;
    };
    put(new THREE.BoxGeometry(.13, 2.4, .13), iron, 0, 1.2, 0);
    put(new THREE.BoxGeometry(.5, .12, .12), iron, .25, 2.35, 0);
    const face = put(new THREE.CylinderGeometry(.42, .42, .1, 18),
      new THREE.MeshStandardMaterial({color:0xe8ddc4, roughness:.9}), .5, 2.3, 0);
    face.rotation.x = Math.PI / 2;
    const rim = new THREE.Mesh(new THREE.TorusGeometry(.45, .05, 5, 18), iron);
    rim.position.set(.5, 2.3, 0); g.add(rim);
    // twenty past four, and nobody has wound it either way
    const hand = (len, wide, ang) => {
      const m = put(new THREE.BoxGeometry(wide, len, .03),
        new THREE.MeshStandardMaterial({color:0x241a14}),
        .5 + Math.sin(ang) * len / 2, 2.3 + Math.cos(ang) * len / 2, .07);
      m.rotation.z = -ang; return m;
    };
    hand(.22, .05, 2.269);
    hand(.34, .04, 2.094);
    return g;
  }



  if (kind === 'bench'){
    /* Cast ends, four slats across the seat, and a back raked off the
       vertical. The back is one assembly hung off the back edge of the seat
       and raked as a whole, so the uprights and the slats lean together
       instead of the slats floating behind them. Built facing +x. */
    const g = new THREE.Group();
    const iron = new THREE.MeshStandardMaterial({color:0x2b2724, roughness:.85});
    const wood = new THREE.MeshStandardMaterial({color:0x6b5134, roughness:.95});
    const put = (host, geo, m, px, py, pz) => {
      const e = new THREE.Mesh(geo, m); e.position.set(px, py, pz);
      e.castShadow = e.receiveShadow = true; host.add(e); return e;
    };
    for (const dz of [-.78, .78]){                       // the cast ends
      put(g, new THREE.BoxGeometry(.60, .42, .10), iron, -.02, .21, dz);
      put(g, new THREE.BoxGeometry(.70, .07, .15), iron, -.02, .035, dz);
    }
    for (let i = 0; i < 4; i++)                          // the seat
      put(g, new THREE.BoxGeometry(.13, .055, 1.80), wood, -.26 + i * .17, .45, 0);
    const back = new THREE.Group();                      // and the back, as one
    back.position.set(-.30, .45, 0);
    back.rotation.z = .22;
    g.add(back);
    for (const dz of [-.78, .78])
      put(back, new THREE.BoxGeometry(.08, .74, .09), iron, 0, .37, dz);
    for (let i = 0; i < 3; i++)
      put(back, new THREE.BoxGeometry(.06, .12, 1.80), wood, -.04, .14 + i * .24, 0);
    return g;
  }

  if (kind === 'lamppost'){
    /* A cast post with a glass case on top. The glass is what comes up at
       dusk: it goes in EMBERS so it dims with the daylight, and its light
       joins the ordinary outdoor lamps. */
    const g = new THREE.Group();
    const iron = new THREE.MeshStandardMaterial({color:0x2b2724, roughness:.8});
    const H = 2.9;
    const add = (geo, m, py) => { const e = new THREE.Mesh(geo, m);
      e.position.y = py; e.castShadow = true; g.add(e); return e; };
    add(new THREE.CylinderGeometry(.26, .34, .30, 10), iron, .15);
    add(new THREE.CylinderGeometry(.19, .24, .26, 10), iron, .40);
    add(new THREE.CylinderGeometry(.085, .14, H, 10), iron, .55 + H / 2);
    add(new THREE.CylinderGeometry(.17, .12, .20, 10), iron, .62 + H);
    const glass = new THREE.MeshStandardMaterial({color:0x2a2420,
      emissive:new THREE.Color(0xff7a24), emissiveIntensity:2.2, roughness:.4});
    add(new THREE.BoxGeometry(.42, .56, .42), glass, 1.0 + H);
    for (const dx of [.21, -.21]) for (const dz of [.21, -.21]){
      const bar = new THREE.Mesh(new THREE.BoxGeometry(.05, .58, .05), iron);
      bar.position.set(dx, 1.0 + H, dz); g.add(bar);
    }
    add(new THREE.ConeGeometry(.33, .26, 10), iron, 1.41 + H);
    add(new THREE.CylinderGeometry(.035, .035, .14, 6), iron, 1.60 + H);
    const l = new THREE.PointLight(0xff7a24, 9, 11, 2);
    l.position.y = 1.0 + H; g.add(l);
    lamps.push({win:{material:{color:{setHex(){}}}}, glow:l});
    EMBERS.push(glass);
    return g;
  }

  if (kind === 'bed'){
    /* A planted bed. The first version was bare soil with evenly scattered
       single flowers on long stems, which at his height reads as lollipops in
       a row. This one is low foliage first, in clumps, with small heads just
       above it. Everything is merged, so a bed is eight meshes, not eighty. */
    const g = new THREE.Group();
    const R = () => Math.random();
    const L = 4.8, Wd = 1.7;
    const soil = new THREE.Mesh(new THREE.BoxGeometry(Wd, .22, L),
      new THREE.MeshStandardMaterial({color:0x6b573a, roughness:1}));
    soil.position.y = .11; soil.receiveShadow = true; g.add(soil);
    const kerb = new THREE.MeshStandardMaterial({color:0x7a7266, roughness:1});
    for (const [bw, bd, bx, bz] of [[Wd + .24, .14, 0, L / 2 + .07],
                                    [Wd + .24, .14, 0, -L / 2 - .07],
                                    [.14, L + .28, Wd / 2 + .07, 0],
                                    [.14, L + .28, -Wd / 2 - .07, 0]]){
      const k = new THREE.Mesh(new THREE.BoxGeometry(bw, .2, bd), kerb);
      k.position.set(bx, .1, bz); k.receiveShadow = true; g.add(k);
    }
    const clumps = [];
    for (let i = 0; i < 7; i++)
      clumps.push([(R() - .5) * (Wd - .5), -L / 2 + .4 + i * ((L - .8) / 6)]);

    const leafGeo = [], leaf = new THREE.SphereGeometry(.22, 7, 5);
    for (let i = 0; i < 30; i++){
      const [cx, cz] = clumps[(R() * clumps.length) | 0];
      const s = .7 + R() * .8;
      const q = leaf.clone();
      q.scale(s, s * .5, s);
      q.translate(cx + (R() - .5) * .7, .24, cz + (R() - .5) * .8);
      leafGeo.push(q);
    }
    leaf.dispose();
    const foliage = new THREE.Mesh(mergeGeometries(leafGeo, false),
      new THREE.MeshStandardMaterial({color:0x56692f, roughness:1}));
    foliage.castShadow = true; g.add(foliage);
    for (const q of leafGeo) q.dispose();

    const COL = [0xd9533a, 0xe8a63c, 0xc9576f, 0xe8dcc0, 0x8c6fb0];
    const heads = COL.map(() => []);
    const stems = [];
    const stemGeo = new THREE.CylinderGeometry(.012, .018, 1, 4);
    const headGeo = new THREE.SphereGeometry(.062, 6, 5);
    for (let i = 0; i < 34; i++){
      const [cx, cz] = clumps[(R() * clumps.length) | 0];
      const fx = cx + (R() - .5) * .8, fz = cz + (R() - .5) * .9;
      const h = .16 + R() * .2;
      const s = stemGeo.clone(); s.scale(1, h, 1);
      s.translate(fx, .26 + h / 2, fz); stems.push(s);
      const q = headGeo.clone();
      q.translate(fx, .27 + h, fz);
      heads[(R() * COL.length) | 0].push(q);
    }
    stemGeo.dispose(); headGeo.dispose();
    const sm = new THREE.Mesh(mergeGeometries(stems, false),
      new THREE.MeshStandardMaterial({color:0x5c6f34, roughness:1}));
    g.add(sm);
    for (const q of stems) q.dispose();
    heads.forEach((parts, i) => {
      if (!parts.length) return;
      const m = new THREE.Mesh(mergeGeometries(parts, false),
        new THREE.MeshStandardMaterial({color:COL[i], roughness:.9}));
      g.add(m);
      for (const q of parts) q.dispose();
    });
    return g;
  }

  if (kind === 'glass'){
    // A real mirror, so when he stands in front of it there is genuinely
    // something there. He has never been told what one is.
    const g = new THREE.Group();
    const m = new Reflector(new THREE.PlaneGeometry(.78, 1.12), {
      textureWidth: 512, textureHeight: 512, color: 0x8a8f8c });
    m.position.set(0, 1.35, .045); g.add(m);
    const frame = new THREE.Mesh(new THREE.BoxGeometry(.96, 1.3, .08),
      new THREE.MeshStandardMaterial({color:0x4a3524, roughness:.9}));
    frame.position.set(0, 1.35, 0); frame.castShadow = true; g.add(frame);
    return g;
  }
  if (kind === 'bath'){
    const g = new THREE.Group();
    const tin = new THREE.MeshStandardMaterial({color:0x9aa0a2, roughness:.42, metalness:.55});
    const body = new THREE.Mesh(new THREE.CylinderGeometry(.62,.5,.52,18,1,true), tin);

function buildObjects(world){
  const count = {};
  for (const o of world.objects){
    if (o.place==='_carried') continue;
    const p = world.places[o.place]; if (!p) continue;
    const [x,,z]=p.pos||[0,0,0]; const [w,,d]=p.size||[5,0,5];
    const i = (count[o.place]=(count[o.place]||0)+1)-1;
    const indoors = ['indoor','shop','civic'].includes(p.kind);
    let ox, oz;
    if (Array.isArray(o.at)){
      // A thing that belongs somewhere: an offset from the middle of the room,
      // and optionally which way it looks. Everything else still finds its own
      // spot round the edge, which is right for whatever he drops or is sent.
      ox = x + o.at[0]; oz = z + o.at[1];
    } else if (indoors){
      // walk the perimeter, a little in from the walls, then spiral inward if crowded
      const iw = w - 2.4, idp = d - 2.4;
      const per = 2*(iw + idp), lap = Math.floor(i / 40), step = (i % 40) * (per/40);
      const inset = 0.5 + lap*0.9;
      let t = step;
      if (t < iw)                 { ox = x - iw/2 + t;            oz = z - idp/2 + inset; }
      else if (t < iw + idp)      { ox = x + iw/2 - inset;        oz = z - idp/2 + (t-iw); }
      else if (t < 2*iw + idp)    { ox = x + iw/2 - (t-iw-idp);   oz = z + idp/2 - inset; }
      else                        { ox = x - iw/2 + inset;        oz = z + idp/2 - (t-2*iw-idp); }
    } else {
      const ring = Math.floor(i/8), a = (i%8)*(Math.PI/4) + ring*.4;
      const r = Math.min(.9 + ring*1.0, Math.min(w,d)/2 - .6);
      ox = x+Math.cos(a)*r; oz = z+Math.sin(a)*r;
    }
    /* An earth or street place lays a pad 0.2 thick over the land, and a
       flagged one lays slabs on top of that. Everything used to be dropped at
       land height, so it stood a third of a unit inside its own floor: benches
       half sunk, a planted bed with only the flowers showing. */
    const padTop = (p.kind === 'earth' || p.kind === 'street')
                 ? (p.paving === 'flag' ? 0.30 : 0.20) : 0.02;
    const mine = o.made_by==='otto', gift = o.from==='caleb';
    const cond = o.condition===undefined?1:o.condition;
    const rig = buildRig((o.shape||'').toLowerCase());
    if (rig){
      if ((o.shape||'') === 'glass'){      // hangs flat on the nearest wall, facing in
        const dxw = (w/2 - 0.9) - Math.abs(ox - x), dzw = (d/2 - 0.9) - Math.abs(oz - z);
        if (dxw < dzw){ const sgn = ox > x ? 1 : -1;
          ox = x + sgn*(w/2 - 0.55); rig.rotation.y = -sgn*Math.PI/2; }
        else { const sgn = oz > z ? 1 : -1;
          oz = z + sgn*(d/2 - 0.55); rig.rotation.y = sgn > 0 ? Math.PI : 0; }
        rig.position.set(ox, landHeight(ox,oz)+0.02, oz);
      } else {
        rig.position.set(ox, landHeight(ox,oz)+padTop, oz);
        rig.rotation.y = (o.face !== undefined) ? o.face : 1.2;
      }
      if (o.solid){                     // you cannot walk through a locomotive
        rig.updateMatrixWorld(true);
        const bb = new THREE.Box3().setFromObject(rig);
        BLOCKS.push({x:(bb.min.x+bb.max.x)/2, z:(bb.min.z+bb.max.z)/2,
                     hx:(bb.max.x-bb.min.x)/2, hz:(bb.max.z-bb.min.z)/2});
      }
      rig.userData = {name:o.name, note:o.note||'', id:o.id};
      rig.traverse(c => { if (c.isMesh){ c.userData = rig.userData; pickable.push(c); } });
      worldGroup.add(rig);
      continue;
    }
    const m = new THREE.Mesh(geomForObj(o), new THREE.MeshStandardMaterial({
      color: tint(mine?PAL.made : gift?PAL.gift : 0xb0a593, o.colour),
      roughness:.85, emissive: mine?0x3c2708 : gift?0x0e2d38 : 0x000000}));
    m.rotation.y = (o.face !== undefined) ? o.face : (i*1.1)%Math.PI;
    if (cond<.75) m.rotation.z=(1-cond)*.8;
    // sit it on the surface: work out how far its lowest point is below its origin
    m.updateMatrixWorld(true);
    m.geometry.computeBoundingBox();
    const bb = m.geometry.boundingBox.clone().applyMatrix4(
      new THREE.Matrix4().makeRotationFromEuler(m.rotation));
    const drop = -bb.min.y;
    const surf = indoors ? landHeight(x,z) + 0.21 : landHeight(ox,oz) + padTop;
    m.position.set(ox, surf + drop, oz);
    m.castShadow = true;
    m.userData = {name:o.name, note:(o.note||'')+(cond<1?`  · condition ${cond}`:''), id:o.id};
    worldGroup.add(m); pickable.push(m);
  }
}

function plantTrees(world){
  const occupied = Object.values(world.places).filter(p=>p.pos&&p.size);
  const clear = (x,z,pad=3.5) => !occupied.some(p=>{
    const [px,,pz]=p.pos,[pw,,pd]=p.size;
    return Math.abs(x-px) < pw/2+pad && Math.abs(z-pz) < pd/2+pad; });

  const orch = world.places.orchard;
  if (orch){                       // the four pear trees, in a row as described
    const [ox,,oz] = orch.pos;
    for (let i=0;i<4;i++) worldGroup.add(makeTree(ox - 4.5 + i*3.2, oz + (i%2?.8:-.8), 'pear'));
  }
  for (const wv of WATERS_FOR_TREES){        // alder down the water, which is where it grows
    const along = wv.d > wv.w, span = along ? wv.d : wv.w, wide = along ? wv.w : wv.d;
    const n = Math.max(2, Math.round(span / 11));
    for (let i=0;i<n;i++){
      for (const sgn of [-1,1]){
        const t = -span/2 + (i + .5 + (sgn>0?.35:0)) * (span/n);
        const off = sgn * (wide/2 + 2.4 + Math.random()*1.6);
        const tx = along ? wv.x + off : wv.x + t;
        const tz = along ? wv.z + t  : wv.z + off;
        if (landHeight(tx,tz) < -0.25) continue;
        // a tree does not grow through a path. this loop used to skip the
        // check the scattered trees do, which put every one of them on the
        // river walk the moment the walk was laid along the water.
        if (!clear(tx, tz, 1.2)) continue;
        worldGroup.add(makeTree(tx, tz, 'willow'));
      }
    }
  }
  let placed = 0;                  // scattered trees round the edges
  for (let i=0; i<400 && placed<26; i++){
    const a = (i*2.399), r = 24 + (i%7)*7.5;
    const x = Math.cos(a)*r + Math.sin(i)*5, z = Math.sin(a)*r + Math.cos(i*1.7)*5;
    if (Math.abs(x)>92 || Math.abs(z)>92) continue;
    if (!clear(x,z)) continue;
    if (landHeight(x,z) < -0.15) continue;      // not in the water
    worldGroup.add(makeTree(x, z)); placed++;
  }
}

function pose(mode, now, dt, gait){
  const b = anim.blend, M = anim.model;
  if (!M || anim.mixer) return;              // a rigged model does its own thing
  const t = now * 0.001;
  let pitch = 0, roll = 0, sink = 0, squash = 0, lift = 0;

  if (mode === 'sleep'){
    // nose down, back rounded up, pulled into himself, feet tucked out of sight
    pitch  = 0.30;
    sink   = 0.34;                            // this is the 'cut the feet off' trick
    squash = -0.16;
    lift   = Math.sin(t * 0.55) * 0.012;      // slow breathing
    roll   = 0.06;
  } else if (mode === 'swim'){
    pitch  = -0.17;                               // nose up, out of the water
    roll   = Math.sin(t * 2.6) * 0.09;            // rolling with the paddle
    lift   = Math.sin(t * 3.1) * 0.035;
    squash = 0.04;
  } else if (mode === 'walk'){
    const step = gait || 0;                       // paced by ground covered, not the clock
    lift   = Math.abs(Math.sin(step)) * 0.075;    // the bob of a short-legged animal
    roll   = Math.sin(step) * 0.10;               // waddle
    pitch  = -0.05 + Math.sin(step * 2) * 0.03;   // nose up a little, bouncing
    squash = Math.abs(Math.cos(step)) * 0.035;
  } else {                                        // idle: breathing and the odd twitch
    lift   = Math.sin(t * 1.4) * 0.018;
    squash = Math.sin(t * 1.4) * 0.022;
    pitch  = Math.sin(t * 0.7) * 0.015;
    const snif = (t % 6.5);                       // a nose twitch every few seconds
    if (snif < 0.5) pitch += Math.sin(snif * 38) * 0.05;
  }

  const k = Math.min(1, dt * 6);                  // ease between poses
  b.pitch  += (pitch  - b.pitch)  * k;
  b.roll   += (roll   - b.roll)   * k;
  b.sink   += (sink   - b.sink)   * k;
  b.squash += (squash - b.squash) * k;
  b.lift   += (lift   - b.lift)   * k;

  M.rotation.x = b.pitch;
  M.rotation.z = b.roll;
  M.position.y = -b.sink + b.lift;
  M.scale.set(1 + b.squash * 0.5, 1 - b.squash, 1 + b.squash * 0.5);
}

  next.reset().setLoop(THREE.LoopRepeat).fadeIn(0.35).play();

function route(world, from, to){           // shortest way through the exits
  if (!from || from===to) return [to];
  const seen={[from]:null}, q=[from];
  while(q.length){
    const c=q.shift();
    if (c===to) break;
    for (const e of (world.places[c]?.exits||[])) if (!(e in seen)){ seen[e]=c; q.push(e); }
  }
  if (!(to in seen)) return [to];
  const path=[]; let c=to; while(c){ path.unshift(c); c=seen[c]; } return path;
}

   trail() turns that list of places into a line on the ground: a grid built
   from the same BLOCKS the camera collides with, A* across it, then the corners
   pulled straight again. Cobbles cost less than grass, so he keeps to the lane
   the way anyone would rather than cutting over the green. */
const NAV = {cell:0.7, x0:0, z0:0, w:0, h:0, cost:null, ready:false};

function buildNav(){
  window.__dbg.nav = {NAV, astar:(ax,az,bx,bz)=>astar(ax,az,bx,bz), trail:(w,ids,x,z)=>trail(w,ids,x,z), route:(w,f,t)=>route(w,f,t)};
  const ps = Object.values(WORLD?.places||{}).filter(p=>p.pos && p.size);
  if (!ps.length){ NAV.ready = false; return; }
  let x0=1e9, x1=-1e9, z0=1e9, z1=-1e9;
  for (const p of ps){
    x0 = Math.min(x0, p.pos[0]-p.size[0]/2); x1 = Math.max(x1, p.pos[0]+p.size[0]/2);
    z0 = Math.min(z0, p.pos[2]-p.size[2]/2); z1 = Math.max(z1, p.pos[2]+p.size[2]/2);
  }
  const M = 14;                                   // room to walk round the outside
  NAV.x0 = x0-M; NAV.z0 = z0-M;
  NAV.w = Math.ceil((x1-x0+M*2)/NAV.cell);
  NAV.h = Math.ceil((z1-z0+M*2)/NAV.cell);
  const cost = new Float32Array(NAV.w*NAV.h).fill(1);

  // a surface worth walking on costs less to cross
  for (const p of ps){
    const c = p.kind === 'street' ? 0.42
            : (p.kind === 'earth' || p.kind === 'indoor' || p.kind === 'shop'
               || p.kind === 'civic') ? 0.8
            : p.kind === 'water' ? 6 : 1;
    if (c === 1) continue;
    const [ax,ai] = [p.pos[0]-p.size[0]/2, p.pos[0]+p.size[0]/2];
    const [az,aj] = [p.pos[2]-p.size[2]/2, p.pos[2]+p.size[2]/2];
    for (let j=Math.floor((az-NAV.z0)/NAV.cell); j<=Math.ceil((aj-NAV.z0)/NAV.cell); j++)
      for (let i=Math.floor((ax-NAV.x0)/NAV.cell); i<=Math.ceil((ai-NAV.x0)/NAV.cell); i++)
        if (i>=0 && j>=0 && i<NAV.w && j<NAV.h) cost[j*NAV.w+i] = Math.min(cost[j*NAV.w+i], c);

  // walls are walls. pad them by his width so he does not scrape along them.
  const PAD = 0.55;
  for (const b of BLOCKS){
    for (let j=Math.floor((b.z-b.hz-PAD-NAV.z0)/NAV.cell); j<=Math.ceil((b.z+b.hz+PAD-NAV.z0)/NAV.cell); j++)
      for (let i=Math.floor((b.x-b.hx-PAD-NAV.x0)/NAV.cell); i<=Math.ceil((b.x+b.hx+PAD-NAV.x0)/NAV.cell); i++)
        if (i>=0 && j>=0 && i<NAV.w && j<NAV.h) cost[j*NAV.w+i] = Infinity;
  }
  NAV.cost = cost; NAV.ready = true;
}

const navIX = x => Math.round((x-NAV.x0)/NAV.cell);
const navIZ = z => Math.round((z-NAV.z0)/NAV.cell);
const navX  = i => NAV.x0 + i*NAV.cell;
const navZ  = j => NAV.z0 + j*NAV.cell;
const navOpen = (i,j) => i>=0 && j>=0 && i<NAV.w && j<NAV.h && NAV.cost[j*NAV.w+i] !== Infinity;

// a door has to be reachable even though it sits in a wall
function nearestOpen(i, j){
  if (navOpen(i,j)) return [i,j];
  for (let r=1; r<=14; r++)
    for (let dj=-r; dj<=r; dj++)
      for (let di=-r; di<=r; di++){
        if (Math.max(Math.abs(di),Math.abs(dj)) !== r) continue;
        if (navOpen(i+di,j+dj)) return [i+di,j+dj];
      }
  return null;
}

function astar(ax, az, bx, bz){
  if (!NAV.ready) return null;
  const a = nearestOpen(navIX(ax), navIZ(az));
  const b = nearestOpen(navIX(bx), navIZ(bz));
  if (!a || !b) return null;
  const W=NAV.w, H=NAV.h, N=W*H;
  const si=a[1]*W+a[0], gi=b[1]*W+b[0];
  if (si === gi) return [[ax,az],[bx,bz]];
  const g = new Float32Array(N).fill(Infinity);
  const prev = new Int32Array(N).fill(-1);
  const seen = new Uint8Array(N);
  const h = k => Math.hypot((k%W)-b[0], Math.floor(k/W)-b[1]);
  const open = [[h(si), si]];                      // small worlds, a sorted array is plenty
  g[si] = 0;
  let found = false, guard = 0;
  while (open.length && guard++ < 260000){
    open.sort((p,q)=>p[0]-q[0]);
    const [,cur] = open.shift();
    if (seen[cur]) continue;
    seen[cur] = 1;
    if (cur === gi){ found = true; break; }
    const ci = cur%W, cj = Math.floor(cur/W);
    for (let dj=-1; dj<=1; dj++) for (let di=-1; di<=1; di++){
      if (!di && !dj) continue;
      const ni = ci+di, nj = cj+dj;
      if (!navOpen(ni,nj)) continue;
      if (di && dj && (!navOpen(ci+di,cj) || !navOpen(ci,cj+dj))) continue;  // no corner cutting
      const k = nj*W+ni;
      const step = (di&&dj ? 1.4142 : 1) * NAV.cost[k];
      if (g[cur]+step < g[k]){ g[k] = g[cur]+step; prev[k] = cur; open.push([g[k]+h(k), k]); }
    }
  }
  if (!found) return null;
  const pts = [];
  for (let k=gi; k!==-1; k=prev[k]) pts.push([navX(k%W), navZ(Math.floor(k/W))]);
  pts.reverse();
  pts[0] = [ax,az]; pts[pts.length-1] = [bx,bz];
  return smooth(pts);
}

// pull the staircase straight: keep a corner only where the line would clip a wall
function clear(ax, az, bx, bz){
  const n = Math.ceil(Math.hypot(bx-ax, bz-az) / (NAV.cell*0.5));
  for (let i=0;i<=n;i++){
    const t=i/n;
    if (!navOpen(navIX(ax+(bx-ax)*t), navIZ(az+(bz-az)*t))) return false;
  }
  return true;
}
function smooth(pts){
  const out = [pts[0]];
  let i = 0;
  while (i < pts.length-1){
    let j = pts.length-1;
    while (j > i+1 && !clear(pts[i][0],pts[i][1],pts[j][0],pts[j][1])) j--;
    out.push(pts[j]); i = j;
  }
  return out;
}

/* ---------- the tracks he has worn ----------
   Every route between two connected places, worked out by the same A* he walks,
   then dyed into the land's own vertex colours. Not a mesh laid on the grass:
   part of the ground, so it takes the dither and never z-fights. This is what
   turns buildings-on-a-lawn into somewhere people go. */
let TRACKS = [];
function buildTracks(){
  TRACKS = [];
  if (!NAV.ready || !WORLD) return;
  const done = new Set();
  for (const [a, va] of Object.entries(WORLD.places)){
    for (const b of (va.exits || [])){
      if (!WORLD.places[b]) continue;
      const key = a < b ? a+'|'+b : b+'|'+a;
      if (done.has(key)) continue;
      done.add(key);
      const A = posOf(WORLD, a), B = posOf(WORLD, b);
      const pts = astar(A.x, A.z, B.x, B.z);
      if (!pts) continue;
      for (let i=1;i<pts.length;i++)
        TRACKS.push([pts[i-1][0], pts[i-1][1], pts[i][0], pts[i][1]]);
    }
  }
}
function paintTracks(){
  if (!TRACKS.length || !NAV.ready) return;
  const pos = landGeo.attributes.position, col = landGeo.attributes.color;
  if (!col) return;
  // the dither quantises the ground into a handful of steps, so a subtle shift
  // simply vanishes. A track has to be a clear step lighter and plainly drier
  // than the grass beside it or it will not survive the pass at all.
  const worn = new THREE.Color(0xa8986f), edge = new THREE.Color(0x8a7d5a);
  const c = new THREE.Color();
  const X0 = NAV.x0 - 8, X1 = NAV.x0 + NAV.w*NAV.cell + 8;
  const Z0 = NAV.z0 - 8, Z1 = NAV.z0 + NAV.h*NAV.cell + 8;
  for (let i=0;i<pos.count;i++){
    const x = pos.getX(i), z = -pos.getY(i);
    if (x < X0 || x > X1 || z < Z0 || z > Z1) continue;
    let best = 1e9;
    for (let t=0;t<TRACKS.length;t++){
      const s0 = TRACKS[t];
      const dx = s0[2]-s0[0], dz = s0[3]-s0[1];
      const L = dx*dx + dz*dz || 1;
      let u = ((x-s0[0])*dx + (z-s0[1])*dz) / L;
      u = u < 0 ? 0 : u > 1 ? 1 : u;
      const ex = s0[0] + dx*u - x, ez = s0[1] + dz*u - z;
      const dd = ex*ex + ez*ez;
      if (dd < best) best = dd;
    }
    const d = Math.sqrt(best);
    if (d > 2.2) continue;
    const k = (1 - smoothstep(0.7, 2.2, d)) * 0.92;
    c.fromBufferAttribute(col, i);
    c.lerp(d < 1.0 ? worn : edge, k);
    col.setXYZ(i, c.r, c.g, c.b);
  }
  col.needsUpdate = true;
}

// the whole journey, as points on the ground
function trail(world, ids, fromX, fromZ){
  const pts = [];
  let cx = fromX, cz = fromZ;
  for (const id of ids){
    const t = posOf(world, id);
    const leg = astar(cx, cz, t.x, t.z);
    if (leg){ for (let i=1;i<leg.length;i++) pts.push(leg[i]); }
    else pts.push([t.x, t.z]);                  // no way round: go as he used to
    cx = t.x; cz = t.z;
  }
  const out = [new THREE.Vector3(fromX, 0, fromZ)];
  for (const [x,z] of pts){
    const v = new THREE.Vector3(x, landHeight(x,z)+.42, z);
    if (v.distanceTo(out[out.length-1]) > 0.05) out.push(v);
  }
  return out;
}

function posOf(world, id){
  const p=world.places[id]; const [x,,z]=p?.pos||[0,0,0];
  return new THREE.Vector3(x, landHeight(x,z+1.2)+.42, z+1.2);
}

/* ---------- hud ---------- */
const NEEDC={energy:'#7fb77e',fullness:'#e0a458',warmth:'#d9735a',calm:'#6b9bd1',wonder:'#b07fc7'};
const EL = id => document.getElementById(id);
const COUNTS = {text:''};   // shown in the 'into' panel, not crammed into the bar
function hud(world,state){
  EL('placename').textContent = world.places[state.location]?.name || state.location;
  EL('clock').textContent = state.clock.slice(11,16);
  EL('tickno').textContent = state.tick;
  EL('mood').textContent = state.asleep?'asleep':(state.mood||'awake');
  EL('wx').textContent = state.weather || '';
  EL('needs').innerHTML = Object.entries(state.needs).map(([k,v])=>`
    <span class="nd" title="${k} ${(v*100).toFixed(0)}"><span class="nm">${k.slice(0,4)}</span>
    <span class="bar2"><span class="fill" style="width:${(v*100).toFixed(0)}%;
      background:${NEEDC[k]||'#888'}"></span></span></span>`).join('');
  const made=world.objects.filter(o=>o.made_by==='otto').length;
  const gifts=world.objects.filter(o=>o.from==='caleb').length;
  COUNTS.text = `${Object.keys(world.places).length} places · ${world.objects.length} things · `
    + `${made} he made` + (gifts?` · ${gifts} from you`:'');
  barDoing(state);
}

/* the middle of the bar: the one line that says what he is doing */
function barDoing(state){
  const d = state && state.doing;
  const line = state && state.asleep ? 'asleep'
    : (d && d.verb && d.verb !== 'idle')
      ? d.verb + (d.what ? ' <b>' + esc(d.what) + '</b>' : '')
      : 'pottering about';
  // trimmed to a clause, because the bar is one line and a cut-off sentence
  // reads worse than a short one. the whole thought is in the thinking panel.
  let w = (d && d.why || '').trim();
  if (w.length > 76) w = w.slice(0, 75).replace(/\s+\S*$/, '') + '…';
  const why = w ? ` <span class="why-in">· ${esc(w)}</span>` : '';
  const el = EL('doingline');
  el.innerHTML = 'otto is ' + line + why;
  el.classList.toggle('dim', !(d && d.verb && d.verb !== 'idle'));
  showBecause(state);
}

/* ---------- his wake, when he is in the water ---------- */
let wake = null, ripples = [];
function updateWake(on, now, dt){
  if (!otto) return;
  if (on && !wake){
    wake = new THREE.Group();
    const ring = new THREE.Mesh(new THREE.RingGeometry(.42,.66,26),
      new THREE.MeshBasicMaterial({color:0xcfe4ee, transparent:true, opacity:.3,
                                   side:THREE.DoubleSide, depthWrite:false}));
    ring.rotation.x = -Math.PI/2; wake.add(ring);
    for (let i=0;i<3;i++){
      const r = new THREE.Mesh(new THREE.RingGeometry(.5,.58,26),
        new THREE.MeshBasicMaterial({color:0xe2f0f6, transparent:true, opacity:.22,
                                     side:THREE.DoubleSide, depthWrite:false}));
      r.rotation.x = -Math.PI/2; r.userData = {phase: i/3};
      wake.add(r); ripples.push(r);
    }
    scene.add(wake);
  } else if (!on && wake){
    scene.remove(wake); wake = null; ripples = [];
  }
  if (!wake) return;
  wake.position.set(otto.position.x, WATER_Y + .02, otto.position.z);
  for (const r of ripples){
    r.userData.phase = (r.userData.phase + dt*.42) % 1;
    const k = r.userData.phase;
    r.scale.setScalar(1 + k*3.4);
    r.material.opacity = .26 * (1 - k);
  }
}

/* ---------- what he is doing, made visible ---------- */
let props = null, propVerb = null;
function showDoing(doing){
  const verb = doing?.verb || 'idle';
  if (verb === propVerb) return;
  propVerb = verb;
  if (props){ otto.remove(props); props = null; }
  if (verb === 'idle' || verb === 'sleeping' || verb === 'looking') return;

  props = new THREE.Group();
  const put = (geo, col, x, y, z, rx=0, ry=0, rz=0) => {
    const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({color:col, roughness:.85}));
    m.position.set(x,y,z); m.rotation.set(rx,ry,rz); m.castShadow = true; props.add(m);
  };
  if (verb === 'reading'){                       // an open book on the floor in front of him
    for (const sgn of [-1,1])
      put(new THREE.BoxGeometry(.34,.035,.46), 0xf0e6d2, sgn*.18, .03, .62, sgn*0.10, 0, 0);
    put(new THREE.BoxGeometry(.06,.05,.47), 0x6b4a2f, 0, .015, .62);
  } else if (verb === 'using'){                  // something he is eating or handling
    put(new THREE.SphereGeometry(.17,10,8), 0xb8812f, 0, .17, .6);
    put(new THREE.CylinderGeometry(.015,.015,.1,5), 0x4a3b22, 0, .33, .6);
  } else if (verb === 'writing'){                // paper and a pencil
    put(new THREE.BoxGeometry(.5,.02,.62), 0xf4efe2, 0, .02, .62);
    put(new THREE.CylinderGeometry(.022,.022,.45,6), 0xd8a53c, .22, .06, .6, 0, 0, Math.PI/2.2);
  } else if (verb === 'making'){                 // tools and offcuts
    put(new THREE.BoxGeometry(.6,.06,.12), 0x9a7b4a, -.1, .04, .6, 0, .3, 0);
    put(new THREE.BoxGeometry(.5,.05,.1), 0x8a6b3a, .14, .04, .66, 0, -.5, 0);
    put(new THREE.CylinderGeometry(.03,.03,.38,6), 0x55504a, 0, .07, .78, Math.PI/2, 0, .4);
  } else if (verb === 'testing'){                // a little stack of coin weights
    for (let i=0;i<4;i++)
      put(new THREE.CylinderGeometry(.09,.09,.035,10), 0xc9a74e, .05*i-.07, .02+i*.038, .6);
  } else if (verb === 'carrying'){
    put(new THREE.BoxGeometry(.3,.26,.24), 0xa08357, 0, .18, .55);
  }
  otto.add(props);
}

/* ---------- z: what is he up to ---------- */
/* ---------- the panel: everything he is, over the running world ---------- */
/* ?mock=NAME renders mock/NAME.json instead of his real world, so a building
   can be looked at and argued about before it is ever put into his village.
   Without the parameter nothing here does anything at all. */
const MOCK = new URLSearchParams(location.search).get('mock');
const SRC = MOCK
  ? {world: `mock/${MOCK}.json`, state: `mock/${MOCK}-state.json`}
  : {world: 'world.json', state: 'state.json'};
if (MOCK) document.title = 'mockup: ' + MOCK;

const esc = t => String(t==null?'':t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

// your key, from ?key=... the first time, remembered after that
const KEY = (() => {
  const u = new URLSearchParams(location.search).get('key');
  try { if (u){ localStorage.setItem('ottokey', u);
                history.replaceState({}, '', location.pathname); }
        return u || localStorage.getItem('ottokey') || ''; }
  catch(e){ return u || ''; }
})();

let FEED = null, feedAt = 0, panelView = null, feedTimer = null, lastThought = -1;

const TITLES = {say:'say something', journal:'his journal', knows:'what he knows',
                wants:'what he wants', made:'what he has made',
                thinking:'what he is thinking', into:"what he is into", now:'this tick'};

async function loadFeed(force){
  if (MOCK) return null;                     // a mockup has no life to show
  if (!force && Date.now() - feedAt < 7000) return FEED;
  try { FEED = await (await fetch('/api/feed?'+Date.now())).json(); feedAt = Date.now(); }
  catch(e){ /* keep whatever we had */ }
  if (FEED){
    if (KEY || !FEED.readonly) EL('rb-now').style.display = '';
    EL('livedot').className = FEED.live ? 'on' : '';
    pushThoughts(FEED);
  }
  return FEED;
}

function openPanel(view){
  panelView = view;
  EL('panel').classList.add('on');
  EL('scrim').classList.add('on');
  EL('ptitle').textContent = TITLES[view] || view;
  document.querySelectorAll('.rb').forEach(b =>
    b.classList.toggle('on', b.dataset.v === view || (view==='say' && b.id==='rb-say')));
  paintPanel();
  loadFeed(true).then(paintPanel);
}
function closePanel(){
  panelView = null;
  EL('panel').classList.remove('on');
  EL('scrim').classList.remove('on');
  document.querySelectorAll('.rb').forEach(b => b.classList.remove('on'));
}
const panelOpen = () => panelView !== null;
function togglePanel(view){ panelView === view ? closePanel() : openPanel(view); }

function paintPanel(){
  if (!panelView) return;
  const b = EL('pbody');
  if (!FEED){ b.innerHTML = '<div class="empty">cannot reach him from here.</div>'; return; }
  b.innerHTML = (VIEWS[panelView] || (()=>'<div class="empty">nothing here.</div>'))(FEED);
  if (panelView === 'say') b.scrollTop = b.scrollHeight;
}

const none = t => `<div class="empty">${t}</div>`;

const VIEWS = {
  say(d){
    const thread = [...(d.from_otto||[]).map(m=>({...m,who:'otto'})),
                    ...(d.to_otto||[]).map(m=>({...m,who:'me'}))]
      .sort((a,b)=>String(a.t||'').localeCompare(String(b.t||'')));
    const locked = d.readonly && !KEY;
    return (thread.length ? thread.map(m =>
        `<div class="msg ${m.who==='otto'?'from-otto':'from-me'}">`
      + `<div class="who">${m.who==='otto'?'otto':'you'} · `
      + `${esc(String(m.t||'').slice(5,16).replace('T',' '))}</div>`
      + esc((m.text||'').trim()) + `</div>`).join('')
      : none('nothing said yet.'))
    + (locked ? '<div class="hint">you are watching. only caleb can send him things.</div>'
      : `<div class="composer">
           <textarea id="say" rows="2" placeholder="tell him something, or answer one of his questions"></textarea>
           <button class="pbtn" id="send">send</button>
         </div>
         <div class="composer">
           <input type="text" id="gift" placeholder="post him a thing: a small saw, a book about rivers">
           <button class="pbtn ghost" id="post">post it</button>
         </div>
         <div class="hint">he reads these next time he wakes. he may well ignore them.</div>`);
  },
  journal: d => (d.journal||[]).length ? d.journal.map(e => {
      const t = (e.text||'').trim();
      const m = t.match(/^([\s\S]*?)\n*_because:\s*([\s\S]*?)_\s*$/);
      return `<div class="entry"><div class="when">${esc(e.when)}</div>`
        + `<div class="body">${esc((m ? m[1] : t).trim())}</div>`
        + (m ? `<div class="wsrc">${esc(m[2].trim())}</div>` : '') + `</div>`;
    }).join('') : none('he has not written anything yet.'),

  // every fact he has carries how he came by it. that is the point of him.
  knows: d => (d.knows||[]).length ? d.knows.map(k => {
      const m = k.match(/^(.*?)\s*\[(.+)\]\s*$/);
      return `<div class="know">${esc(m?m[1]:k)}`
           + (m ? `<div class="src">${esc(m[2])}</div>` : '') + `</div>`;
    }).join('') : none('he knows nothing yet.'),

  wants: d => (d.wishes||[]).length ? (d.wishes||[]).map(x =>
      `<div class="wish ${x.done?'done':''}"><div class="wdot"></div><div>`
    + `<div class="what">${esc(x.want)}</div>`
    + (x.why?`<div class="why">${esc(x.why)}</div>`:'') + `</div></div>`).join('')
    : none('he does not want anything yet.'),

  made: d => (d.pages||[]).length
    ? (d.pages||[]).map(pg => `<a class="pill" href="/${pg}" target="_blank">${esc(pg)}</a>`).join('')
    : none('he has not made any pages yet.'),

  thinking: d => (d.thoughts||[]).length ? d.thoughts.map(t =>
      `<div class="entry"><div class="when">tick ${t.tick}</div>`
    + `<div class="body">${esc((t.text||'').trim())}</div></div>`).join('')
    : none('nothing here yet.'),

  into(d){
    const i = d.interests||{};
    const grp = (t, inner) => inner ? `<div class="grp"><div class="grph">${t}</div>${inner}</div>` : '';
    const pills = a => (a||[]).map(x=>`<span class="pill">${esc(String(x))}</span>`).join('');
    return grp('his world', COUNTS.text ? `<span class="pill">${esc(COUNTS.text)}</span>` : '')
      + grp('what has hold of him', (i.chasing||[]).map(c=>`<div class="big">${esc(c)}</div>`).join(''))
      + grp('what he has gone looking for', pills(i.searches))
      + grp('what he is reading', (i.books||[]).map(([b,n])=>
            `<span class="pill">${esc(b)} · ${n} sittings</span>`).join(''))
      + grp('what he keeps testing', (i.tested||[]).map(([t,n])=>
            `<span class="pill">${esc(t)} × ${n}</span>`).join(''))
      + grp('what he has built', pills(i.built))
      + grp('where his knowledge came from', Object.entries(i.sources||{}).map(([k,v])=>
            `<span class="pill">${esc(k)} · ${v}</span>`).join(''))
      || none('nothing yet. he has not lived.');
  },

  now(d){
    const LOUD = new Set(['write_site','learn','wish','journal','message','test','edit_world']);
    const a = d.activity||[];
    return (d.live ? '<div class="hint" style="margin:0 0 10px">running now</div>' : '')
      + (a.length ? a.map(t =>
        `<div class="tk"><div class="tkh"><b>tick ${t.tick}</b><span>${esc(t.clock)}</span>`
      + `<span>${esc(t.mood)}</span></div>`
      + (t.calls.length ? t.calls.map(c => {
          const cls = c.name==='write_site'||c.name==='edit_world' ? 'make'
                    : c.name==='learn'||c.name==='wish' ? 'learn'
                    : /fail|wrong|not here|cannot/i.test(c.result||'') ? 'fail' : '';
          const arg = Object.values(c.input||{}).filter(v=>typeof v!=='object')
                        .map(v=>String(v)).join(' · ').slice(0,120);
          return `<div class="act"><span class="an ${cls}">${esc(c.name)}</span><span>`
               + `<span>${esc(arg)}</span>`
               + (LOUD.has(c.name)||cls==='fail' ? `<div class="ar">${esc(c.result)}</div>` : '')
               + `</span></div>`;
        }).join('') : '<div class="ar">nothing. he slept.</div>')
      + `</div>`).join('') : none('he has not done anything yet.'));
  },
};

/* ---------- a thought drifts up, then goes ---------- */
function pushThoughts(d){
  const t = (d.thoughts||[])[0];
  if (!t || t.tick === lastThought) return;
  const first = lastThought === -1;
  lastThought = t.tick;
  if (first) return;                       // do not dump a backlog on arrival
  const el = document.createElement('div');
  el.className = 'th';
  el.textContent = (t.text||'').trim().slice(0, 180);
  EL('ticker').appendChild(el);
  requestAnimationFrame(()=>el.classList.add('in'));
  setTimeout(()=>{ el.classList.remove('in');
                   setTimeout(()=>el.remove(), 700); }, 14000);
  while (EL('ticker').children.length > 3) EL('ticker').firstChild.remove();
}

/* who set him off. only while it is still recent: a note from three days ago
   explains nothing about what he is doing now. */
let becauseAt = null;
function showBecause(state){
  const el = EL('because');
  const b = state && state.because_of;
  if (!b || !b.text){ el.classList.remove('on'); return; }
  const mins = (Date.parse(state.clock) - Date.parse(b.at)) / 60000;
  if (!(mins >= 0) || mins > 180){ el.classList.remove('on'); return; }
  const when = mins < 2 ? 'just now'
             : mins < 60 ? Math.round(mins) + ' min ago'
             : Math.round(mins/60) + (mins < 120 ? ' hour ago' : ' hours ago');
  if (becauseAt !== b.at){
    becauseAt = b.at;
    el.innerHTML = `<span class="w">he read your note</span> · ${esc(when)}<br>`
                 + `&ldquo;${esc(b.text)}&rdquo;`;
  }
  el.classList.add('on');
}

let hintTimer = null;
function flashHint(){
  const mh = EL('modehint');
  mh.classList.add('show');
  clearTimeout(hintTimer);
  hintTimer = setTimeout(()=>mh.classList.remove('show'), 5000);
}

/* ---------- wiring ---------- */
EL('rb-say').onclick = () => togglePanel('say');
document.querySelectorAll('.rb[data-v]').forEach(b =>
  b.onclick = () => togglePanel(b.dataset.v));
EL('pclose').onclick = closePanel;

EL('pbody').addEventListener('click', async e => {
  const send = e.target.closest('#send'), post = e.target.closest('#post');
  if (send){
    const t = EL('say').value.trim(); if (!t) return;
    EL('say').value = '';
    await postTo('/api/say', {text:t}, send);
  } else if (post){
    const n = EL('gift').value.trim(); if (!n) return;
    EL('gift').value = '';
    await postTo('/api/parcel', {name:n}, post);
  }
});
EL('pbody').addEventListener('keydown', e => {
  if (e.target.id === 'say' && (e.metaKey||e.ctrlKey) && e.key === 'Enter') EL('send').click();
});
async function postTo(url, body, btn){
  btn.disabled = true;
  try{
    const r = await fetch(url, {method:'POST',
      headers:{'Content-Type':'application/json','X-Otto-Key':KEY},
      body: JSON.stringify(body)});
    const j = await r.json().catch(()=>({}));
    if (j && j.ok === false && j.error) alert(j.error);
    await loadFeed(true); paintPanel();
  } finally { btn.disabled = false; }
}

// the feed drives the ticker and the panel whether or not anything is open
function feedLoop(){
  clearInterval(feedTimer);
  const ms = (FEED && FEED.live) ? 4000 : 12000;
  feedTimer = setInterval(async () => {
    await loadFeed(true);
    if (panelOpen()) paintPanel();
    feedLoop();
  }, ms);
}
loadFeed(true).then(()=>{ feedLoop(); flashHint(); });

/* ---------- hover ---------- */
const ray=new THREE.Raycaster(), mouse=new THREE.Vector2(), tip=document.getElementById('tip');
renderer.domElement.addEventListener('pointerdown', e => {
  if (you.on) return;
  mouse.x=(e.clientX/innerWidth)*2-1; mouse.y=-(e.clientY/innerHeight)*2+1;
  ray.setFromCamera(mouse,camera);
  if (otto && ray.intersectObject(otto, true).length) togglePanel('thinking');
});
addEventListener('pointermove',e=>{
  if (you.on) return;
  mouse.x=(e.clientX/innerWidth)*2-1; mouse.y=-(e.clientY/innerHeight)*2+1;
  ray.setFromCamera(mouse,camera);
  const hit=ray.intersectObjects(pickable,false)[0];
  if(hit?.object.userData.name){
    const u=hit.object.userData;
    tip.innerHTML=`<b>${u.name}</b>${u.note?'<br>'+u.note:''}`;
    tip.style.left=Math.min(e.clientX+14,innerWidth-270)+'px';
    tip.style.top=(e.clientY+14)+'px'; tip.style.opacity=1;
  } else tip.style.opacity=0;
});

/* ---------- load ---------- */
let WORLD=null, STATE=null;
/* Rebuilding the world is expensive: three thousand meshes, the land reshaped
   vertex by vertex, an A* run for every pair of connected places, and the
   tracks dyed into the ground. That used to happen every fifteen seconds, which
   is why walking stuttered: the whole village was being demolished and rebuilt
   under your feet while you walked through it.

   His world file barely ever changes. His state changes constantly. So compare
   the world file as text and only rebuild when it is actually different. */
let WORLD_TXT = null;

async function load(){
  const [wTxt, sTxt] = await Promise.all([
    fetch(SRC.world+'?'+Date.now()).then(r=>r.text()),
    fetch(SRC.state+'?'+Date.now()).then(r=>r.text())]);
  const w = JSON.parse(wTxt), s = JSON.parse(sTxt);
  const worldChanged = wTxt !== WORLD_TXT;
  WORLD_TXT = wTxt;
  const first = !WORLD;
  const moved = STATE && STATE.location !== s.location;
  WORLD=w; STATE=s;

  if (worldChanged){
    PLACES_FOR_LAND = Object.values(w.places).filter(p=>p.pos && p.size);
    shapeLand();
    worldGroup.clear(); pickable.length=0; waters.length=0; foam.length=0;
    WATERS_FOR_TREES.length=0; lamps=[]; EMBERS=[]; FIRES=[]; BLOCKS.length=0; SOFT.length=0;
    for (const q of Object.values(w.places))
      if (q.kind === 'hedge' && q.pos && q.size)
        SOFT.push({x:q.pos[0], z:q.pos[2], hx:q.size[0]/2, hz:q.size[2]/2});
    for (const [id,p] of Object.entries(w.places)) buildPlace(id,p);
    TREE_SCALE = Number(w.tree_scale) > 0 ? Number(w.tree_scale) : 1.0;
    plantTrees(w);
    mergeScenery();
    buildObjects(w); buildNav(); buildTracks(); paintTracks();
    gatherLights();
  }
  hud(w,s); propVerb = null; showDoing(s.doing);
  if (first || !walk.at){ otto.position.copy(posOf(w,s.location)); walk.at=s.location; walk.path=[]; }
  else if (moved){
    const ids = route(w, walk.at, s.location).slice(1);
    walk.path = trail(w, ids, otto.position.x, otto.position.z);
    walk.i = 0; walk.t = 0; walk.yaw = otto.rotation.y;
    walk.dest = s.location;
  }
}
document.getElementById('walkbtn').onclick = () => setMode(!you.on);
load().catch(e=>{document.getElementById('doingline').textContent='could not load the lane: '+e;});
setInterval(()=>{ load().catch(()=>{}); }, 15000);   // the feed has its own loop

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  look.resize();
});

/* ---------- frame ---------- */
let last=performance.now();
(function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(now-last)/1000); last=now;

  if (STATE){
    const h = parseInt(STATE.clock.slice(11,13),10) + parseInt(STATE.clock.slice(14,16),10)/60;
    const s = skyAt(h);
    skyDome.material.uniforms.top.value.copy(s.sky);
    skyDome.material.uniforms.bot.value.copy(s.fog).lerp(new THREE.Color(0xffffff), .18);
    if (!scene.fog) scene.fog = new THREE.Fog(s.fog, 75, 360); else scene.fog.color.copy(s.fog);
    sun.color.copy(s.sun); sun.intensity = s.power * 1.12; hemi.intensity = s.amb * 0.58;
    const ang = ((h-6)/12)*Math.PI;
    sun.position.set(Math.cos(ang)*55, Math.max(26, Math.sin(ang)*60), 34);
    const night = s.power < .5 ? 1 : .25;
    for (const l of lamps){
      l.glow.intensity = l.indoor ? 34 : 9*night;
      if (!l.indoor) l.win.material.color.setHex(PAL.lamp);
    }
    for (const m of EMBERS) m.emissiveIntensity = night > .9 ? 2.3 : .2;

    for (const f of FIRES){                         // a fire does not sit still
      const j = 0.76 + Math.sin(performance.now()*0.009 + f.light.id)*0.12
                     + Math.random()*0.16;
      f.light.intensity = 6 * j;
      f.glow.color.setHSL(0.065, 0.95, 0.42 + j*0.14);
    }

    const wx = (STATE.weather||'').toLowerCase();
    rain.visible = wx.includes('rain');
    if (rain.visible){
      const a = rain.geometry.attributes.position.array;
      for (let i=1;i<a.length;i+=3){ a[i] -= dt*30; }
      for (let i=0;i<a.length;i+=6){
        if (a[i+1] < 0){ const y=30+Math.random()*6; a[i+1]=y; a[i+4]=y-.85; }
      }
      rain.geometry.attributes.position.needsUpdate = true;
    }
    if (scene.fog) scene.fog.near = wx.includes('fog') ? 14 : 75;
  }

  for (const w of waters){
    const pos = w.geometry.attributes.position, base = w.userData.base, fl = w.userData.flow;
    const t = now * .001;
    for (let i=0;i<pos.count;i++){
      const x = base[i*3], y = base[i*3+1];
      if (fl === 0){                               // a pond: it just breathes
        pos.array[i*3+2] = Math.sin(t*1.1 + x*.5 + y*.35)*.075
                         + Math.sin(t*1.7 - y*.6)*.045;
      } else {                                     // a river: the swell runs downstream
        const along = fl === 1 ? y : x, across = fl === 1 ? x : y;
        pos.array[i*3+2] = Math.sin(along*1.15 - t*3.4)*.055
                         + Math.sin(along*2.5 - t*5.1 + across*.5)*.03
                         + Math.sin(across*1.8 + t*.9)*.02;
      }
    }
    pos.needsUpdate = true;
    // normals are what make the surface catch the light, but recomputing them
    // for every pond and every river on every frame is most of a frame's work.
    // Ten times a second is indistinguishable and costs a sixth as much.
    if (now - (w.userData.normAt || 0) > 100){
      w.geometry.computeVertexNormals();
      w.userData.normAt = now;
    }
  }
  for (const f of foam){                           // bits of the surface travelling
    const d2 = f.userData;
    f.position[d2.axis] += d2.speed * dt;
    if (f.position[d2.axis] > d2.end) f.position[d2.axis] = d2.start;
    f.material.opacity = .12 + Math.sin(now*.003 + d2.seed)*.07;
  }

  if (anim.mixer) anim.mixer.update(dt);
  let moving = false, inWater = false;
  if (otto && WORLD){                  // walking
    if (walk.path.length > 1){
      if (walk.i >= walk.path.length-1){ walk.path=[]; walk.at = walk.dest || STATE.location; }
      else {
        const a = walk.path[walk.i], b = walk.path[walk.i+1];
        const leg = Math.max(0.001, Math.hypot(b.x-a.x, b.z-a.z));

        // He turns before he travels. The sharper the turn, the more it costs
        // him, which is why a corner reads as a corner rather than a pivot.
        const bearing = Math.atan2(b.x-a.x, b.z-a.z);
        let d = bearing - walk.yaw;
        while (d >  Math.PI) d -= Math.PI*2;
        while (d < -Math.PI) d += Math.PI*2;
        const turned = Math.sign(d) * Math.min(Math.abs(d), OTTO_TURN * dt);
        walk.yaw += turned;
        otto.rotation.y = walk.yaw;

        // he barely moves while he is still coming round
        const facing = Math.max(0, 1 - Math.abs(d) / 1.2);
        const speed = OTTO_SPEED * (0.18 + 0.82 * facing);

        // distance, not wall clock, so his feet stop skating
        // no hard stop at a corner: the facing term above already slows him
        // through the turn, and a dead stop freezes him mid-stride
        const adv = speed * dt;
        walk.t += adv / leg;
        walk.gait += adv * GAIT;
        if (walk.t >= 1){
          walk.t = 0; walk.i++;
          walk.at = walk.path[Math.min(walk.i, walk.path.length-1)];
        }
        otto.position.lerpVectors(a, b, Math.min(1, walk.t));
        otto.position.y = landHeight(otto.position.x, otto.position.z) + .42;
        play('walk'); moving = speed > 0.2;
      }
    } else {
      play(STATE?.asleep ? 'sleep' : 'idle');
      const herePlace = WORLD.places[STATE?.location];
      inWater = herePlace?.kind === 'water' && !STATE?.asleep;
      otto.position.y = inWater
        ? WATER_Y - 0.19 + Math.sin(now*.0016)*.03
        : landHeight(otto.position.x, otto.position.z) + .42;
    }
  }
  if (STATE) showDoing(moving || inWater ? {verb:'idle'} : STATE.doing);
  pose(moving ? 'walk' : inWater ? 'swim' : (STATE?.asleep ? 'sleep' : 'idle'), now, dt, walk.gait);
  updateWake(inWater, now, dt);
  if (you.on) stepYou(dt); else controls.update();
  cullLights(now);
  if (now - shadowAt > 190){ renderer.shadowMap.needsUpdate = true; shadowAt = now; }
  look.render();
})(performance.now());
</script>
</body></html>
