<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>the lane</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0b0a10;overflow:hidden;
    font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;color:#ece6da}
  canvas{display:block}
  :root{
    --ink:#ece6da; --dim:#8e8779; --faint:#6c6558; --warm:#f0b354;
    --panel:rgba(14,13,17,.92); --edge:rgba(236,230,218,.14);
  }
  button{font:600 11px ui-monospace,Menlo,monospace;cursor:pointer}

  /* ---- the bottom bar: one strip, three segments, like the foot of a page ---- */
  #bar{position:fixed;left:0;right:0;bottom:0;z-index:8;display:grid;
    grid-template-columns:minmax(0,0.8fr) minmax(0,1.7fr) auto;
    gap:18px;align-items:center;padding:11px 18px;
    background:linear-gradient(to top,rgba(10,9,13,.93),rgba(10,9,13,.72) 70%,transparent);
    backdrop-filter:blur(10px);border-top:1px solid rgba(236,230,218,.09)}
  #bar .seg{display:flex;align-items:center;gap:10px;min-width:0;overflow:hidden;white-space:nowrap}
  #bar .seg.mid{justify-content:center}
  #bar .seg.right{justify-content:flex-end}
  #bar .sep{width:3px;height:3px;border-radius:99px;background:var(--faint);flex:none}
  .dim{color:var(--dim)} .faint{color:var(--faint)}
  #placename{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #clock{font-variant-numeric:tabular-nums;color:var(--dim)}
  #wx{color:#8fb0cf;font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #doingline{font-size:14px;text-align:center;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;max-width:100%}
  #doingline b{color:var(--warm);font-weight:600}
  .why-in{color:var(--faint);font-size:12px}
  /* what set him off, and who. he reads your notes and acts on them; without
     this nothing on the page ever connected the two. */
  #because{position:fixed;left:14px;bottom:62px;z-index:7;width:min(330px,46vw);
    background:rgba(14,13,17,.82);border:1px solid rgba(240,179,84,.22);border-radius:9px;
    padding:8px 11px;font-size:11.5px;color:#cfc8ba;backdrop-filter:blur(10px);
    opacity:0;transition:opacity .6s;pointer-events:none}
  #because.on{opacity:1}
  #because .w{color:var(--warm)}
  .chip{display:inline-block;padding:1px 8px;border-radius:99px;font-size:10px;
    background:rgba(240,179,84,.14);color:var(--warm);border:1px solid rgba(240,179,84,.28);
    white-space:nowrap;flex:none}
  #bar .needs{display:flex;gap:7px;align-items:center;flex:none}
  #bar .nd{display:flex;gap:4px;align-items:center}
  #bar .nm{color:var(--faint);font-size:9.5px;letter-spacing:.02em}
  #bar .bar2{display:block;width:30px;height:4px;border-radius:3px;
    background:rgba(236,230,218,.12);overflow:hidden}
  #bar .fill{display:block;height:100%;border-radius:3px;transition:width .6s ease}
  #walkbtn{background:transparent;color:var(--dim);border:1px solid var(--edge);
    border-radius:7px;padding:5px 11px;flex:none}
  #walkbtn:hover{color:var(--ink);border-color:rgba(236,230,218,.3)}
  #walkbtn.on{background:var(--warm);color:#1a1510;border-color:var(--warm)}
  #livedot{width:6px;height:6px;border-radius:99px;background:#7fb77e;flex:none;display:none;
    animation:pulse 1.5s infinite}
  #livedot.on{display:block}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

  /* ---- top right: one primary action, then the archives ---- */
  #rail{position:fixed;top:14px;right:14px;z-index:9;display:flex;flex-direction:column;
    align-items:stretch;gap:5px;width:132px}
  .rb{background:rgba(14,13,17,.8);color:var(--dim);border:1px solid var(--edge);
    border-radius:8px;padding:7px 12px;text-align:right;backdrop-filter:blur(12px);
    transition:color .12s,border-color .12s}
  .rb:hover{color:var(--ink);border-color:rgba(236,230,218,.32)}
  .rb.on{color:var(--warm);border-color:rgba(240,179,84,.45)}
  .rb.primary{background:var(--warm);color:#1a1510;border-color:var(--warm);
    text-align:center;margin-bottom:4px}
  .rb.primary:hover{filter:brightness(1.07);color:#1a1510}

  /* ---- the panel: over the world, never pushing it aside ---- */
  #scrim{position:fixed;left:0;top:0;bottom:0;width:min(560px,52vw);z-index:9;display:none;
    background:linear-gradient(to right,rgba(8,7,11,.75),rgba(8,7,11,.35) 65%,transparent);
    pointer-events:none}
  #scrim.on{display:block}
  #panel{position:fixed;left:14px;top:14px;bottom:62px;width:min(430px,calc(100vw - 28px));
    z-index:10;display:none;flex-direction:column;background:var(--panel);
    border:1px solid rgba(236,230,218,.16);border-radius:13px;backdrop-filter:blur(18px)}
  #panel.on{display:flex}
  #panel header{display:flex;justify-content:space-between;align-items:center;
    padding:13px 15px 10px;border-bottom:1px solid rgba(236,230,218,.09);flex:none}
  #ptitle{margin:0;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
    color:var(--ink)}
  #pclose{background:transparent;color:var(--faint);border:1px solid rgba(236,230,218,.16);
    border-radius:6px;padding:2px 7px;font-size:10px}
  #pclose:hover{color:var(--ink)}
  #pbody{overflow-y:auto;padding:13px 15px 16px;flex:1;font-size:12.5px;line-height:1.62}
  #pbody::-webkit-scrollbar{width:7px}
  #pbody::-webkit-scrollbar-thumb{background:rgba(236,230,218,.14);border-radius:4px}
  .entry{padding:11px 0;border-bottom:1px solid rgba(236,230,218,.08)}
  .entry:last-child{border-bottom:0}
  .when{color:var(--faint);font-size:10.5px;margin-bottom:4px}
  .body{white-space:pre-wrap;word-wrap:break-word;color:#ded7c9}
  .empty{color:var(--faint);padding:26px 0;text-align:center}
  /* every fact carries where it came from. that is the whole point of him. */
  .know{padding:8px 0;border-bottom:1px solid rgba(236,230,218,.08)}
  .know:last-child{border-bottom:0}
  .src{color:var(--faint);font-size:10.5px;margin-top:2px}
  .src::before{content:'from ';opacity:.7}
  .wsrc{color:var(--faint);font-size:10.5px;margin-top:2px}
  .wsrc::before{content:'because ';opacity:.7}
  .wish{display:flex;gap:9px;padding:9px 0;border-bottom:1px solid rgba(236,230,218,.08);
    align-items:flex-start}
  .wish:last-child{border-bottom:0}
  .wdot{width:8px;height:8px;border-radius:99px;border:1.5px solid var(--faint);
    margin-top:6px;flex:none}
  .wish.done .wdot{background:#7fb77e;border-color:#7fb77e}
  .wish.done .what{color:var(--faint);text-decoration:line-through}
  .why{color:var(--dim);font-size:11.5px;margin-top:2px}
  .pill{display:inline-block;background:rgba(236,230,218,.07);border:1px solid rgba(236,230,218,.12);
    border-radius:7px;padding:2px 8px;margin:3px 4px 0 0;font-size:11.5px;color:#ded7c9;
    text-decoration:none}
  a.pill:hover{border-color:rgba(240,179,84,.4);color:var(--warm)}
  .grp{margin-bottom:17px} .grp:last-child{margin-bottom:0}
  .grph{color:var(--faint);font-size:10px;letter-spacing:.07em;text-transform:uppercase;
    margin-bottom:6px}
  .big{font-size:13.5px;color:var(--warm);padding:3px 0}
  .msg{padding:9px 12px;border-radius:10px;margin:8px 0;max-width:88%;white-space:pre-wrap;
    word-wrap:break-word}
  .from-otto{background:rgba(35,31,25,.85);border:1px solid #38312a;margin-right:auto}
  .from-me{background:rgba(28,39,51,.85);border:1px solid #2c3d4e;margin-left:auto}
  .who{font-size:9.5px;color:var(--faint);margin-bottom:3px;letter-spacing:.04em}
  .composer{display:flex;gap:7px;margin-top:13px;align-items:flex-end}
  textarea,input[type=text]{background:rgba(8,7,11,.8);color:var(--ink);
    border:1px solid rgba(236,230,218,.16);border-radius:8px;padding:9px 11px;
    font:12.5px/1.5 ui-monospace,Menlo,monospace;resize:vertical;flex:1;min-width:0}
  textarea:focus,input:focus{outline:none;border-color:rgba(240,179,84,.45)}
  .pbtn{background:var(--warm);color:#1a1510;border:0;border-radius:8px;padding:9px 15px}
  .pbtn.ghost{background:transparent;color:var(--dim);border:1px solid var(--edge)}
  .hint{font-size:10.5px;color:var(--faint);margin-top:9px}
  .tk{padding:10px 0;border-bottom:1px solid rgba(236,230,218,.08)}
  .tk:last-child{border-bottom:0}
  .tkh{color:var(--faint);font-size:10.5px;margin-bottom:5px;display:flex;gap:8px}
  .tkh b{color:var(--warm);font-weight:600}
  .act{display:grid;grid-template-columns:74px 1fr;gap:8px;padding:2px 0;font-size:11.5px;
    align-items:baseline}
  .an{color:#6b9bd1;text-align:right}
  .an.make{color:var(--warm)} .an.learn{color:#7fb77e} .an.fail{color:#d9735a}
  .ar{color:var(--dim);font-size:11px;margin-top:1px}

  /* ---- a thought drifts up and goes again, so the world looks alive ---- */
  #ticker{position:fixed;right:14px;bottom:62px;z-index:7;width:min(310px,46vw);
    display:flex;flex-direction:column;align-items:flex-end;gap:6px;pointer-events:none}
  .th{background:rgba(14,13,17,.82);border:1px solid rgba(236,230,218,.1);border-radius:9px;
    padding:8px 11px;font-size:11.5px;color:#cfc8ba;backdrop-filter:blur(10px);
    opacity:0;transform:translateY(6px);transition:opacity .6s,transform .6s}
  .th.in{opacity:1;transform:none}

  #modehint{position:fixed;left:50%;bottom:72px;transform:translateX(-50%);z-index:7;
    font-size:10.5px;color:var(--faint);background:rgba(14,13,17,.8);border-radius:8px;
    padding:6px 12px;opacity:0;transition:opacity .7s;pointer-events:none;white-space:nowrap}
  #modehint.show{opacity:1}
  #tip{position:fixed;padding:7px 10px;background:rgba(16,15,20,.95);
    border:1px solid rgba(236,230,218,.18);border-radius:8px;font-size:11px;
    pointer-events:none;opacity:0;transition:opacity .12s;max-width:250px;z-index:11;line-height:1.45}
  .made{color:var(--warm)}
  @media(max-width:760px){
    #bar{grid-template-columns:1fr;gap:7px;text-align:center}
    #bar .seg,#bar .seg.right{justify-content:center}
    #rail{width:112px} #ticker{display:none}
    #panel{width:calc(100vw - 28px)} #scrim{width:100vw}
  }
</style></head>
<body>
<div id="tip"></div>

<nav id="rail">
  <button class="rb primary" id="rb-say">say something</button>
  <button class="rb" data-v="journal">journal</button>
  <button class="rb" data-v="knows">knows</button>
  <button class="rb" data-v="wants">wants</button>
  <button class="rb" data-v="made">made</button>
  <button class="rb" data-v="thinking">thinking</button>
  <button class="rb" data-v="into">into</button>
  <button class="rb" id="rb-now" data-v="now" style="display:none">now</button>
</nav>

<div id="scrim"></div>
<aside id="panel">
  <header><h2 id="ptitle">journal</h2><button id="pclose">esc</button></header>
  <div id="pbody"></div>
</aside>

<div id="ticker"></div>
<div id="because"></div>
<div id="modehint">drag to look · click him or press Z for what he is up to · Tab to walk around</div>

<footer id="bar">
  <div class="seg left">
    <span id="livedot"></span>
    <span id="placename">the lane</span>
    <span class="sep"></span>
    <span id="clock">—</span>
    <span class="faint">tick <span id="tickno">0</span></span>
    <span id="wx"></span>
  </div>
  <div class="seg mid"><span id="doingline" class="dim">loading the lane…</span></div>
  <div class="seg right">
    <span class="chip" id="mood">…</span>
    <div class="needs" id="needs"></div>
    <button id="walkbtn">walk</button>
  </div>
</footer>
<div id="legend" style="display:none"></div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {DRACOLoader} from 'three/addons/loaders/DRACOLoader.js';
import {Reflector} from 'three/addons/objects/Reflector.js';
import {mergeGeometries} from 'three/addons/utils/BufferGeometryUtils.js';
import {makeLook} from './look.js';

/* ---------- time of day ---------- */
const SKIES = [ // hour, sky, fog, sun colour, sun strength, ambient
  [0,  0x0d1120, 0x121728, 0x8fa8d8, .30, .62],
  [5,  0x27354f, 0x2e3c57, 0xd8b595, .55, .78],
  [7,  0x8fa4bd, 0xa6b5c6, 0xffe3c2, 1.05, 1.05],
  [10, 0xa8bcd2, 0xbcc8d6, 0xfff4e2, 1.35, 1.22],
  [15, 0xb0bdcb, 0xc0c9d4, 0xfff0d6, 1.25, 1.18],
  [18, 0xc08a66, 0xc49a76, 0xffb478, .85, .92],
  [20, 0x4d4260, 0x564a66, 0xd4a8c8, .45, .70],
  [23, 0x101425, 0x151a2c, 0x8fa8d8, .30, .62],
];
function skyAt(h){
  let a = SKIES[0], b = SKIES[SKIES.length-1];
  for (let i=0;i<SKIES.length-1;i++) if (h>=SKIES[i][0] && h<=SKIES[i+1][0]){ a=SKIES[i]; b=SKIES[i+1]; break; }
  const t = (h-a[0])/Math.max(.001,(b[0]-a[0]));
  const mix=(x,y)=>new THREE.Color(x).lerp(new THREE.Color(y),t);
  return {sky:mix(a[1],b[1]), fog:mix(a[2],b[2]), sun:mix(a[3],b[3]),
          power:a[4]+(b[4]-a[4])*t, amb:a[5]+(b[5]-a[5])*t};
}

const PAL = {
  ground:0x5f5747, cobble:0x5e564a, cobbleChip:0x6d6559,
  indoor:0xc49a73, shop:0x8a9aa6, civic:0xa08794, roof:0x4e4038,
  earth:0x7d6647, hedge:0x4a6b33, water:0x2d5f73,
  lamp:0xffc98a, made:0xf0b354, gift:0x7fc4e0, otto:0xb98a5e, spine:0x6b5540
};

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(56, innerWidth/innerHeight, .35, 420);
camera.position.set(44, 46, 56);
/* antialias:false on purpose: the canvas only ever shows one full-screen quad
   of an already rendered frame, so multisampling it smooths nothing and costs
   a second full buffer. */
/* logarithmicDepthBuffer is off. It makes every fragment write its own depth,
   which switches off the early depth test, so each of the village's couple of
   thousand draws shades pixels that are already hidden. At 21 places that was
   survivable; at 38 it is slow enough that safari's watchdog kills the
   graphics process, which is what "the browser dropped the graphics" was.
   With a near of 0.35 and a far of 420 an ordinary 24-bit depth buffer has
   precision to spare. */
const renderer = new THREE.WebGLRenderer({antialias:false, powerPreference:'high-performance'});
renderer.setSize(innerWidth, innerHeight);
// On a retina screen a ratio of 2 means four times the pixels, and this look
// is a halftone: the dither pattern is the texture, so the extra resolution
// buys almost nothing and costs a lot. The post pass runs over every pixel
// too, so the saving counts twice. 'render scale' in the P panel goes lower.
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.25));  // the dither is 2px; past this is waste
renderer.shadowMap.enabled = true;
/* PCFSoft is the dearest filter there is, and under a five step dither the
   difference between a soft shadow edge and a hard one does not survive the
   pass. The map is also redrawn by hand rather than every frame: the sun moves
   with the hour and otto is the only thing in the village that walks, so five
   times a second is indistinguishable from sixty and costs a twelfth as much. */
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.shadowMap.autoUpdate = false;
renderer.shadowMap.needsUpdate = true;
let shadowAt = 0;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

/* If the browser throws the graphics context away, which safari will do when a
   scene costs it too much, the canvas just goes black and nothing says why.
   Say why. */
renderer.domElement.addEventListener('webglcontextlost', e => {
  e.preventDefault();
  console.error('[world] the graphics context was lost');
  const n = document.createElement('div');
  n.id = 'ctxlost';
  n.style.cssText = 'position:fixed;inset:0;display:grid;place-items:center;'
    + 'background:#1a1210;color:#f2e4cf;font:500 14px ui-monospace,Menlo,monospace;'
    + 'text-align:center;z-index:99;padding:24px;line-height:1.6';
  n.textContent = 'the browser dropped the graphics. reload the page.';
  document.body.appendChild(n);
}, false);
/* Deliberately no automatic reload here. If the context goes a second time
   the page would reload into losing it again, which is a loop. */
renderer.domElement.addEventListener('webglcontextrestored', () => {
  const n = document.getElementById('ctxlost');
  if (n) n.textContent = 'graphics came back. reload the page when you are ready.';
}, false);
const look = makeLook(THREE, renderer, scene, camera);
window.__dbg = {THREE, scene, camera, renderer, controls:null, you:null, walk:null, keys:null, nav:null};

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = .07;
controls.target.set(-6,0,2); controls.maxPolarAngle = Math.PI/2.1;
controls.minDistance = 7; controls.maxDistance = 140;
window.__dbg.controls = controls;

/* ---------- you, walking ---------- */
// A walk, not a flight. Speed is what a person does, turning has weight, and
// nothing starts or stops instantly. TURN is radians a second.
const EYE = 2.3, WALK = 4.2, RUN = 8.2, RADIUS = .55, TURN = 2.1;
const you = {pos:new THREE.Vector3(0,0,22), yaw:Math.PI, pitch:-0.06, on:false,
             vx:0, vz:0, vyaw:0, bob:0, camY:null, since:0};
const keys = {};
window.__dbg.you = you; window.__dbg.keys = keys;
addEventListener('keydown', e=>{
  keys[e.code] = true;
  if (e.code === 'Tab' || e.code === 'KeyO'){ e.preventDefault(); setMode(!you.on); }
  if (e.code === 'KeyZ'){ e.preventDefault(); togglePanel(panelView || 'thinking'); }
  if (e.code === 'Escape'){
    if (panelOpen()) closePanel();
    else if (you.on) document.exitPointerLock();
  }
  if (e.code === 'KeyF' && WORLD && STATE){          // f: go and find him
    const p = WORLD.places[STATE.location];
    if (p){
      if (!you.on) setMode(true);
      const [px,,pz] = p.pos, [pw,,pd] = p.size;
      const indoors = ['indoor','shop','civic'].includes(p.kind);
      const blocked = (ax,az) => BLOCKS.some(b =>
        Math.abs(ax-b.x) < b.hx + 1.2 && Math.abs(az-b.z) < b.hz + 1.2);
      let tx, tz;
      if (indoors){                       // stand outside the door, facing it
        const sideF = px < 0 ? 1 : -1;
        tx = px + sideF*(pw/2 + 5.0); tz = pz;
      } else {                            // find a clear spot looking in at him
        const reach = Math.max(pw, pd)/2 + 5;
        tx = px; tz = pz + reach;
        for (let i=0;i<12;i++){
          const a = i * Math.PI/6;
          const cx = px + Math.sin(a)*reach, cz = pz + Math.cos(a)*reach;
          if (!blocked(cx,cz) && landHeight(cx,cz) > -0.3){ tx=cx; tz=cz; break; }
        }
      }
      you.pos.set(tx, 0, tz);
      you.yaw = Math.atan2(-(px - tx), -(pz - tz));
      you.pitch = -0.12;
    }
  }
});
addEventListener('keyup', e=>{ keys[e.code] = false; });

function setMode(walking){
  you.on = walking;
  controls.enabled = !walking;
  const mh = document.getElementById('modehint');
  mh.textContent = walking
    ? 'click to look · W / S walk · A / D turn · Q / E sidestep · shift to run · F to find him'
    : 'drag to look · click him for what he is up to · Tab to walk around';
  flashHint();
  document.getElementById('walkbtn').classList.toggle('on', walking);
  if (walking){
    // start in the middle of the lane, facing up it
    const lane = (WORLD && (WORLD.places.lane_bottom || WORLD.places.lane_top));
    if (lane) you.pos.set(lane.pos[0], 0, lane.pos[2]);
    else you.pos.set(controls.target.x, 0, controls.target.z);
    you.yaw = Math.PI; you.pitch = -0.05;
    you.vx = you.vz = you.vyaw = 0; you.camY = null;
    // no pointer grab on the way in. you click when you want to look.
  } else {
    camera.position.set(44,46,56); controls.target.set(-6,0,2);
  }
}
renderer.domElement.addEventListener('click', ()=>{
  if (you.on && document.pointerLockElement !== renderer.domElement)
    renderer.domElement.requestPointerLock();
});
addEventListener('mousemove', e=>{
  if (!you.on || document.pointerLockElement !== renderer.domElement) return;
  you.yaw   -= e.movementX * 0.0022;
  you.pitch -= e.movementY * 0.0022;
  you.pitch = Math.max(-1.35, Math.min(1.1, you.pitch));
});

function slide(nx, nz){
  // push out of any wall we have walked into
  for (const b of BLOCKS.concat(SOFT)){
    const dx = nx - b.x, dz = nz - b.z;
    const ox = b.hx + RADIUS - Math.abs(dx);
    const oz = b.hz + RADIUS - Math.abs(dz);
    if (ox > 0 && oz > 0){
      if (ox < oz) nx = b.x + Math.sign(dx || 1) * (b.hx + RADIUS);
      else         nz = b.z + Math.sign(dz || 1) * (b.hz + RADIUS);
    }
  }
  return [nx, nz];
}

/* ---------- footsteps, made rather than loaded ----------
   No audio files: the sandbox cannot fetch any and the page should not wait on
   a download to feel alive. Each step is a short burst of noise shaped to the
   ground he is standing on. Grass is a dull thud, a floor is a sharp knock,
   water is a slap. */
let ACTX = null, NOISE = null, stepDist = 0, stepLeft = false;
function audio(){
  if (ACTX) return ACTX;
  try { ACTX = new (window.AudioContext || window.webkitAudioContext)(); }
  catch(e){ return null; }
  const n = ACTX.sampleRate * 0.4;
  NOISE = ACTX.createBuffer(1, n, ACTX.sampleRate);
  const d = NOISE.getChannelData(0);
  for (let i=0;i<n;i++) d[i] = Math.random()*2 - 1;
  return ACTX;
}
addEventListener('pointerdown', () => { const c = audio(); if (c && c.state === 'suspended') c.resume(); });

// which place you are standing in, so the ground can sound like itself
function placeAt(x, z){
  if (!WORLD) return null;
  for (const k in WORLD.places){
    const p = WORLD.places[k];
    if (!p.pos || !p.size) continue;
    if (Math.abs(x - p.pos[0]) <= p.size[0]/2 && Math.abs(z - p.pos[2]) <= p.size[2]/2) return p;
  }
  return null;
}

const SURFACES = {
  soft:  {cut: 620,  q: 0.8, len: 0.13, gain: 0.055, type: 'lowpass'},
  hard:  {cut: 1900, q: 1.3, len: 0.07, gain: 0.075, type: 'bandpass'},
  water: {cut: 380,  q: 0.7, len: 0.22, gain: 0.085, type: 'lowpass'},
};
function surfaceAt(x, z){
  const p = placeAt(x, z);
  const kind = (p && p.kind) || '';
  if (kind === 'water') return SURFACES.water;
  if (/indoor|shop|civic|library|post|house|room/.test(kind + ' ' + ((p&&p.id)||''))) return SURFACES.hard;
  return SURFACES.soft;
}

function step(x, z, loud){
  const c = audio(); if (!c || c.state !== 'running' || !NOISE) return;
  const s = surfaceAt(x, z);
  const src = c.createBufferSource(); src.buffer = NOISE;
  const f = c.createBiquadFilter();
  f.type = s.type;
  f.frequency.value = s.cut * (0.86 + Math.random()*0.28);   // no two steps alike
  f.Q.value = s.q;
  const g = c.createGain();
  const t = c.currentTime;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(s.gain * loud, t + 0.006);
  g.gain.exponentialRampToValueAtTime(0.0001, t + s.len);
  src.connect(f); f.connect(g); g.connect(c.destination);
  src.start(t); src.stop(t + s.len + 0.02);
}

function footfall(speed, dt){
  if (speed < 0.35){ stepDist = 1.1; return; }      // primed, so moving off steps at once
  stepDist += speed * dt;
  const stride = speed > WALK * 1.3 ? 1.75 : 1.25;
  if (stepDist >= stride){
    stepDist = 0;
    stepLeft = !stepLeft;
    step(you.pos.x, you.pos.z, stepLeft ? 1 : 0.82);  // left and right differ slightly
  }
}

/* ---------- looking: drag, or click to hold the pointer ---------- */
let dragging = false, lastPt = null;
renderer.domElement.addEventListener('pointerdown', e => {
  if (!you.on || document.pointerLockElement === renderer.domElement) return;
  dragging = true; lastPt = [e.clientX, e.clientY];
  renderer.domElement.setPointerCapture?.(e.pointerId);
});
addEventListener('pointerup', e => {
  dragging = false; lastPt = null;
  renderer.domElement.releasePointerCapture?.(e.pointerId);
});
addEventListener('pointermove', e => {
  if (!dragging || !you.on || !lastPt) return;
  you.yaw   -= (e.clientX - lastPt[0]) * 0.0042;
  you.pitch -= (e.clientY - lastPt[1]) * 0.0042;
  you.pitch = Math.max(-1.35, Math.min(1.1, you.pitch));
  lastPt = [e.clientX, e.clientY];
});

const LOOKV = new THREE.Vector3();
function stepYou(dt){
  // a key pressed while writing to him is writing, not walking
  const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName || '');
  const k = c => !typing && !!keys[c];

  const f      = (k('KeyW')||k('ArrowUp')   ?1:0) - (k('KeyS')||k('ArrowDown') ?1:0);
  const turn   = (k('KeyA')||k('ArrowLeft') ?1:0) - (k('KeyD')||k('ArrowRight')?1:0);
  const strafe = (k('KeyE')?1:0) - (k('KeyQ')?1:0);
  const run    = k('ShiftLeft') || k('ShiftRight');

  // turning eases in and out, which is most of what makes it read as a body
  const wantYaw = turn * TURN * (run ? 1.3 : 1);
  you.vyaw += (wantYaw - you.vyaw) * Math.min(1, dt * 9);
  you.yaw  += you.vyaw * dt;

  // water does not stop you, it slows you and comes up to your waist
  const standing = placeAt(you.pos.x, you.pos.z);
  const wading = !!standing && standing.kind === 'water';
  const sp = (run ? RUN : WALK) * (wading ? 0.42 : 1);
  const sinY = Math.sin(you.yaw), cosY = Math.cos(you.yaw);
  let wx = 0, wz = 0;
  if (f || strafe){
    const len = Math.hypot(f, strafe);
    wx = (-sinY*f/len + cosY*strafe/len) * sp;
    wz = (-cosY*f/len - sinY*strafe/len) * sp;
  }
  // getting going takes a moment, stopping takes a shorter one
  const a = 1 - Math.exp(-dt * ((wx||wz) ? 7 : 11));
  you.vx += (wx - you.vx) * a;
  you.vz += (wz - you.vz) * a;
  if (Math.abs(you.vx) < .012) you.vx = 0;
  if (Math.abs(you.vz) < .012) you.vz = 0;

  if (you.vx || you.vz){
    let [nx, nz] = slide(you.pos.x + you.vx*dt, you.pos.z + you.vz*dt);
    you.pos.x = Math.max(-96, Math.min(96, nx));
    you.pos.z = Math.max(-96, Math.min(96, nz));
  }

  const speed = Math.hypot(you.vx, you.vz);
  you.bob += dt * speed * 1.9;
  const amp  = Math.min(speed / WALK, 1.4) * 0.055;
  const bobY = Math.sin(you.bob * 2) * amp;
  const roll = Math.sin(you.bob) * amp * 0.32;

  // the ground is caught up with rather than snapped to, so a step is a step
  const g = wading ? WATER_Y + EYE*0.56
                   : Math.max(landHeight(you.pos.x, you.pos.z), -0.6) + EYE;
  you.camY = you.camY == null ? g : you.camY + (g - you.camY) * Math.min(1, dt * 12);

  camera.position.set(you.pos.x, you.camY + bobY, you.pos.z);
  LOOKV.set(you.pos.x - Math.sin(you.yaw)*Math.cos(you.pitch),
            camera.position.y + Math.sin(you.pitch),
            you.pos.z - Math.cos(you.yaw)*Math.cos(you.pitch));
  camera.lookAt(LOOKV);
  if (roll) camera.rotateZ(roll);
  footfall(speed, dt);
}

/* ---------- terrain ---------- */
const LAND = {size:420, seg:260};
let PLACES_FOR_LAND = [];
function noise(x,z){
  // irrational-ish frequencies so it does not band into rings
  return Math.sin(x*.0413 + 0.9)*1.30
       + Math.sin(z*.0317 + 2.1)*1.10
       + Math.sin((x*.71 + z*.63)*.0529 + 0.3)*.70
       + Math.sin((x*.37 - z*.89)*.0881 + 1.9)*.34
       + Math.sin((x*1.13 + z*.41)*.1733 + 4.2)*.15;
}
function smoothstep(e0,e1,v){ const t=Math.min(1,Math.max(0,(v-e0)/(e1-e0))); return t*t*(3-2*t); }

function landHeight(x,z){
  let h = noise(x,z)*0.62 - 0.3;
  const far = Math.sqrt(x*x + z*z);
  if (far > 95) h += (far-95)*0.14;      // ground rises away, so there is no cliff edge
  for (const p of PLACES_FOR_LAND){
    const [px,,pz] = p.pos, [pw,,pd] = p.size;
    // normalised distance from the place footprint, 0 inside, 1 well outside
    const dx = Math.max(0, Math.abs(x-px) - pw/2), dz = Math.max(0, Math.abs(z-pz) - pd/2);
    const out = Math.sqrt(dx*dx + dz*dz);
    const inf = 1 - smoothstep(0, p.kind==='water' ? 9.0 : 4.0, out);
    if (inf <= 0) continue;
    let level = 0;
    if (p.kind === 'water'){
      const ix = Math.max(0, 1 - Math.abs(x-px)/(pw/2));
      const iz = Math.max(0, 1 - Math.abs(z-pz)/(pd/2));
      const rr = Math.sqrt(Math.pow((x-px)/(pw/2),2) + Math.pow((z-pz)/(pd/2),2));
      level = -0.3 - 1.9 * Math.max(0, 1 - rr*rr);   // a bowl, deepest in the middle
    }
    h = h*(1-inf) + level*inf;
  }
  return h;
}

const landGeo = new THREE.PlaneGeometry(LAND.size, LAND.size, LAND.seg, LAND.seg);
const landMat = new THREE.MeshStandardMaterial({vertexColors:true, roughness:1});
const ground = new THREE.Mesh(landGeo, landMat);
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);

function shapeLand(){
  const pos = landGeo.attributes.position, n = pos.count;
  const cols = new Float32Array(n*3);
  const grass = new THREE.Color(0x66763f), dirt = new THREE.Color(0x6f5d3c),
        mud = new THREE.Color(0x443825), high = new THREE.Color(0x7d8850);
  const c = new THREE.Color();
  for (let i=0;i<n;i++){
    const x = pos.getX(i), y = pos.getY(i);        // plane local, y becomes world z
    const hgt = landHeight(x, -y);
    pos.setZ(i, hgt);
    if (hgt < -0.5)      c.copy(mud);
    else if (hgt < -0.1) c.copy(mud).lerp(dirt, smoothstep(-0.5,-0.1,hgt));
    else                 c.copy(dirt).lerp(hgt>0.5?high:grass, smoothstep(-0.1,0.9,hgt));
    c.offsetHSL(0,0,(Math.sin(x*3.1+y*2.3)*.5)*.03);
    cols[i*3]=c.r; cols[i*3+1]=c.g; cols[i*3+2]=c.b;
  }
  landGeo.setAttribute('color', new THREE.BufferAttribute(cols,3));
  pos.needsUpdate = true; landGeo.computeVertexNormals();
}

const skyDome = new THREE.Mesh(
  new THREE.SphereGeometry(300, 32, 16),
  new THREE.ShaderMaterial({side:THREE.BackSide, depthWrite:false, uniforms:{
    top:{value:new THREE.Color(0x6f89ad)}, bot:{value:new THREE.Color(0xc8b79c)}},
    vertexShader:'varying vec3 vP; void main(){ vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
    fragmentShader:'uniform vec3 top; uniform vec3 bot; varying vec3 vP; void main(){ float h=clamp(vP.y/180.0*0.5+0.5,0.0,1.0); gl_FragColor=vec4(mix(bot,top,pow(h,0.75)),1.0); }'}));
scene.add(skyDome);

const worldGroup = new THREE.Group(); scene.add(worldGroup);

/* ---------- what is beyond the village ----------
   None of this is his. It is not in world.json, it has no collision and no
   pathfinding, and he cannot walk to any of it. That is the point: it costs
   nothing at all and it is what stops the village reading as a few buildings
   on an empty lawn. Fog does most of the work; distance does the rest. */
const backdrop = new THREE.Group();
scene.add(backdrop);
(function buildBackdrop(){
  let seed = 20261101;
  const rnd = () => (seed = (seed*1664525 + 1013904223) % 4294967296) / 4294967296;
  /* None of this moves, animates or can be clicked, so there is no reason for
     it to be hundreds of separate objects. Everything sharing a colour is baked
     into one piece of geometry and drawn once. */
  const MATS = new Map();
  const mat = (col, rough=1) => {
    const k = col + '|' + rough;
    if (!MATS.has(k)) MATS.set(k, new THREE.MeshStandardMaterial(
      {color:col, roughness:rough, flatShading:true}));
    return MATS.get(k);
  };
  const batches = new Map();                 // material -> geometries waiting
  const bake = (geo, m, px, py, pz, sx=1, sy=1, sz=1, rot=0) => {
    const c = geo.clone();
    if (sx !== 1 || sy !== 1 || sz !== 1) c.scale(sx, sy, sz);
    if (rot) c.rotateY(rot);
    c.translate(px, py, pz);
    if (!batches.has(m)) batches.set(m, []);
    batches.get(m).push(c);
  };
  const put = (geo, m, r, bearing, y=0, sx=1, sy=1, sz=1, rot=0) =>
    bake(geo, m, Math.sin(bearing)*r, y, Math.cos(bearing)*r, sx, sy, sz, rot);

  // hills: overlapping enough to make one ridge rather than a row of lumps
  const hillGeo = new THREE.IcosahedronGeometry(1, 1);
  for (let i=0;i<34;i++){
    const b = (i/34)*Math.PI*2 + (rnd()-0.5)*0.12;
    const r = 188 + rnd()*62;
    const w = 58 + rnd()*62, h = 22 + rnd()*34;
    put(hillGeo, mat(rnd() > .55 ? 0x5d6652 : 0x525c4d), r, b, -6, w, h, w*0.75);
  }

  // woods, in clumps. scattered evenly they read as boulders; in stands with
  // gaps between them they read as trees you could walk into.
  const treeGeo = new THREE.ConeGeometry(1, 1, 6);
  for (let c=0;c<16;c++){
    const cb = rnd()*Math.PI*2, cr = 98 + rnd()*72;
    const cx = Math.sin(cb)*cr, cz = Math.cos(cb)*cr;
    const n = 10 + Math.floor(rnd()*16);
    for (let i=0;i<n;i++){
      const a = rnd()*Math.PI*2, d = rnd()*15;
      const x = cx + Math.sin(a)*d, z = cz + Math.cos(a)*d;
      const h = 8 + rnd()*9, w = 1.9 + rnd()*1.7;
      bake(treeGeo, mat(rnd() > .5 ? 0x38462b : 0x44532f),
           x, landHeight(x,z) + h*0.5 - 0.6, z, w, h, w);
    }
  }

  // No decorative church any more: there is a real one in the world now, at the
  // end of the track out of the village, and he can walk to it. Two churches on
  // one skyline is one too many.

  // a town a long way off, on the far side of the river. he has never been.
  (function town(){
    const base = 2.35, r0 = 258, stone = mat(0x6e7380), pale = mat(0x80838c);
    const BOX = new THREE.BoxGeometry(1,1,1);
    for (let i=0;i<46;i++){
      const b = base + (rnd()-0.5)*0.62;
      const r = r0 + (rnd()-0.5)*54;
      const h = 8 + rnd()*rnd()*52;
      const w = 5 + rnd()*9;
      put(BOX, rnd() > .7 ? pale : stone, r, b, h/2 - 2, w, h, w*0.85, rnd()*0.5);
    }
  })();

  // everything collected above becomes one mesh per colour
  for (const [m, parts] of batches){
    if (!parts.length) continue;
    backdrop.add(new THREE.Mesh(mergeGeometries(parts, false), m));
    for (const q of parts) q.dispose();
  }
})();
/* ---------- only light what is near ----------
   Twenty-eight point lights, and in a forward renderer every fragment of every
   surface is shaded against all of them whether they reach it or not. Each of
   these has a falloff of a few paces, so a lamp on the far side of the village
   contributes nothing to what you are looking at and still costs the same.

   So the nearest few are left on and the rest are switched off. The number left
   on never changes, because changing it makes three.js recompile every shader
   in the scene, which is a far worse stutter than the one we are fixing. */
const LIT = {all: [], on: 8, at: 0, v: new THREE.Vector3()};
function gatherLights(){
  LIT.all = [];
  worldGroup.traverse(o => { if (o.isPointLight) LIT.all.push(o); });
}
function cullLights(now){
  if (now - LIT.at < 180) return;              // six times a second is plenty
  LIT.at = now;
  if (LIT.all.length <= LIT.on){
    for (const l of LIT.all) l.visible = true;
    return;
  }
  for (const l of LIT.all){
    l.getWorldPosition(LIT.v);
    l.userData._d = LIT.v.distanceToSquared(camera.position);
  }
  LIT.all.sort((a, b) => a.userData._d - b.userData._d);
  for (let i = 0; i < LIT.all.length; i++) LIT.all[i].visible = i < LIT.on;
}
