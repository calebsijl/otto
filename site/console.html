<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>otto</title>
<style>
  :root{
    --bg:#13120f; --panel:#1b1916; --edge:#2e2a24; --ink:#ece6da; --dim:#8e8779;
    --warm:#f0b354; --cool:#7fb0d4; --good:#8fbf7a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.65 ui-monospace,SFMono-Regular,Menlo,monospace}
  a{color:var(--warm);text-decoration:none} a:hover{text-decoration:underline}
  header{position:sticky;top:0;z-index:5;background:rgba(19,18,15,.93);
    backdrop-filter:blur(14px);border-bottom:1px solid var(--edge);padding:13px 20px;
    display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  h1{margin:0;font-size:15px;letter-spacing:.01em}
  .state{color:var(--dim);font-size:12px;display:flex;gap:14px;flex-wrap:wrap;
    align-items:center;font-variant-numeric:tabular-nums}
  .chip{padding:1px 8px;border-radius:99px;font-size:11px;background:rgba(240,179,84,.13);
    color:var(--warm);border:1px solid rgba(240,179,84,.26)}
  .needs{display:flex;gap:9px;flex-wrap:wrap}
  .need{display:flex;gap:5px;align-items:center;font-size:11px;color:var(--dim)}
  .bar{display:inline-block;width:52px;height:5px;border-radius:3px;background:#2e2a24;overflow:hidden;vertical-align:middle}
  .fill{display:block;height:100%;border-radius:3px;transition:width .5s ease}
  nav.tabs{display:flex;gap:4px;padding:14px 0 0;flex-wrap:wrap}
  .tab{padding:7px 14px;border-radius:8px 8px 0 0;cursor:pointer;color:var(--dim);
    border:1px solid transparent;font-size:13px;user-select:none}
  .tab:hover{color:var(--ink)}
  .tab.on{background:var(--panel);border-color:var(--edge);border-bottom-color:var(--panel);
    color:var(--ink)}
  main{max-width:860px;margin:0 auto;padding:0 20px 80px}
  section{margin-top:-1px}
  section{display:none} section.on{display:block}
  .box{background:var(--panel);border:1px solid var(--edge);border-radius:0 11px 11px 11px;
    padding:18px}
  .entry{padding:14px 0;border-bottom:1px solid var(--edge)}
  .entry:last-child{border-bottom:0}
  .when{color:var(--dim);font-size:11px;margin-bottom:5px}
  .body{white-space:pre-wrap;word-wrap:break-word}
  .msg{padding:11px 14px;border-radius:11px;margin:9px 0;max-width:86%;white-space:pre-wrap}
  .from-otto{background:#231f19;border:1px solid #38312a;margin-right:auto}
  .from-me{background:#1c2733;border:1px solid #2c3d4e;margin-left:auto;text-align:left}
  .who{font-size:10px;color:var(--dim);margin-bottom:4px;letter-spacing:.04em}
  .composer{display:flex;gap:9px;margin-top:18px;align-items:flex-end;flex-wrap:wrap}
  textarea,input{background:#100f0d;color:var(--ink);border:1px solid var(--edge);
    border-radius:9px;padding:11px 13px;font:14px/1.5 ui-monospace,Menlo,monospace;
    resize:vertical;flex:1;min-width:200px}
  textarea:focus,input:focus{outline:none;border-color:#50473c}
  button{background:var(--warm);color:#1a1510;border:0;border-radius:9px;padding:11px 20px;
    font:600 13px ui-monospace,Menlo,monospace;cursor:pointer}
  button:hover{filter:brightness(1.08)} button:disabled{opacity:.45;cursor:default}
  button.ghost{background:transparent;color:var(--dim);border:1px solid var(--edge)}
  .wish{display:flex;gap:11px;padding:12px 0;border-bottom:1px solid var(--edge);align-items:flex-start}
  .wish:last-child{border-bottom:0}
  .dot{width:9px;height:9px;border-radius:99px;border:1.5px solid var(--dim);margin-top:6px;flex:none}
  .wish.done .dot{background:var(--good);border-color:var(--good)}
  .wish.done .what{color:var(--dim);text-decoration:line-through}
  .why{color:var(--dim);font-size:12px;margin-top:3px}
  .empty{color:var(--dim);padding:28px 0;text-align:center;font-size:13px}
  .know{padding:9px 0;border-bottom:1px solid var(--edge);font-size:13px}
  .know:last-child{border-bottom:0}
  .src{color:var(--dim);font-size:11px}
  .hint{color:var(--dim);font-size:11px;margin-top:9px}
  .pill{display:inline-block;background:#231f19;border:1px solid #38312a;border-radius:7px;
    padding:3px 9px;margin:3px 4px 0 0;font-size:12px}
  .livebar{font-size:12px;color:var(--dim);padding:9px 12px;border-radius:9px;
    background:#17160f;border:1px solid var(--edge);margin-bottom:16px}
  .livebar.on{color:var(--good);border-color:#2f4a2a;background:#15200f}
  code{background:#0f0e0c;padding:2px 6px;border-radius:5px;font-size:11px}
  #livedot{display:none;width:7px;height:7px;border-radius:99px;background:#8fbf7a;
    margin-left:7px;vertical-align:middle;animation:pulse 1.4s infinite}
  #livedot.on{display:inline-block}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .tk{padding:13px 0;border-bottom:1px solid var(--edge)}
  .tk:last-child{border-bottom:0}
  .tkh{color:var(--dim);font-size:11px;margin-bottom:7px;display:flex;gap:9px}
  .tkh b{color:var(--warm);font-weight:600}
  .act{display:grid;grid-template-columns:86px 1fr;gap:9px;padding:3px 0;font-size:12.5px;
    align-items:baseline}
  .an{color:var(--cool);text-align:right}
  .ai{color:var(--ink)} .ar{color:var(--dim);font-size:11.5px;margin-top:1px}
  .an.make{color:var(--warm)} .an.learn{color:var(--good)} .an.fail{color:#d9735a}
  .grp{margin-bottom:22px}
  .grph{color:var(--dim);font-size:11px;letter-spacing:.05em;text-transform:uppercase;
    margin-bottom:8px}
  .big{font-size:15px;color:var(--warm);padding:4px 0}
  @media(max-width:600px){.msg{max-width:100%}}
</style></head>
<body>
<header>
  <h1>otto</h1>
  <span class="chip" id="mood">…</span>
  <div class="state">
    <span id="where">—</span><span id="clock"></span>
    <div class="needs" id="needs"></div>
  </div>
  <span style="flex:1"></span>
  <a href="/world.html">the lane →</a>
</header>

<main><nav class="tabs">
  <div class="tab on" data-p="now">now<span id="livedot"></span></div>
  <div class="tab" data-p="talk">talk</div>
  <div class="tab" data-p="interests">into</div>
  <div class="tab" data-p="journal">journal</div>
  <div class="tab" data-p="wishes">wants</div>
  <div class="tab" data-p="knows">knows</div>
  <div class="tab" data-p="thoughts">thinking</div>
  <div class="tab" data-p="made">made</div>
</nav>
  <section id="now" class="on"><div class="box">
    <div class="livebar" id="livebar">nothing running. start a day with
      <code>python3 tick.py --ticks 45</code> and it will appear here as it happens.</div>
    <div id="feed"></div>
  </div></section>

  <section id="interests"><div class="box"><div id="ifeed"></div></div></section>

  <section id="talk"><div class="box">
    <div id="thread"></div>
    <div class="composer">
      <textarea id="say" rows="2" placeholder="tell him something, or answer one of his questions"></textarea>
      <button id="send">send</button>
    </div>
    <div class="composer">
      <input id="gift" placeholder="send him a thing: a small saw, a bag of lead weights, a book about rivers">
      <button id="post" class="ghost">post it</button>
    </div>
    <div class="hint">he reads these the next time he wakes. he may well ignore them.</div>
  </div></section>

  <section id="journal"><div class="box"><div id="jfeed"></div></div></section>
  <section id="wishes"><div class="box"><div id="wfeed"></div></div></section>
  <section id="knows"><div class="box"><div id="kfeed"></div></div></section>
  <section id="thoughts"><div class="box"><div id="tfeed"></div></div></section>
  <section id="made"><div class="box"><div id="mfeed"></div></div></section>
</main>

<script>
// your key, from ?key=... the first time, remembered after that
const KEY = (() => {
  const u = new URLSearchParams(location.search).get('key');
  try { if (u){ localStorage.setItem('ottokey', u);
                history.replaceState({}, '', location.pathname); } 
        return u || localStorage.getItem('ottokey') || ''; }
  catch(e){ return u || ''; }
})();

const NEEDC={energy:'#8fbf7a',fullness:'#e0a458',warmth:'#d9735a',calm:'#7fb0d4',wonder:'#b07fc7'};
const esc=s=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const el=id=>document.getElementById(id);

document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));
  document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id===t.dataset.p));
});

function render(d){
  const s=d.state||{};
  el('where').textContent = s.location ? s.location.replace(/_/g,' ') : '';
  el('clock').textContent = s.clock ? s.clock.slice(11,16)+' · tick '+s.tick : '';
  el('mood').textContent = s.asleep ? 'asleep' : (s.mood||'awake');
  el('needs').innerHTML = Object.entries(s.needs||{}).map(([k,v])=>
    `<span class="need" title="${k}: ${Math.round(v*100)}">${k.slice(0,4)}`
    + `<span class="bar"><span class="fill" style="width:${Math.round(v*100)}%;`
    + `background:${NEEDC[k]||'#888'}"></span></span></span>`).join('');

  // one thread, both directions, newest at the bottom
  const thread=[...(d.from_otto||[]).map(m=>({...m,who:'otto'})),
                ...(d.to_otto||[]).map(m=>({...m,who:'me'}))]
    .sort((a,b)=>String(a.t||'').localeCompare(String(b.t||'')));
  el('thread').innerHTML = thread.length ? thread.map(m=>
    `<div class="msg ${m.who==='otto'?'from-otto':'from-me'}">`
    + `<div class="who">${m.who==='otto'?'otto':'you'} · `
    + `${esc(String(m.t||'').slice(5,16).replace('T',' '))}</div>`
    + `${esc((m.text||'').trim())}</div>`).join('')
    : '<div class="empty">nothing said yet.</div>';

  el('jfeed').innerHTML = (d.journal||[]).length ? d.journal.map(e=>
    `<div class="entry"><div class="when">${esc(e.when)}</div>`
    + `<div class="body">${esc((e.text||'').trim())}</div></div>`).join('')
    : '<div class="empty">he has not written anything yet.</div>';

  const w=d.wishes||[];
  el('wfeed').innerHTML = w.length ? w.map(x=>
    `<div class="wish ${x.done?'done':''}"><div class="dot"></div><div>`
    + `<div class="what">${esc(x.want)}</div>`
    + `${x.why?`<div class="why">${esc(x.why)}</div>`:''}</div></div>`).join('')
    : '<div class="empty">he does not want anything yet.</div>';

  el('kfeed').innerHTML = (d.knows||[]).length ? d.knows.map(k=>{
    const m=k.match(/^(.*?)\s*\[(.+)\]\s*$/);
    return `<div class="know">${esc(m?m[1]:k)}${m?`<div class="src">${esc(m[2])}</div>`:''}</div>`;
  }).join('') : '<div class="empty">he knows nothing yet.</div>';

  el('tfeed').innerHTML = (d.thoughts||[]).length ? d.thoughts.map(t=>
    `<div class="entry"><div class="when">tick ${t.tick}</div>`
    + `<div class="body">${esc((t.text||'').trim())}</div></div>`).join('')
    : '<div class="empty">nothing here yet.</div>';

  el('mfeed').innerHTML = (d.pages||[]).length
    ? (d.pages||[]).map(p=>`<a class="pill" href="/${p}">${esc(p)}</a>`).join('')
    : '<div class="empty">he has not made any pages yet.</div>';
}

const LOUD=new Set(['write_site','learn','wish','journal','message','test','edit_world']);
function renderNow(d){
  const live=!!d.live;
  document.getElementById('livedot').className = live?'on':'';
  const lb=el('livebar');
  lb.className = 'livebar' + (live?' on':'');
  lb.innerHTML = live
    ? 'running now · this updates every two seconds'
    : 'nothing running. start a day with <code>python3 tick.py --ticks 45</code> '
      + 'and it will appear here as it happens.';
  const a=d.activity||[];
  el('feed').innerHTML = a.length ? a.map(t=>
    `<div class="tk"><div class="tkh"><b>tick ${t.tick}</b><span>${esc(t.clock)}</span>`
    + `<span>${esc(t.mood)}</span></div>`
    + (t.calls.length ? t.calls.map(c=>{
        const cls = c.name==='write_site'||c.name==='edit_world' ? 'make'
                  : c.name==='learn'||c.name==='wish' ? 'learn'
                  : /fail|wrong|not here|cannot/i.test(c.result||'') ? 'fail' : '';
        const arg = Object.values(c.input||{}).filter(v=>typeof v!=='object')
                      .map(v=>String(v)).join(' · ').slice(0,120);
        return `<div class="act"><span class="an ${cls}">${esc(c.name)}</span><span>`
             + `<span class="ai">${esc(arg)}</span>`
             + (LOUD.has(c.name)||cls==='fail'
                 ? `<div class="ar">${esc(c.result)}</div>` : '')
             + `</span></div>`;
      }).join('') : '<div class="ar">nothing. he slept.</div>')
    + `</div>`).join('') : '<div class="empty">he has not done anything yet.</div>';
  return live;
}

function renderInterests(d){
  const i=d.interests||{};
  const grp=(title,inner)=> inner ? `<div class="grp"><div class="grph">${title}</div>${inner}</div>` : '';
  const pills=a=>(a||[]).map(x=>`<span class="pill">${esc(String(x))}</span>`).join('');
  el('ifeed').innerHTML =
    grp('what has hold of him', (i.chasing||[]).map(c=>`<div class="big">${esc(c)}</div>`).join(''))
  + grp('what he has gone looking for', pills(i.searches))
  + grp('what he is reading', (i.books||[]).map(([b,n])=>
        `<span class="pill">${esc(b)} · ${n} sittings</span>`).join(''))
  + grp('what he keeps testing', (i.tested||[]).map(([t,n])=>
        `<span class="pill">${esc(t)} × ${n}</span>`).join(''))
  + grp('what he has built', pills(i.built))
  + grp('where his knowledge came from', Object.entries(i.sources||{}).map(([k,v])=>
        `<span class="pill">${esc(k)} · ${v}</span>`).join(''))
  || '<div class="empty">nothing yet. he has not lived.</div>';
}

let timer=null;
async function load(){
  try{
    const d=await (await fetch('/api/feed?'+Date.now())).json();
    render(d); const live=renderNow(d); renderInterests(d);
    if (d.readonly && !KEY && !document.body.dataset.ro){
      document.body.dataset.ro = '1';
      document.querySelectorAll('#talk .composer').forEach(c => c.style.display='none');
      const h = document.querySelector('#talk .hint');
      if (h) h.textContent = 'you are watching. only caleb can send him things.';
    }
    const want = live ? 2000 : 10000;
    if (timer?.ms !== want){
      clearInterval(timer?.id);
      timer={ms:want, id:setInterval(load, want)};
    }
  }catch(e){}
}
async function post(url, body, btn){
  btn.disabled=true;
  try{
    const r = await fetch(url, {method:'POST',
      headers:{'Content-Type':'application/json', 'X-Otto-Key': KEY},
      body: JSON.stringify(body)});
    const j = await r.json().catch(()=>({}));
    if (j && j.ok === false && j.error) alert(j.error);
    await load();
  } finally { btn.disabled=false; }
}
el('send').onclick=async()=>{
  const t=el('say').value.trim(); if(!t) return;
  el('say').value=''; await post('/api/say',{text:t},el('send'));
};
el('say').addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key==='Enter') el('send').click();
});
el('post').onclick=async()=>{
  const n=el('gift').value.trim(); if(!n) return;
  el('gift').value=''; await post('/api/parcel',{name:n},el('post'));
};
load();
</script>
</body></html>
